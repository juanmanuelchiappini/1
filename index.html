// ---------------- MESAS DE FINAL ----------------
const Finales = {
  async rendir(s) {
    const code = s.code, M = MATERIAS[code], m = S.materias[code], P = PROFES[s.prof]; ensureProfe(s.prof); const st = S.profes[s.prof];
    const o = { name: P.nombre, portrait: profPortrait(s.prof) };
    const late = Math.max(0, S.time - s.ini);
    Audio8.sfx('bell');
    await UI.say([`Mesa de final de ${M.nombre}.`, late > 0 ? `Llegaste ${Math.round(late)} minutos tarde: vas a tener menos tiempo.` : P.examen], o);
    const exig = P.exig === 'Impredecible' ? ['Baja', 'Media', 'Alta'][Math.floor(Math.random() * 3)] : P.exig;
    const hadReglas = S.inv.reglas && code.startsWith('CAT');
    const comodines = await Examen.elegirComodines(CONFIG.comodinesPorEstudio(S.estudio));
    const { qs, rest } = Academia.pickQuestions(code, 'fin', P);
    Audio8.play('examen');
    const res = await Examen.run({ code, which: 'F', qs, P, pac: P.pac, exig, late, comodines, catalogacion: code.startsWith('CAT') });
    Audio8.play(W.map.music);
    const tot = Math.round(res.total * 2) / 2;
    S.mesas = S.mesas.filter(c => c !== code); m.rindioHoy = S.week * 10 + S.day;
    S.stats.exams++; st.desc.exig = true; st.desc.prof = true;
    if (hadReglas) S.inv.reglas = false;
    let resultado;
    if (tot >= 3) resultado = await this.aprobar(code, Math.round(tot * 2), o, `Sacaste ${fmtN(tot)} de 5.`);
    else if (tot >= 2) {
      await UI.say([`Sacaste ${fmtN(tot)}. Estás en el límite...`, 'Te hago una pregunta más. Si la respondés bien, aprobás.'], o);
      const pool = [...rest, ...M.p1, ...M.p2].filter(q => q.t === 'mc' || q.t === 'vf');
      const q = pool[Math.floor(Math.random() * pool.length)];
      const opts = q.t === 'vf' ? ['Verdadero', 'Falso'] : shuffle(q.o.slice(0, 4));
      const r = await UI.choose(q.q, opts, o);
      const ok = q.t === 'vf' ? (r === 0) === q.a : opts[r] === q.o[0];
      if (ok) { Audio8.sfx('good'); resultado = await this.aprobar(code, 4, o, '¡Bien! Con lo justo, pero aprobaste.'); }
      else {
        Audio8.sfx('bad'); m.finales.push({ c: S.cuatri, nota: tot, res: 'desaprobado' });
        m.resultado = 'Final desaprobado: rendir de nuevo'; resultado = 'desaprobado';
        await UI.say([`No. ${q.t === 'vf' ? q.x : 'Era: ' + q.o[0]}`, 'Desaprobaste el final, pero conservás la cursada: podés volver a rendir en la próxima mesa.'], o);
      }
    } else {
      Audio8.sfx('bad'); m.finales.push({ c: S.cuatri, nota: tot, res: 'recursa' });
      m.estado = 'recursa'; m.resultado = `Final con ${fmtN(tot)}: recursa`; resultado = 'recursa';
      await UI.say([`Sacaste ${fmtN(tot)} de 5.`, 'No alcanza: vas a tener que recursar la materia.'], o);
    }
    addLog(`Final de ${M.corto}: ${fmtN(tot)}/5 → ${resultado}.`);
    if (hadReglas) await UI.say('Devolviste las reglas, la CDD y la CDU a la biblioteca.');
    const prev = S.time; S.time = Math.max(S.time, s.fin); avisosReloj(prev, S.time); Game.updateHud();
  },
  async aprobar(code, nota, o, txt) {
    const m = S.materias[code];
    m.estado = 'aprobada'; m.resultado = `Final aprobado con ${nota}`; m.finales.push({ c: S.cuatri, nota, res: 'aprobado' });
    S.aprobadas[code] = nota;
    Audio8.sfx('item');
    await UI.say([txt, `¡Aprobaste el final de ${MATERIAS[code].nombre} con ${nota}!`], o);
    return 'aprobado';
  },
  puedeRendir(code) {
    const m = mat(code); if (m.estado !== 'final') return { ok: false, motivo: 'No debe final' };
    const falta = (CORRELATIVAS[code] || []).filter(c => mat(c).estado !== 'aprobada');
    if (falta.length) return { ok: false, motivo: 'Antes tenés que aprobar el final de: ' + falta.map(c => MATERIAS[c].corto).join(', ') };
    return { ok: true };
  },
};

// ---------------- INSCRIPCIONES ----------------
const Inscripciones = {
  abierta() { return enMesas() && (S.day > 0 || S.time >= CONFIG.inscApertura); },
  enVentana() { return enMesas() && S.day === 0 && S.time >= CONFIG.inscApertura && S.time <= CONFIG.inscApertura + CONFIG.inscVentana; },
  cupos(code) {
    const base = 14 + Math.floor(hash2(S.cuatri, ORDEN_MATERIAS.indexOf(code), 31) * 8);
    const martesJueves = HORARIO[code].dia === 1 || HORARIO[code].dia === 3;
    const nivel = CORRELATIVAS[code] ? 0.6 : 1;
    const rate = (martesJueves ? 0.7 + hash2(code.length, S.cuatri, 7) * 0.4 : 0.25 + hash2(S.cuatri, code.length, 9) * 0.25) * nivel;
    const t = S.day === 0 ? Math.max(0, S.time - CONFIG.inscApertura) : 999;
    return Math.max(0, Math.floor(base - rate * t));
  },
  ocupado(code, lista) { // superposición de horarios
    const h = HORARIO[code];
    return lista.find(c => c !== code && HORARIO[c].dia === h.dia && (h.turno === 'completa' || HORARIO[c].turno === 'completa' || HORARIO[c].turno === h.turno)) || null;
  },
  cursandoAhora() { return Object.keys(S.materias).filter(c => S.materias[c].estado === 'cursando'); },
  evaluar(code, lista, ignorarCupo) {
    const m = mat(code);
    if (m.estado === 'aprobada') return { ok: false, motivo: 'Ya la aprobaste' };
    if (m.estado === 'final') return { ok: false, motivo: 'Ya tenés la cursada aprobada: debe final' };
    if (lista.includes(code)) return { ok: false, motivo: 'Ya estás anotado/a', anotado: true };
    if (m.estado === 'cursando' && !enMesas()) return { ok: false, motivo: 'La estás cursando' };
    const falta = (CORRELATIVAS[code] || []).filter(c => !cursadaAprobada(c));
    if (falta.length) return { ok: false, motivo: 'Correlativas: ' + falta.map(c => MATERIAS[c].corto).join(', ') };
    const sup = this.ocupado(code, lista);
    if (sup) return { ok: false, motivo: 'Se superpone con ' + MATERIAS[sup].corto };
    if (!ignorarCupo && this.cupos(code) <= 0) return { ok: false, motivo: 'Sin cupo' };
    return { ok: true };
  },
  async empezarCuatrimestre() {
    S.cuatri++; S.week = 1; S.day = 0;
    const nuevas = S.inscr.pend.slice();
    nuevas.forEach(code => { S.materias[code] = mkMateria('cursando', S.cuatri); ensureProfe(HORARIO[code].prof); });
    S.inscr.pend = []; S.mesas = []; S.inscr.reclamos = 0; S.inscr.cambio = false;
    addLog(`Empieza el cuatrimestre ${S.cuatri} con ${nuevas.length} materias.`);
    await UI.say(nuevas.length ? [`¡Empieza el cuatrimestre ${S.cuatri}!`, 'Este cuatrimestre cursás: ' + nuevas.map(c => MATERIAS[c].corto).join(', ') + '.']
      : [`Empieza el cuatrimestre ${S.cuatri}.`, 'No quedaste anotado/a en ninguna materia. En las primeras dos semanas podés reclamar en bedelía.']);
    if (nuevas.length) Menus.horario();
  },
  // inscripción tardía (reclamo o cambio con la cursada empezada)
  anotarTarde(code) {
    const m = mkMateria('cursando', S.cuatri), P = PROFES[HORARIO[code].prof];
    const dif = dificultadProfe(P), duro = typeof dif.n === 'number' && dif.n >= 8;
    let media = 0;
    for (let k = 0; k < S.week; k++) {
      const pasada = k < S.week - 1 || HORARIO[code].dia < S.day || (HORARIO[code].dia === S.day && S.time > turno(code)[0] + CONFIG.toleranciaClase);
      if (!pasada) continue;
      m.ses[k] = 'X';
      if (duro && !esExamen(CONFIG.secuencia[k]) && Math.random() < 0.5) { m.faltas += 0.5; media++; }
    }
    S.materias[code] = m; ensureProfe(HORARIO[code].prof);
    return media;
  },
  primerParcialPasado(code) {
    const m = mat(code);
    if (m.estado === 'cursando' && m.ses[2] !== null) return true;
    if (S.week > 3) return true;
    if (S.week < 3) return false;
    const d = HORARIO[code].dia;
    return d < S.day || (d === S.day && S.time >= turno(code)[0]);
  },
};

    const rows = ORDEN_MATERIAS.filter(c => !pend.includes(c) && !['aprobada', 'final'].includes(mat(c).estado)).map(c => {
      const ev = Inscripciones.evaluar(c, pend, false), cup = Inscripciones.cupos(c);
      const btn = ev.ok && this.puedeAnotarse() ? `<button class="opt mini" data-insc="${c}">Anotarme</button>` : '';
      return `<div class="row"><div class="lab small"><b>${esc(MATERIAS[c].corto)}</b> · ${DIAS[HORARIO[c].dia]} ${fmtT(turno(c)[0])}–${fmtT(turno(c)[1])} · aula ${HORARIO[c].aula} · cupos: ${cup}${ev.ok ? '' : `<br><span class="bad">${esc(ev.motivo)}</span>`}</div>${btn}</div>`;
    }).join('');
    return head + anot + rows;
  },
  puedeAnotarse() { return Inscripciones.enVentana(); },
  anotar(code) {
    if (!this.puedeAnotarse()) { this.open(1); return; }
    const ev = Inscripciones.evaluar(code, S.inscr.pend, false);
    if (ev.ok) { S.inscr.pend.push(code); Audio8.sfx('good'); addLog(`Te anotaste a ${MATERIAS[code].corto} para el cuatrimestre ${S.cuatri + 1}.`); }
    else { Audio8.sfx('bad'); UI.toast(ev.motivo); }
    paso(1); Save.write();
    this.open(1);
  },
  mesas() {
    const deben = ORDEN_MATERIAS.filter(c => mat(c).estado === 'final');
    if (!deben.length) return '<p class="small">No debés ningún final por ahora.</p>';
    const abierta = S.week >= CONFIG.semanasCursada - 1 && S.week <= SEMANA_MESAS;
    return `<p class="small">Las mesas se toman en la semana de mesas, a las 18:00, en el día y el aula de cada materia. <b>Si te anotás y no vas, recursás.</b> ${abierta ? '' : 'La inscripción a mesas se abre en la semana 5.'}</p>` + deben.map(c => {
      const pr = Finales.puedeRendir(c), an = S.mesas.includes(c), h = HORARIO[c];
      const hoyPasado = enMesas() && (h.dia < S.day || (h.dia === S.day && S.time >= CONFIG.mesaHora[0]));
      let btn = '';
      if (abierta && pr.ok && !hoyPasado) btn = `<button class="opt mini" data-mesa="${c}">${an ? 'Darme de baja' : 'Anotarme'}</button>`;
      return `<div class="row"><div class="lab small"><b>${esc(MATERIAS[c].corto)}</b> · ${DIAS[h.dia]} 18:00 · aula ${h.aula}${an ? ' · <span class="good">anotado/a</span>' : ''}${pr.ok ? '' : `<br><span class="bad">${esc(pr.motivo)}</span>`}</div>${btn}</div>`;
    }).join('');
  },
  mesa(code) {
    if (S.mesas.includes(code)) S.mesas = S.mesas.filter(c => c !== code);
    else { S.mesas.push(code); addLog(`Te anotaste a la mesa de ${MATERIAS[code].corto}.`); }
    Audio8.sfx('select'); paso(1); Save.write(); this.open(2);
  },
};

  const r = await UI.choose('Bedelía. ¿Qué necesitás?', ['Che, ¿cómo va?', 'Ver mi horario', 'Reclamar: no pude anotarme', 'Cambiar de materia', 'Constancia de alumno regular', 'Nada, gracias'], { ...o, cancel: 5 });
  if (r === 5) return;
  paso(1);
  if (r === 0) return UI.say(charlaDelDia('bedel'), o);
  if (r === 1) { await UI.say('Acá tenés tu horario. No lo pierdas, ¿eh?', o); Menus.horario(); }
  if (r === 2) await this.reclamo(o);
  if (r === 3) await this.cambio(o);
  if (r === 4) await UI.say([`Constancia de alumno regular: ${S.player.name}, Tecnicatura Superior en Bibliotecología, cuatrimestre ${S.cuatri}. Sello, firma... listo.`], o);
};
Game.reclamo = async function (o) {
  const enPeriodo = (enMesas() && Inscripciones.abierta()) || (!enMesas() && S.week <= 2 && S.cuatri > 1);
  if (!enPeriodo) return UI.say(enMesas() ? 'Los reclamos se toman cuando abre la inscripción, el lunes a las 19:00.' : 'Los reclamos se toman en la semana de mesas, después de la inscripción, o en las dos primeras semanas del cuatrimestre.', o);
  if (S.inscr.reclamos >= CONFIG.reclamosMax) return UI.say('Ya reclamaste dos veces este cuatrimestre. No te puedo atender más, lo siento.', o);
  const lista = enMesas() ? S.inscr.pend : Inscripciones.cursandoAhora();
  const cand = ORDEN_MATERIAS.filter(c => Inscripciones.evaluar(c, lista, true).ok && (enMesas() || !Inscripciones.primerParcialPasado(c)));
  if (!cand.length) return UI.say('No hay ninguna materia a la que te pueda anotar: revisá correlativas y horarios.', o);
  const opts = cand.map(c => MATERIAS[c].corto + ' · ' + DIA_CORTO[HORARIO[c].dia]).concat(['Mejor no']);
  const k = await UI.choose('¿En qué materia no pudiste anotarte?', opts, { ...o, cancel: opts.length - 1 });
  if (k < 0 || k >= cand.length) return;
  const code = cand[k];
  S.inscr.reclamos++; paso(5);
  const buenDia = Math.random() < CONFIG.exitoReclamo;
  if (buenDia) {
    if (enMesas()) { S.inscr.pend.push(code); }
    else { const media = Inscripciones.anotarTarde(code); if (media) await UI.say(`Ojo: ${PROFES[HORARIO[code].prof].nombre} te puso media falta por cada clase que no cursaste (${media}).`, o); }
    Audio8.sfx('good'); addLog(`Reclamo aceptado: anotado/a en ${MATERIAS[code].corto}.`);
    await UI.say(['(El bedel está de buen humor y tararea algo.)', `Listo, te anoté en ${MATERIAS[code].corto}. No le digas a nadie.`], o);
  } else {
    Audio8.sfx('bad'); addLog(`Reclamo rechazado en ${MATERIAS[code].corto}.`);
    await UI.say(['(El bedel no levanta la vista de la pantalla.)', 'No hay solución. Está todo cerrado. El próximo.'], o);
  }
  await UI.say(`Te quedan ${CONFIG.reclamosMax - S.inscr.reclamos} reclamos este cuatrimestre.`);
  Save.write();
};
Game.cambio = async function (o) {
  if (enMesas() || S.week > 3) return UI.say('Los cambios de materia se hacen en las primeras semanas, antes del primer parcial.', o);
  if (S.inscr.cambio) return UI.say('Ya hiciste un cambio este cuatrimestre. Es uno solo.', o);
  const bajas = Inscripciones.cursandoAhora().filter(c => !Inscripciones.primerParcialPasado(c));
  if (!bajas.length) return UI.say('No tenés materias que puedas dejar: ya rendiste el primer parcial.', o);
  const ob = bajas.map(c => MATERIAS[c].corto).concat(['Mejor no']);
  const kb = await UI.choose('¿De qué materia te querés bajar?', ob, { ...o, cancel: ob.length - 1 });
  if (kb < 0 || kb >= bajas.length) return;
  const baja = bajas[kb];
  const resto = Inscripciones.cursandoAhora().filter(c => c !== baja);
  const altas = ORDEN_MATERIAS.filter(c => c !== baja && Inscripciones.evaluar(c, resto, true).ok && !Inscripciones.primerParcialPasado(c));
  if (!altas.length) return UI.say('No hay ninguna materia que puedas tomar en su lugar (correlativas, horarios o el primer parcial ya pasó).', o);
  const oa = altas.map(c => MATERIAS[c].corto + ' · ' + DIA_CORTO[HORARIO[c].dia]).concat(['Mejor no']);
  const ka = await UI.choose('¿A cuál te querés pasar? Ojo: las clases que ya pasaron no las cursaste.', oa, { ...o, cancel: oa.length - 1 });
  if (ka < 0 || ka >= altas.length) return;
  const alta = altas[ka];
  delete S.materias[baja];
  const media = Inscripciones.anotarTarde(alta);
  S.inscr.cambio = true; paso(5); Audio8.sfx('good');
  addLog(`Cambio: dejaste ${MATERIAS[baja].corto} y entraste a ${MATERIAS[alta].corto}.`);
  await UI.say([`Listo: te bajé de ${MATERIAS[baja].corto} y te anoté en ${MATERIAS[alta].corto}.`, 'Las clases que ya pasaron no las cursaste: te van a faltar esos apuntes.'].concat(media ? [`Además, ${PROFES[HORARIO[alta].prof].nombre} te puso media falta por cada clase perdida (${media}).`] : []), o);
  Save.write();
};

const _setMap = setMap;
setMap = function (id, x, y, dir) {
  _setMap(id, x, y, dir);
  if (W.map && W.map.aula) {
    const desks = [];
    for (let yy = 0; yy < W.map.h; yy++) for (let xx = 0; xx < W.map.w; xx++) if ('kKj'.includes(W.map.tile(xx, yy))) desks.push(xx + ',' + yy);
    const msgs = shuffle(MENSAJES_MESAS.slice());
    W.deskMsgs = {};
    shuffle(desks).forEach((k, i) => { W.deskMsgs[k] = Math.random() < 0.35 ? null : msgs[i % msgs.length]; });
  }
};

// ---------------- Combinación secreta para abrir los códigos (celular y compu) ----------------
(function () {
  const SEQ = ['up', 'up', 'down', 'down', 'left', 'right', 'left', 'right', 'b', 'a'];
  let buf = [], last = 0;
  Input.on(k => {
    if (Game.scene !== 'world' || !SEQ.includes(k)) return false;
    const now = performance.now(); if (now - last > 1500) buf = []; last = now;
    buf.push(k); if (buf.length > SEQ.length) buf.shift();
    if (buf.join() === SEQ.join()) { buf = []; setTimeout(() => Game.openCheat(), 120); }
    return false;
  });
})();

// Cada día, cada personaje tiene 2 charlas disponibles, que se alternan.
function charlaDelDia(quien) {
  const L = CHARLAS[quien], dia = S.cuatri * 100 + S.week * 10 + S.day;
  const a = Math.floor(hash2(dia, quien.length, 3) * L.length);
  let b = Math.floor(hash2(dia, quien.length, 8) * L.length); if (b === a) b = (a + 1) % L.length;
  S.flags.charla = S.flags.charla || {};
  const k = quien + dia, n = S.flags.charla[k] || 0; S.flags.charla = { [k]: n + 1, ...Object.fromEntries(Object.entries(S.flags.charla).filter(([x]) => x.endsWith(String(dia)) && x !== k)) };
  return L[n % 2 ? b : a];
}
