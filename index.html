si no se formulan (suelen ser un resultado) y en los descriptivos no son obligatorias. En los explicativos sí se formulan siempre.","c":3},{"d":2,"t":"mc","q":"Cada variable con su nivel de medición: «Estado civil»","o":["nominal","ordinal","de intervalo","de razón"],"c":3},{"d":2,"t":"mc","q":"Cada variable con su nivel de medición: «Nivel educativo (primaria, secundaria, terciaria)»","o":["ordinal","de razón","nominal","de intervalo"],"c":3},{"d":2,"t":"mc","q":"Cada variable con su nivel de medición: «Temperatura en grados»","o":["de intervalo","de razón","nominal","ordinal"],"c":3},{"d":2,"t":"mc","q":"Cada variable con su nivel de medición: «Cantidad de libros prestados»","o":["de razón","nominal","de intervalo","ordinal"],"c":3},{"d":1,"t":"mc","q":"Cada rasgo con el modelo cuantitativo o cualitativo: «Lógica deductiva y diseño estructurado»","o":["cuantitativo","cualitativo"],"c":4},{"d":1,"t":"mc","q":"Cada rasgo con el modelo cuantitativo o cualitativo: «Diseño emergente y análisis inductivo»","o":["cualitativo","cuantitativo"],"c":4},{"d":1,"t":"mc","q":"Cada rasgo con el modelo cuantitativo o cualitativo: «Muestra estadísticamente representativa»","o":["cuantitativo","cualitativo"],"c":4},{"d":1,"t":"mc","q":"Cada rasgo con el modelo cuantitativo o cualitativo: «El investigador como instrumento clave»","o":["cualitativo","cuantitativo"],"c":4},{"d":2,"t":"mc","q":"Si en un mismo estudio se aplican una encuesta y entrevistas al mismo aspecto, buscando que los resultados coincidan, la estrategia se llama...","o":["Triangulación","Complementación","Combinación","Supremacía"],"c":4},{"d":2,"t":"mc","q":"¿Qué hipótesis clásica usa el libro como ejemplo, de Durkheim?","o":["Cuanto menos cohesión tiene una sociedad, mayor es su tasa de suicidios","A más educación, más ingresos","Los pobres leen menos","La religión causa la guerra"],"c":3},{"d":2,"t":"vf","q":"Si los datos no apoyan la hipótesis, la investigación fracasó y no sirve.","a":false,"x":"Falso. Que los datos no apoyen una hipótesis también es conocimiento: permite descartar una explicación.","c":3},{"d":2,"t":"mc","q":"Cada hipótesis con su tipo: «\"La falta de estudio genera bajo rendimiento\"»","o":["causal","de asociación con dirección"],"c":3},{"d":2,"t":"mc","q":"Cada hipótesis con su tipo: «\"A mayor nivel educativo, mayores ingresos\"»","o":["de asociación con dirección","causal"],"c":3},{"d":3,"t":"mc","q":"Según Popper, ¿qué tiene que cumplir una hipótesis científica?","o":["Ser falsable: que la experiencia pueda refutarla","Ser verificable para siempre","Ser aceptada por todos","Ser una pregunta"],"c":3},{"d":2,"t":"mc","q":"¿Qué diferencia hay entre la validez y la confiabilidad de un indicador?","o":["La validez es que mida lo que debe medir; la confiabilidad, que observaciones repetidas den los mismos datos","Son lo mismo","La validez es para cuantitativos y la confiabilidad para cualitativos","La confiabilidad es que el indicador sea barato"],"c":3},{"d":2,"t":"mc","q":"Un sistema de categorías debe ser...","o":["Exhaustivo, excluyente y preciso","Corto y simpático","Siempre numérico","Igual para todas las variables"],"c":3},{"d":2,"t":"mc","q":"Cada estrategia de integración con su descripción: «Complementación»","o":["cada método ilumina un aspecto distinto; integración mínima","los dos métodos se aplican al mismo aspecto buscando resultados convergentes","un método sirve de insumo para mejorar el otro"],"c":4},{"d":2,"t":"mc","q":"Cada estrategia de integración con su descripción: «Combinación»","o":["un método sirve de insumo para mejorar el otro","cada método ilumina un aspecto distinto; integración mínima","los dos métodos se aplican al mismo aspecto buscando resultados convergentes"],"c":4},{"d":2,"t":"mc","q":"Cada estrategia de integración con su descripción: «Triangulación»","o":["los dos métodos se aplican al mismo aspecto buscando resultados convergentes","cada método ilumina un aspecto distinto; integración mínima","un método sirve de insumo para mejorar el otro"],"c":4},{"d":2,"t":"mc","q":"¿Cuántos participantes suele tener un grupo de discusión?","o":["Entre 5 y 10","2","Más de 50","Uno solo"],"c":4},{"d":2,"t":"vf","q":"Un proyecto de investigación tiene que terminar con una sección de conclusiones con los resultados.","a":false,"x":"Falso. Un proyecto todavía no tiene resultados: puede cerrar con una reflexión o líneas futuras. Es una de las trampas del proyecto de ejemplo, que incluye una sección de \"Conclusiones\".","c":4}],"fin":[{"d":2,"t":"mc","q":"¿Qué es el principio de la no-conciencia?","o":["Que los fenómenos sociales se explican por el sistema de relaciones objetivas, no por lo que los individuos creen o declaran","Que el investigador no debe pensar","Que las personas mienten siempre en las encuestas","Que no hay que leer teoría"],"c":1},{"d":2,"t":"mc","q":"¿Qué es un vacío de conocimiento?","o":["Preguntas no respondidas o mal respondidas, que el problema de investigación busca llenar","Un capítulo que falta en el proyecto","La falta de libros en la biblioteca","Un error de la hipótesis"],"c":2},{"d":3,"t":"mc","q":"Cada oración con el motivo por el que no es una hipótesis: «\"¿Lee menos la gente joven?\"»","o":["es una pregunta","es un juicio de valor (no es precisa)","es una disyunción (no es refutable)","es una tautología"],"c":3},{"d":3,"t":"mc","q":"Cada oración con el motivo por el que no es una hipótesis: «\"Los pobres son los que tienen menos ingresos\"»","o":["es una tautología","es una pregunta","es un juicio de valor (no es precisa)","es una disyunción (no es refutable)"],"c":3},{"d":3,"t":"mc","q":"Cada oración con el motivo por el que no es una hipótesis: «\"La biblioteca es la mejor institución del barrio\"»","o":["es un juicio de valor (no es precisa)","es una tautología","es una disyunción (no es refutable)","es una pregunta"],"c":3},{"d":3,"t":"mc","q":"Cada oración con el motivo por el que no es una hipótesis: «\"Los usuarios vendrán o no vendrán\"»","o":["es una disyunción (no es refutable)","es una tautología","es un juicio de valor (no es precisa)","es una pregunta"],"c":3},{"d":2,"t":"vf","q":"En un estudio exploratorio siempre hay que formular hipótesis antes de empezar.","a":false,"x":"Falso. En los exploratorios casi no se formulan: las hipótesis suelen ser un resultado del estudio.","c":3},{"d":2,"t":"mc","q":"¿Por qué la edad puede ser una variable de razón o una ordinal?","o":["Porque se puede medir en años exactos (con cero absoluto) o agrupar en tramos (0-5, 6-10); se puede bajar de nivel, nunca subir","Porque es subjetiva","Porque depende del encuestado","Porque es nominal"],"c":3},{"d":2,"t":"mc","q":"Cada paradigma (Corbetta) con su visión de la realidad: «Positivismo»","o":["la realidad es \"real\" y conocible","la realidad es real, pero conocible de modo imperfecto","la realidad es construida: múltiples realidades"],"c":4},{"d":2,"t":"mc","q":"Cada paradigma (Corbetta) con su visión de la realidad: «Pospositivismo»","o":["la realidad es real, pero conocible de modo imperfecto","la realidad es \"real\" y conocible","la realidad es construida: múltiples realidades"],"c":4},{"d":2,"t":"mc","q":"Cada paradigma (Corbetta) con su visión de la realidad: «Interpretativismo»","o":["la realidad es construida: múltiples realidades","la realidad es \"real\" y conocible","la realidad es real, pero conocible de modo imperfecto"],"c":4},{"d":2,"t":"mc","q":"¿Qué distingue a la observación participante?","o":["Que el investigador se integra al grupo de forma directa, por mucho tiempo, en su medio natural, para comprenderlo","Que se hace por teléfono","Que usa un cuestionario cerrado","Que no requiere ir al campo"],"c":4}],"repaso":["¿Qué es el principio de la no-conciencia? → Que los fenómenos sociales se explican por el sistema de relaciones objetivas, no por lo que los individuos creen o declaran.","¿Qué es un vacío de conocimiento? → Preguntas no respondidas o mal respondidas, que el problema de investigación busca llenar.","Cada oración con el motivo por el que no es una hipótesis: «\"¿Lee menos la gente joven?\"» → es una pregunta.","Cada oración con el motivo por el que no es una hipótesis: «\"Los pobres son los que tienen menos ingresos\"» → es una tautología.","Cada oración con el motivo por el que no es una hipótesis: «\"La biblioteca es la mejor institución del barrio\"» → es un juicio de valor (no es precisa).","Cada oración con el motivo por el que no es una hipótesis: «\"Los usuarios vendrán o no vendrán\"» → es una disyunción (no es refutable).","En los exploratorios casi no se formulan: las hipótesis suelen ser un resultado del estudio.","¿Por qué la edad puede ser una variable de razón o una ordinal? → Porque se puede medir en años exactos (con cero absoluto) o agrupar en tramos (0-5, 6-10); se puede bajar de nivel, nunca subir.","Cada paradigma (Corbetta) con su visión de la realidad: «Positivismo» → la realidad es \"real\" y conocible.","Cada paradigma (Corbetta) con su visión de la realidad: «Pospositivismo» → la realidad es real, pero conocible de modo imperfecto.","Cada paradigma (Corbetta) con su visión de la realidad: «Interpretativismo» → la realidad es construida: múltiples realidades.","¿Qué distingue a la observación participante? → Que el investigador se integra al grupo de forma directa, por mucho tiempo, en su medio natural, para comprenderlo."],"nombre":"Seminario de Investigación Bibliotecológica","corto":"Seminario"},"PSL":{"clases":[{"t":"El conocimiento y la misión del bibliotecario","ap":["Cada idea sobre la belleza con su filósofo: «El amor asciende de un cuerpo bello a la Belleza en sí» → Platón.","Cada idea sobre la belleza con su filósofo: «La tragedia produce catarsis» → Aristóteles.","Según Ortega y Gasset, ¿cuál era la misión del bibliotecario en el Renacimiento? → Adquirir libros, porque había pocos.","Ortega y Gasset pronunció Misión del bibliotecario en el II Congreso de la IFLA, en Madrid, en 1935.","¿Qué distingue a la sabiduría del conocimiento? → Que incorpora juicio y valores: saber cuándo y para qué usar el conocimiento.","(Complemento) ¿Qué frase resume el espíritu de la Ilustración, según Kant? → \"Sapere aude\": atrévete a saber.","Según Ortega, ¿qué pasó con la profesión de bibliotecario hacia 1850? → Se volvió burocracia del Estado, porque el libro se hizo socialmente imprescindible.","Al conservar solo las palabras, el libro conserva \"solo la ceniza del efectivo pensamiento\". Para que reviva, el lector tiene que reconstruir la situación del autor.","¿Qué idea de Unamuno sirve para pensar al usuario de la biblioteca? → El hombre de carne y hueso: la persona concreta, con su historia."]},{"t":"La lectura y la bibliopsicología","ap":["¿Cómo se mueven los ojos al leer? → Avanzan a saltos y se detienen en fijaciones.","Cada nivel de comprensión con su ejemplo: «\"¿De qué color era el caballo?\" (lo dice el texto)» → literal.","Cada nivel de comprensión con su ejemplo: «\"¿Por qué el personaje se fue sin saludar?\" (no lo dice)» → inferencial.","Cada nivel de comprensión con su ejemplo: «\"¿Estás de acuerdo con la decisión del autor?\"» → crítico.","Cada dificultad con su descripción: «Dislexia» → dificultad específica para aprender a leer.","Cada dificultad con su descripción: «Discalculia» → dificultad con los números y el cálculo.","Cada dificultad con su descripción: «Dislalia» → dificultad para articular algunos fonemas.","Cada dificultad con su descripción: «Disfemia» → trastorno de la fluidez del habla (tartamudez).","Según la ley de Humboldt-Potebnia que retoma Rubakin, el texto es... → Un excitador de experiencias en el lector.","Para Lin Yutang no hay libros que todos deban leer: cada uno tiene que encontrar su autor, por afinidad de temperamento, como quien se enamora. Y un libro dice cosas distintas según la edad del lector.","La velocidad tiene que ajustarse al propósito: estudiar no es lo mismo que hojear. (Complemento)","Cada ley de la bibliopsicología con su contenido: «Ley de Semon» → los estímulos simultáneos quedan asociados en la memoria.","Cada ley de la bibliopsicología con su contenido: «Ley de Humboldt-Potebnia» → las palabras no transportan el significado: lo excitan en el lector.","Cada ley de la bibliopsicología con su contenido: «Ley de Taine» → las huellas dependen de la herencia, el medio social y el momento.","Para Lin Yutang, un mismo libro dice cosas distintas según la edad del lector. ¿Con qué imagen lo explica? → Mirar la luna por una rendija en la juventud, desde un patio en la madurez y desde una terraza en la vejez."]},{"t":"Los lectores y la sociedad de la información","ap":["Según Hernández Salazar, ¿qué es el perfil del usuario? → El conjunto de rasgos distintivos que caracterizan al usuario.","Lo que el usuario pide es solo la necesidad expresada (la demanda). Basarse solo en eso genera sesgo: deja fuera las necesidades latentes y a quienes no vienen a la biblioteca. Hay que hacer un estudio de usuarios que combine encuestas y análisis bibliográficos y de uso.","La PNL (Bandler y Grinder, años 1970) no tiene respaldo científico sólido. En la materia se usa como herramienta de comunicación en la atención al usuario, no como ciencia probada. (Complemento.)","Cada colectivo con un servicio adecuado: «Niños» → la hora del cuento y los libros álbum.","Cada colectivo con un servicio adecuado: «Adolescentes» → clubes de lectura, sagas y cómic.","Cada colectivo con un servicio adecuado: «Adultos» → préstamo ágil y horarios amplios.","Cada colectivo con un servicio adecuado: «Tercera edad» → letra grande, audiolibros y servicio a domicilio.","Según Hernández Salazar, ¿qué es una necesidad de información \"latente\"? → La que existe pero no se expresa como demanda.","Según Neveleff, ¿qué pasa con los chicos que crecen con pantallas? → Leen distinto: hipertexto, lectura fragmentaria y no lineal.","(Complemento) Según Kuhlthau, ¿qué siente un usuario al comienzo de una búsqueda de información? → Incertidumbre, que es normal y va bajando a medida que avanza.","Es el fin de los grandes relatos, con fragmentación y el saber visto como mercancía."]},{"t":"Formación de usuarios y estudios de usuarios","ap":["¿Dónde y cuándo se adoptó el Manifiesto de Alejandría sobre las bibliotecas? → En la Bibliotheca Alexandrina, en noviembre de 2005.","Cada técnica con su tipo de método: «Cuestionario» → directo cuantitativo.","Cada técnica con su tipo de método: «Grupo de discusión» → directo cualitativo.","Cada técnica con su tipo de método: «Incidente crítico» → directo cualitativo.","Cada técnica con su tipo de método: «Análisis de citas» → indirecto.","Cada técnica con su tipo de método: «Estadísticas de préstamo» → indirecto.","¿Por qué la biblioteca escolar es la \"célula fundante\" de la formación de usuarios? → Porque en la escuela se forman los hábitos de lectura y búsqueda que el usuario llevará toda la vida.","(Complemento) Según la definición clásica de la ALA (1989), una persona alfabetizada en información sabe... → Reconocer cuándo necesita información y localizarla, evaluarla y usarla eficazmente.","Según Rader, ¿qué cambia en el servicio de referencia con la ALFIN? → El bibliotecario ya no solo responde: enseña a encontrar las respuestas y trabaja con los docentes.","Cada elemento del FODA con su ejemplo: «Fortaleza» → una bibliotecaria con formación pedagógica.","Cada elemento del FODA con su ejemplo: «Debilidad» → un horario reducido.","Cada elemento del FODA con su ejemplo: «Oportunidad» → docentes interesados en trabajar por proyectos.","Cada elemento del FODA con su ejemplo: «Amenaza» → la creencia de que \"todo está en Google\".","Son dos documentos de 2005 del mismo lugar. El Manifiesto (IFLA) trata de las bibliotecas y la sociedad de la información; la Proclamación (IFLA y UNESCO) trata de la ALFIN y el aprendizaje a lo largo de la vida. El programa nombra el Manifiesto.","¿Qué es la técnica del incidente crítico? → El usuario cuenta una situación concreta en la que necesitó información.","Según Rey Martín, ¿de qué depende la satisfacción del usuario? → De la distancia entre lo que el usuario espera y lo que percibe del servicio."]}],"p1":[{"d":2,"t":"mc","q":"Cada idea sobre la belleza con su filósofo: «El amor asciende de un cuerpo bello a la Belleza en sí»","o":["Platón","Aristóteles"],"c":1},{"d":2,"t":"mc","q":"Cada idea sobre la belleza con su filósofo: «La tragedia produce catarsis»","o":["Aristóteles","Platón"],"c":1},{"d":2,"t":"mc","q":"Según Ortega y Gasset, ¿cuál era la misión del bibliotecario en el Renacimiento?","o":["Adquirir libros, porque había pocos","Catalogar los libros","Filtrar el exceso de libros","Formar usuarios"],"c":1},{"d":1,"t":"vf","q":"Ortega y Gasset pronunció Misión del bibliotecario en el II Congreso de la IFLA, en Madrid, en 1935.","a":true,"x":"Verdadero.","c":1},{"d":1,"t":"mc","q":"¿Cómo se mueven los ojos al leer?","o":["Avanzan a saltos y se detienen en fijaciones","Se deslizan de forma continua por la línea","Leen cada letra por separado","Leen primero el final de la línea"],"c":2},{"d":2,"t":"mc","q":"Cada nivel de comprensión con su ejemplo: «\"¿De qué color era el caballo?\" (lo dice el texto)»","o":["literal","crítico","inferencial"],"c":2},{"d":2,"t":"mc","q":"Cada nivel de comprensión con su ejemplo: «\"¿Por qué el personaje se fue sin saludar?\" (no lo dice)»","o":["inferencial","literal","crítico"],"c":2},{"d":2,"t":"mc","q":"Cada nivel de comprensión con su ejemplo: «\"¿Estás de acuerdo con la decisión del autor?\"»","o":["crítico","inferencial","literal"],"c":2},{"d":1,"t":"mc","q":"Cada dificultad con su descripción: «Dislexia»","o":["dificultad específica para aprender a leer","dificultad con los números y el cálculo","trastorno de la fluidez del habla (tartamudez)","dificultad para articular algunos fonemas"],"c":2},{"d":1,"t":"mc","q":"Cada dificultad con su descripción: «Discalculia»","o":["dificultad con los números y el cálculo","dificultad específica para aprender a leer","dif const TS = 16;
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function hexRgb(h) { h = h.replace('#',''); if (h.length === 3) h = h.split('').map(c=>c+c).join(''); const n = parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgbHex(r,g,b) { return '#' + [r,g,b].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function shade(hex, amt) { const [r,g,b] = hexRgb(hex); if (amt < 0) return rgbHex(r*(1+amt), g*(1+amt), b*(1+amt)); return rgbHex(r+(255-r)*amt, g+(255-g)*amt, b+(255-b)*amt); }
function hash2(x, y, s = 0) { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

const PAL = {

};

function R(ctx, x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }

// ---------------- TILES (dibujados sobre el canvas del mapa) ----------------
function tFloor(ctx, px, py, x, y, dark) {
  const b = dark ? PAL.cfloor : PAL.floor, l = dark ? PAL.cfloorL : PAL.floorL, d = dark ? PAL.cfloorD : PAL.floorD;
  R(ctx, px, py, 16, 16, b);
  // baldosas de 8x8 con junta
  for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) {
    const v = hash2(x*2+i, y*2+j, 3);
    const c = v < 0.33 ? l : v > 0.8 ? d : b;
    R(ctx, px+i*8, py+j*8, 8, 8, c);
    R(ctx, px+i*8, py+j*8, 8, 1, PAL.grout); R(ctx, px+i*8, py+j*8, 1, 8, PAL.grout);
    R(ctx, px+i*8+1, py+j*8+1, 6, 1, shade(c, 0.07));
    if (hash2(x*2+i, y*2+j, 11) > 0.9) R(ctx, px+i*8+5, py+j*8+5, 1, 1, shade(c, -0.12));
  }
  if (!dark && hash2(x, y, 21) > 0.82) { R(ctx, px+3, py+4, 5, 1, PAL.gloss); R(ctx, px+4, py+5, 3, 1, shade(PAL.gloss,-0.1)); }
}
function tBrick(ctx, px, py, x, y, opts = {}) {
  R(ctx, px, py, 16, 16, PAL.mortar);
  for (let r = 0; r < 4; r++) {
    const off = (r + y) % 2 ? 4 : 0;
    for (let k = -1; k < 3; k++) {
      const bx = px + k*8 + off, by = py + r*4;
      const v = hash2(x*4 + k, y*4 + r, 5);
      const c = v < 0.3 ? PAL.brickL : v > 0.8 ? PAL.brickD : PAL.brick;
      const x0 = Math.max(bx, px), x1 = Math.min(bx + 7, px + 16);
      if (x1 > x0) { R(ctx, x0, by, x1 - x0, 3, c); R(ctx, x0, by, x1-x0, 1, shade(c, 0.1)); }
    }
  }
  if (opts.base) { R(ctx, px, py+12, 16, 4, PAL.oliveD); R(ctx, px, py+12, 16, 1, PAL.olive); }
  if (opts.top) { R(ctx, px, py, 16, 3, PAL.oliveDD); R(ctx, px, py+3, 16, 1, PAL.oliveD); }
}
function tCap(ctx, px, py, x, y, map) {
  R(ctx, px, py, 16, 16, PAL.olive);
  // textura de viga / losa
  for (let i = 0; i < 16; i += 4) R(ctx, px, py+i, 16, 1, shade(PAL.olive, -0.06));
  if (hash2(x,y,7) > 0.6) R(ctx, px+3+((x*5)%8), py+6, 3, 1, PAL.oliveL);
  const n = (dx, dy) => map ? map.solidAt(x+dx, y+dy) : true;

function buildPerson(look) {
  const sheet = mkCanvas(48, 96);
  const sctx = sheet.getContext('2d');
  for (let dir = 0; dir < 4; dir++) for (let f = 0; f < 3; f++) {
    const g = drawPersonGrid(look, dir === 3 ? 2 : dir, f);

function hairDown(g, L, back, h, hd, hl) {

function hairSide(g, L, h, hd, hl) {

  const s = look.style;

  gr(g, 23, 25, 2, 3, skinD);

  if (look.beard) { gr(g, 15, 27, 18, 7, h); ell(24, 32, 8, 4, h); gr(g, 21, 29, 6, 2, '#9A4A3A'); gr(g, 20, 28, 8, 1, h); }
  if (look.glasses) { [[17,21],[26,21]].forEach(([x,y]) => { gr(g, x, y, 6, 1, '#2A2A2A'); gr(g, x, y+4, 6, 1, '#2A2A2A'); gr(g, x, y, 1, 5, '#2A2A2A'); gr(g, x+5, y, 1, 5, '#2A2A2A'); }); gr(g, 23, 22, 3, 1, '#2A2A2A'); }
  // pelo de arriba
  if (s !== 'bald') {

const WALKABLE = new Set(['.', ',', 'q', 'S', 'L', 'D', 'd', 'e']);

class GameMap {
  constructor(id, w, h, fill) {
    this.id = id; this.w = w; this.h = h;
    this.t = Array.from({ length: h }, () => Array(w).fill(fill));
    this.deco = []; this.warps = {}; this.inter = {}; this.music = 'pasillo';
    this.dark = false; this.canvas = null; this.name = '';
  }
  tile(x, y) { return (x < 0 || y < 0 || x >= this.w || y >= this.h) ? 'W' : this.t[y][x]; }
  set(x, y, c) { if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.t[y][x] = c; }
  fill(x0, y0, x1, y1, c) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) this.set(x, y, c); }
  solidAt(x, y) { return !WALKABLE.has(this.tile(x, y)); }
  block(x0, y0, x1, y1, face = 'B') { this.fill(x0, y0, x1, y1 - 1, 'W'); this.fill(x0, y1, x1, y1, face); }
  warp(x, y, to) { this.warps[x + ',' + y] = to; }
  on(x, y, fn) { this.inter[x + ',' + y] = fn; }
}

function drawTileAt(ctx, map, x, y) {
  const px = x * TS, py = y * TS, c = map.tile(x, y);
  switch (c) {
    case '.': tFloor(ctx, px, py, x, y, false); break;
    case ',': tFloor(ctx, px, py, x, y, true); break;
    case 'q': tBathFloor(ctx, px, py, x, y); break;
    case 'W': tCap(ctx, px, py, x, y, map); break;
    case 'B': { const above = map.tile(x, y-1), below = map.tile(x, y+1);
      tBrick(ctx, px, py, x, y, { base: below !== 'B' && below !== 'H', top: above === 'W' && map.tallWall }); break; }
    case 'b': tBathFace(ctx, px, py, x, y); break;
    case 'D': tDoorFace(ctx, px, py, false); break;
    case 'd': tDoorTop(ctx, px, py, x, y, false); break;
    case 'e': tDoorTop(ctx, px, py, x, y, true); break;
    case 'S': tStairs(ctx, px, py, map.tile(x-1,y) === 'R' ? 'L' : map.tile(x+1,y) === 'R' ? 'R' : ''); break;
    case 'L': tLanding(ctx, px, py); break;
    case 'R': tVoid(ctx, px, py, x, y, map); break;
    case 's': tSmallStairs(ctx, px, py, x, y); break;
    case 'k': tDesk(ctx, px, py, 't'); break;
    case 'K': tDesk(ctx, px, py, 'b'); break;
    case 'c': tChair(ctx, px, py, 'R'); break;
    case 'C': tChair(ctx, px, py, 'L'); break;
    case 'j': tDeskSingle(ctx, px, py); break;
    case 'y': tChairV(ctx, px, py, 'D'); break;
    case 'z': tChairV(ctx, px, py, 'U'); break;
    case 't': tTeacherDesk(ctx, px, py, 't'); break;
    case 'T': tTeacherDesk(ctx, px, py, 'b'); break;
    case 'P': tBoardSide(ctx, px, py, map.boardSide, y, map.boardY0, map.boardY1); break;
    case 'H': tShelf(ctx, px, py, x, y, false); break;
    case 'h': tShelf(ctx, px, py, x, y, true); break;
    case 'm': tComputer(ctx, px, py); break;
    case 'M': tTable(ctx, px, py, 't'); break;
    case 'N': tTable(ctx, px, py, 'b'); break;
    case 'X': tCounter(ctx, px, py, 'bedelia', x, y); break;
    case 'Y': tCounter(ctx, px, py, 'kiosco', x, y); break;
    case 'p': tPanelWall(ctx, px, py, x); break;
    case 'A': tFlag(ctx, px, py, x, y); break;
    case 'v': tFan(ctx, px, py, x, y); break;
    case 'G': tBoardNotice(ctx, px, py, x, y); break;
    case 'n': tBench(ctx, px, py, x, y); break;
    case 'o': tPlant(ctx, px, py, x, y); break;
    case 'E': tEntrance(ctx, px, py); break;
    case 'Q': tStall(ctx, px, py, x); break;
    case 'Z': tSink(ctx, px, py, x, y); break;
    default: R(ctx, px, py, 16, 16, '#000');
  }
}
function renderMap(map) {
  const c = mkCanvas(map.w * TS, map.h * TS), ctx = c.getContext('2d');
  for (let y = 0; y < map.h; y++) for (let x = 0; x < map.w; x++) drawTileAt(ctx, map, x, y);
  map.deco.forEach(d => {
    const px = d.x * TS, py = d.y * TS;
    if (d.k === 'plate') tPlate(ctx, px, py, d.n);
    if (d.k === 'bathsign') tBathSign(ctx, px, py);
    if (d.k === 'poster') { R(ctx, px+2, py+2, 12, 11, '#F4F0E0'); R(ctx, px+3, py+3, 10, 5, d.c); R(ctx, px+4, py+9, 8, 1, '#888'); R(ctx, px+4, py+11, 5, 1, '#888'); }
    if (d.k === 'clock') { R(ctx, px+4, py+3, 8, 8, '#F4F0E0'); R(ctx, px+5, py+2, 6, 1, '#333'); R(ctx, px+3, py+4, 1, 6, '#333'); R(ctx, px+12, py+4, 1, 6, '#333'); R(ctx, px+5, py+11, 6, 1, '#333'); R(ctx, px+7, py+5, 1, 3, '#333'); R(ctx, px+8, py+7, 2, 1, '#C0392B'); }
    if (d.k === 'window') { R(ctx, px+1, py+2, 14, 10, '#3A3D33'); R(ctx, px+2, py+3, 12, 8, '#1B2A44'); R(ctx, px+3, py+4, 2, 1, '#F7E27A'); R(ctx, px+9, py+6, 1, 1, '#FFF'); R(ctx, px+7, py+3, 1, 8, '#3A3D33'); }
    if (d.k === 'cards') { R(ctx, px+1, py+3, 14, 8, '#F4F0E0'); for (let i = 0; i < 5; i++) R(ctx, px+2+i*3, py+4, 2, 3, ['#C0392B','#2E6DB4','#E8B830','#2F9E6E','#8E5BB8'][i]); R(ctx, px+2, py+8, 12, 1, '#888'); }
    if (d.k === 'text') { ctx.fillStyle = d.c || '#F4F0E0'; ctx.font = '5px monospace'; ctx.fillText(d.s, px + 1, py + 10); }
  });
  map.canvas = c;
}

function buildAula(n) {
  const side = PIZARRON[n];
  const m = new GameMap('aula' + n, 14, 11, ',');
  m.name = 'Aula ' + n; m.music = 'aula'; m.dark = true; m.tallWall = true; m.aula = n;
  m.boardSide = side;
  m.fill(0, 0, 13, 0, 'W'); m.fill(0, 10, 13, 10, 'W'); m.fill(0, 0, 0, 10, 'W'); m.fill(13, 0, 13, 10, 'W');
  m.fill(1, 1, 12, 2, 'B');
  const X = (x) => side === 'R' ? x : 13 - x;
  // pizarrón en pared lateral
  m.boardY0 = 3; m.boardY1 = 8;
  for (let y = 3; y <= 8; y++) m.set(X(13), y, 'P');
  // escritorio docente
  m.set(X(11), 4, 't'); m.set(X(11), 5, 'T');
  m.profPos = { x: X(12), y: 6, dir: side === 'R' ? 2 : 3 };
  // pupitres dobles con sillas mirando al pizarrón
  m.seats = [];
  [3, 6, 9].forEach(cx => [[3, 4], [6, 7]].forEach(([ya, yb]) => {
    m.set(X(cx), ya, 'k'); m.set(X(cx), yb, 'K');
    const ch = side === 'R' ? 'c' : 'C';
    m.set(X(cx - 1), ya, ch); m.set(X(cx - 1), yb, ch);
    m.seats.push({ x: X(cx - 1), y: ya }, { x: X(cx - 1), y: yb });
  }));
  // puerta inferior
  m.set(7, 10, 'd'); m.warp(7, 10, { map: 'piso1', aulaOut: n });
  m.entry = { x: 7, y: 9, dir: 1 };
  // decoración variable por aula
  const cols = ['#E85D75', '#3A7BD5', '#2F9E6E', '#E8B830', '#8E5BB8', '#E07A3A'];
  m.deco.push({ k: 'clock', x: 6 + (n % 3), y: 1 });
  m.deco.push({ k: 'poster', x: 2 + (n % 2), y: 1, c: cols[n % 6] }, { k: 'poster', x: 10 - (n % 2), y: 2, c: cols[(n + 2) % 6] });
  m.deco.push({ k: 'window', x: 4 + (n % 4), y: 1 });
  if (n % 2) m.deco.push({ k: 'cards', x: 8 + (n % 3), y: 1 });
  return m;
}

  for (let x = 4; x <= 9; x++) { m.set(X(x), 4, 'j'); seat(x, 3, 'y', 0); }
  // brazo de abajo: mesas en la fila 7, sillas en la 8 mirando hacia arriba
  for (let x = 4; x <= 9; x++) { m.set(X(x), 7, 'j'); seat(x, 8, 'z', 1); }

  for (let y = 4; y <= 7; y++) { m.set(X(3), y, 'j'); seat(2, y, side === 'R' ? 'c' : 'C', side === 'R' ? 3 : 2); }

}

function fixAulaDoor(m, n) {
  const d = AULA_DOORS[n]; if (!d || d.out.dir !== 1) return m;

  m.entry = { x: col, y: 3, dir: 0 };

}

const $ = (s, r = document) => r.querySelector(s);

// ---------------- ENTRADA ----------------
const Input = {
  held: { up: false, down: false, left: false, right: false, b: false },
  listeners: [],
  lastDir: null,
  press(k) { for (const fn of this.listeners.slice()) if (fn(k) === true) break; }, // un oyente que devuelve true consume la tecla
  init() {
    const map = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', KeyW:'up', KeyS:'down', KeyA:'left', KeyD:'right',
      KeyZ:'a', Enter:'a', Space:'a', KeyX:'b', Backspace:'b', Escape:'start', KeyM:'start', KeyL:'select' };
    window.addEventListener('keydown', e => {
      if (e.ctrlKey && e.shiftKey && (e.key === 'D' || e.key === 'd')) { e.preventDefault(); e.stopPropagation(); Game.openCheat(); return; }
      if (e.target && e.target.tagName === 'INPUT') { if (e.key === 'Enter') { e.preventDefault(); this.press('enter-input'); } if (e.key === 'Escape') this.press('esc-input'); return; }
      const k = map[e.code]; if (!k) return;
      e.preventDefault();
      Audio8.init();
      if (k in this.held) { if (!this.held[k] && k !== 'b') this.lastDir = k; this.held[k] = true; }
      if (!e.repeat || ['up','down','left','right'].includes(k)) this.press(k);
    }, { capture: true });
    window.addEventListener('keyup', e => { const k = map[e.code]; if (k && k in this.held) this.held[k] = false; });
    window.addEventListener('blur', () => Object.keys(this.held).forEach(k => this.held[k] = false));
    document.querySelectorAll('#pad button').forEach(b => {
      const k = b.dataset.k;
      const down = e => { e.preventDefault(); Audio8.init(); if (k in this.held) { this.held[k] = true; if (k !== 'b') this.lastDir = k; } this.press(k); };
      const up = e => { e.preventDefault(); if (k in this.held) this.held[k] = false; };
      b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
    });
    document.addEventListener('pointerdown', () => Audio8.init(), { passive: true });
    document.addEventListener('touchmove', e => { if (!e.target.closest('#panel .body, #choices')) e.preventDefault(); }, { passive: false });
    document.addEventListener('contextmenu', e => e.preventDefault());
  },
  on(fn) { this.listeners.push(fn); return () => { this.listeners = this.listeners.filter(f => f !== fn); }; },
  dirHeld() { const dirs = ['up', 'down', 'left', 'right']; const order = dirs.includes(this.lastDir) ? [this.lastDir, ...dirs] : dirs; for (const d of order) if (this.held[d]) return d; return null; },
};

// ---------------- UI ----------------
const UI = {
  busy: 0,          // >0 mientras hay diálogo/panel abierto
  scope: null, scopeBack: null, focusIdx: 0,
  el: {},
  init() {
    ['hud','dialog','choices','panel','toast','fade','portrait'].forEach(id => this.el[id] = $('#' + id));
    Input.on(k => this.onKey(k));
    this.el.dialog.addEventListener('click', () => this._dlgAdvance && this._dlgAdvance());
  },
  active() { return this.busy > 0; },
  // ----- foco navegable con teclado / cruceta -----
  setScope(el, onBack) { this.scope = el; this.scopeBack = onBack || null; this.focusIdx = 0; this.refreshFocus(true); },
  clearScope() { this.scope = null; this.scopeBack = null; },
  focusables() { return this.scope ? [...this.scope.querySelectorAll('.btn:not(:disabled), .opt:not(.gone):not(:disabled), .sw, .model, input.name')].filter(e => e.offsetParent !== null) : []; },
  refreshFocus(reset) {
    const f = this.focusables(); f.forEach(e => e.classList.remove('focus'));
    if (!f.length) return;
    if (reset) { const pre = f.findIndex(e => e.dataset.def); this.focusIdx = pre >= 0 ? pre : 0; }
    this.focusIdx = (this.focusIdx + f.length) % f.length;
    f[this.focusIdx].classList.add('focus');
    f[this.focusIdx].scrollIntoView({ block: 'nearest' });
  },
  onKey(k) {
    if (k === 'enter-input' || k === 'esc-input') return false;
    if (this.scope && !this.scope.isConnected) this.clearScope(); // un menú que ya no está en pantalla no captura teclas
    const consumed = this.busy > 0 || !!this.scope || !!this._dlgAdvance;
    this._onKey(k);
    if (consumed) this.lastClose = performance.now();
    return consumed; // si la interfaz usó la tecla, el mundo no la recibe
  },
  _onKey(k) {
    if (this._dlgAdvance && !this.scope) { if (k === 'a' || k === 'b') this._dlgAdvance(); return; }
    if (!this.scope) return;
    const f = this.focusables();
    if (k === 'up' || k === 'left') { this.focusIdx--; this.refreshFocus(); Audio8.sfx('blip'); }
    else if (k === 'down' || k === 'right') { this.focusIdx++; this.refreshFocus(); Audio8.sfx('blip'); }
    else if (k === 'a') { const el = f[this.focusIdx]; if (el) { if (el.tagName === 'INPUT') el.focus(); else el.click(); } }

  },
  // ----- diálogo con texto letra por letra -----
  paginate(text) {
    text = fillName(text);
    const out = []; const parts = String(text).split(/(?<=[.!?…])\s+/);
    let cur = '';
    parts.forEach(p => { if ((cur + ' ' + p).trim().length > 135 && cur) { out.push(cur.trim()); cur = p; } else cur = (cur + ' ' + p).trim(); });
    if (cur) out.push(cur);
    return out;
  },
  showSpeaker(opts) {
    const n = this.el.dialog.querySelector('.name');
    if (opts && opts.name) { n.textContent = opts.name; n.classList.remove('hidden'); } else n.classList.add('hidden');
    const p = this.el.portrait;
    if (opts && opts.portrait) { const ctx = p.getContext('2d'); ctx.imageSmoothingEnabled = false; ctx.clearRect(0,0,48,48); ctx.drawImage(opts.portrait, 0, 0); p.classList.remove('hidden'); } else p.classList.add('hidden');
  },
  say(lines, opts = {}) {
    if (!Array.isArray(lines)) lines = [lines];
    const pages = lines.flatMap(l => this.paginate(l)).filter(Boolean);
    this.busy++; this.el.toast.classList.add('hidden');
    const dlg = this.el.dialog, txt = dlg.querySelector('.txt'), arrow = dlg.querySelector('.arrow');
    this.showSpeaker(opts); dlg.classList.remove('hidden');
    return new Promise(res => {

// ---------------- UTILIDADES DE TIEMPO Y CURSADA ----------------

function sesionDe(code) { // sesión pendiente de hoy para la materia (o null)
  const m = S.materias[code]; if (!m || m.estado !== 'cursando' || S.receso) return null;

}
function sesionesHoy() { return Object.keys(S.materias).map(sesionDe).filter(Boolean).sort((a, b) => a.ini - b.ini); }
function sesionEnAula(n) { return sesionesHoy().find(s => s.aula === n) || null; }

// ---------------- MUNDO EN EJECUCIÓN ----------------

// ---------------- RENDER ----------------
let ctx = null;
function render() {
  const cv = ctx.canvas; ctx.imageSmoothingEnabled = false;
  if (Game.scene === 'title') { renderTitleBg(); return; }
  if (Game.scene !== 'world' || !W.map) { R(ctx, 0, 0, 240, 160, '#1b1d2a'); return; }
  const m = W.map;
  let wx = W.px * TS, wy = W.py * TS;
  if (W.moving) { const k = W.mt; wx = (W.from.x + (W.to.x - W.from.x) * k) * TS; wy = (W.from.y + (W.to.y - W.from.y) * k) * TS; }
  const mw = m.w * TS, mh = m.h * TS;
  let cx = Math.round(wx + 8 - 120), cy = Math.round(wy + 8 - 84);
  cx = mw <= 240 ? Math.round((mw - 240) / 2) : Math.max(0, Math.min(mw - 240, cx));
  cy = mh <= 160 ? Math.round((mh - 160) / 2) : Math.max(0, Math.min(mh - 160, cy));
  W.cam = { x: cx, y: cy };
  R(ctx, 0, 0, 240, 160, '#14151f');
  ctx.drawImage(m.canvas, -cx, -cy);
  const ents = W.npcs.map(n => ({ x: n.x * TS, y: n.y * TS, dir: n.dir, f: 0, look: n.look, key: n.key || ('n_' + (n.prof || n.id)), sit: n.sit }));
  const pf = W.moving ? (Math.floor(W.anim / 8) % 2 ? 1 : 2) : 0;
  ents.push({ x: wx, y: wy, dir: W.sitting ? W.sitting.dir : W.dir, f: pf, look: lookPlayer(), key: 'player_' + S.player.model + S.player.hair + S.player.clothes, sit: !!W.sitting, player: true });
  ents.sort((a, b) => a.y - b.y);
  ents.forEach(e => {
    const sx = e.x - cx, sy = e.y - cy;
    if (sx < -20 || sy < -30 || sx > 260 || sy > 180) return;
    const sheet = spriteFor(e.key, e.look);
    ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(sx + 8, sy + 14, 6, 2.5, 0, 0, Math.PI * 2); ctx.fill();
    if (e.sit) ctx.drawImage(sheet, e.f * 16, e.dir * 24, 16, 19, sx, sy - 9, 16, 19);

  });
}

// ---------------- MOVIMIENTO ----------------
function update(dt) {
  if (S) S.stats.playMs += dt;
  if (Game.scene !== 'world' || !W.map) return;
  if (W.moving) {
    const spd = Input.held.b ? 1 / 90 : 1 / 150;
    W.mt += dt * spd; W.anim += dt / 16;
    if (W.mt >= 1) {
      W.moving = false; W.px = W.to.x; W.py = W.to.y; S.pos = { map: W.map.id, x: W.px, y: W.py, dir: W.dir };
      paso(CONFIG.segPorPaso / 60);
      onArrive();
    }
    return;
  }
  if (UI.active() || W.sitting || Game.lockInput) return;
  const d = Input.dirHeld();
  if (!d) { W.holdT = 0; return; }
  const nd = DIRK[d];
  if (nd !== W.dir && W.holdT === 0) { W.dir = nd; W.holdT = 1; W.lastTurn = performance.now(); return; }
  if (performance.now() - W.lastTurn < 70 && W.holdT === 1) return;
  W.holdT = 2; W.dir = nd;
  if (S.locked) { Game.onDayLimit(); return; }
  const [vx, vy] = DIRV[nd], tx = W.px + vx, ty = W.py + vy;
  if (blocked(tx, ty)) { if (!W._bump || performance.now() - W._bump > 300) { Audio8.sfx('bump'); W._bump = performance.now(); } return; }
  W.from = { x: W.px, y: W.py }; W.to = { x: tx, y: ty }; W.mt = 0; W.moving = true;
}

  async endDay() {
    if (this._ending) return; this._ending = true;
    UI.closePanel();
    const resumen = [];
    // ausencias del día
    Object.keys(S.materias).forEach(code => {
      const s = sesionDe(code); if (!s) return;
      const m = S.materias[code], P = profeDe(code), nm = MATERIAS[code].corto;
      if (esExamen(s.tipo)) {
        m.ses[s.idx] = 'A'; m.estado = 'recursa'; m.resultado = 'Ausente al parcial';
        resumen.push(`Faltaste al ${nombreSesion(s.tipo).toLowerCase()} de ${nm}: tenés que recursarla.`);
        addLog(`Ausente al ${nombreSesion(s.tipo).toLowerCase()} de ${nm}. Recursa.`);
      } else {
        m.ses[s.idx] = 'A'; S.stats.faltas++;
        const cn = claseNum(s.tipo);
        S.estudio = cap(S.estudio - 0.5);
        if (P.asist === 'Baja') { resumen.push(`Faltaste a ${nm}. No te pone falta, pero te perdiste la clase ${cn}.`); }
        else {
          m.faltas++; m.recrim = P.asist === 'Alta';
          resumen.push(`Falta en ${nm} (${m.faltas}/${CONFIG.faltasMax}). Te perdiste la clase ${cn}.`);
          if (m.faltas > CONFIG.faltasMax) { m.estado = 'recursa'; m.resultado = 'Superó las faltas'; resumen.push(`Superaste las faltas permitidas en ${nm}: tenés que recursarla.`); }
        }
        S.profes[HORARIO[code].prof].desc.asist = true;
        addLog(`Ausente en ${nm} (${nombreSesion(s.tipo)}).`);
      }
    });
    // avanzar el calendario
    S.day++;
    if (S.day > 4) { S.day = 0; S.week++; }
    let finCuatri = false;
    if (S.week > CONFIG.semanasCursada && !S.receso) { S.receso = true; finCuatri = true; }
    S.time = CONFIG.diaInicio; S.locked = false;
    await UI.fade(async () => { setMap('planta', 11, 12, 1); this.updateHud(); });
    if (resumen.length) await UI.say(resumen);
    Save.write();
    this._ending = false;
    if (finCuatri) await Academia.finCuatrimestre();

// ---------------- ACADEMIA: CLASES Y EXÁMENES ----------------
const Academia = {
  async clase(s) {
    const code = s.code, M = MATERIAS[code], m = S.materias[code], P = PROFES[s.prof], st = S.profes[s.prof];
    const o = { name: P.nombre, portrait: profPortrait(s.prof) };
    const cn = claseNum(s.tipo), cl = M.clases[cn - 1];
    const tarde = S.time > s.ini;
    Audio8.sfx('bell');
    m.ses[s.idx] = tarde ? 'T' : 'P';
    if (tarde) await UI.say(P.tarde, o);
    if (m.recrim && P.recrimina) { await UI.say(P.recrimina, o); m.recrim = false; }
    await UI.say([P.inicio, `Hoy: «${cl.t}».`], o);
    // la clase
    for (let i = 0; i < cl.ap.length; i++) {
      await UI.say(cl.ap[i], o);
      if (i === 1) {
        const r = await UI.choose('¿Querés hacer una pregunta?', ['Levantar la mano', 'Seguir escuchando'], { cancel: 1 });
        if (r === 0) {
          if (P.animo === 'Harto') { st.vinc = Math.max(0, st.vinc - 1); await UI.say('{n}, no me interrumpas. Si quiero tu opinión, te la pido.', o); st.desc.pac = true; }
          else { st.vinc = Math.min(10, st.vinc + 0.5); await UI.say(['Buena pregunta. Te lo repito más despacio:', cl.ap[i]], o); }
        }
      }
    }
    m.apuntes[cn - 1] = true;
    Audio8.sfx('item');
    await UI.say(`(Anotaste ${cl.ap.length} apuntes en tu Libreta)`);
    // pregunta del profe a la clase
    const pool = [...M.p1, ...M.p2].filter(q => q.c === cn && (q.t === 'mc' || q.t === 'vf'));
    if (pool.length) {
      const q = pool[Math.floor(Math.random() * pool.length)];
      const opts = q.t === 'vf' ? ['Verdadero', 'Falso'] : shuffle(q.o.slice(0, 3));
      const r = await UI.choose(`${P.pregunta} ${q.q}`, opts, o);
      const ok = q.t === 'vf' ? (r === 0) === q.a : opts[r] === q.o[0];
      if (ok) { Audio8.sfx('good'); st.vinc = Math.min(10, st.vinc + 1); S.estudio = cap(S.estudio + 0.3); S.social = cap(S.social + 0.2); await UI.say(P.animo === 'Harto' ? 'Correcto, {n}. Al menos alguien lee.' : '¡Muy bien!', o); }
      else { Audio8.sfx('bad'); await UI.say(st.vinc >= 6 || P.pac === 'Alta' ? `No del todo. ${q.t === 'vf' ? q.x : 'Era: ' + q.o[0]} Repasalo.` : `No. ${q.t === 'vf' ? q.x : 'Era: ' + q.o[0]}`, o); }
    }
    await UI.say(P.cierre, o);
    st.clases++; st.desc.animo = true; if (st.clases >= 2) st.desc.pac = true;
    S.estudio = cap(S.estudio + CONFIG.estudioPorClase); S.stats.classes++;
    S.time = s.fin; addLog(`${tarde ? 'Llegaste tarde a' : 'Presente en'} ${M.corto} (clase ${cn}).`);
    Game.updateHud();
    if (S.time >= CONFIG.diaFin) { S.locked = true; Game.onDayLimit(); }
  },
  pickQuestions(code, which, P) {
    const m = S.materias[code], bank = MATERIAS[code]['p' + which].map((q, i) => ({ ...q, id: `p${which}-${i}` }));
    let pool = bank.filter(q => !m.seen.includes(q.id));
    if (pool.length < 5) { m.seen = m.seen.filter(id => !id.startsWith('p' + which)); pool = bank.slice(); }
    const pref = { 'Básica': { vf: 3, mc: 3, comp: 1, emp: 0.4, ord: 0.3 }, Intermedia: { mc: 3, vf: 1.5, emp: 1.5, comp: 1, ord: 1 }, Avanzada: { emp: 3, ord: 3, comp: 3, mc: 1, vf: 0.6 } }[P.prof];
    const take = (d) => {
      let c = pool.filter(q => q.d === d); if (!c.length) c = pool;
      let tot = c.reduce((a, q) => a + (pref[q.t] || 1) * Math.random(), 0) * 0, best = null, bv = -1;
      c.forEach(q => { const v = (pref[q.t] || 1) * Math.random(); if (v > bv) { bv = v; best = q; } });
      pool = pool.filter(q => q !== best); return best;
    };
    const targets = [1, 1, 2, 2, 3];
    let sorpresa = false;
    if (P.animo === 'Intenso' && Math.random() < 0.3) { targets[1] = 3; sorpresa = true; }
    const qs = targets.map(take).filter(Boolean);
    qs.forEach(q => m.seen.push(q.id));
    return { qs, sorpresa };
  },
  async examen(s) {

  async cierreCursada(code) {

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------------- PANTALLA DEL EXAMEN ----------------
const Examen = {
  elegirComodines(n) {
    if (n <= 0) return Promise.resolve({});
    return new Promise(res => {
      const sel = {};
      const COM = [['5050', '50/50', 'Elimina la mitad de las opciones incorrectas en una consigna.'], ['tiempo', 'Tiempo extra', '+50 % de tiempo en todo el examen.'], ['pista', 'Pista', 'Muestra tus apuntes de esa clase (si fuiste).']];
      const draw = () => {
        const body = UI.openPanel({ title: `Comodines (${Object.keys(sel).length}/${n})`, noBack: true,
          foot: [{ label: 'Empezar el examen ▶', fn: () => { UI.closePanel(); res(sel); } }] });
        body.innerHTML = `<p class="small">Tu nivel de estudio te da <b>${n}</b> comodín${n > 1 ? 'es' : ''}. Elegilos ahora: una vez empezado el examen no se pueden cambiar.</p>`;
        COM.forEach(([k, l, d]) => {
          const b = document.createElement('button'); b.className = 'opt' + (sel[k] ? ' ok' : '');
          b.innerHTML = `<b>${sel[k] ? '✔ ' : ''}${l}</b><br><span class="small">${d}</span>`;
          b.onclick = () => { if (sel[k]) delete sel[k]; else if (Object.keys(sel).length < n) sel[k] = true; Audio8.sfx('select'); draw(); };
          body.appendChild(b);
        });
      };
      draw();
    });
  },
  run({ code, which, qs, P, pac, exig, late, comodines, catalogacion }) {
    return new Promise(resolve => {
      const M = MATERIAS[code], m = S.materias[code];
      const lateF = Math.max(0.5, 1 - late / 60);
      const base = CONFIG.tiempoPorPregunta[pac] * lateF * (comodines.tiempo ? 1.5 : 1);
      let i = 0, total = 0, timer = null, tLeft = 0, tMax = 0;
      let ayudaProf = pac === 'Alta' || pac === 'Media' ? 1 : 0;
      let segunda = pac === 'Alta' ? 1 : 0;
      const com = { ...comodines };
      let usedReglas = false;
      const results = [];
      const next = () => {
        clearInterval(timer);
        if (i >= qs.length) return finish();
        show(qs[i]);
      };
      const finish = () => {
        clearInterval(timer);
        const body = UI.openPanel({ title: `${M.corto} — ${which === 'F' ? 'Examen final' : which === 1 ? 'Primer parcial' : 'Segundo parcial'}`, noBack: true, foot: [{ label: 'Entregar', fn: () => { UI.closePanel(); resolve({ total, usedReglas }); }, def: 1 }] });
        body.innerHTML = '<p><b>Resultado</b></p>' + results.map((r, k) => `<div class="small">${k + 1}. ${r.pts >= 1 ? '<span class="good">✔</span>' : r.pts > 0 ? '<span class="good">½</span>' : '<span class="bad">✘</span>'} ${esc(r.q)}</div>`).join('') + `<p>Total: <b>${fmtN(total)}</b> / 5</p>`;
      };
      const show = (q) => {
        const qi = i;
        let opts = null, answered = false, extraT = 0;
        const body = UI.openPanel({ title: `${M.corto} — ${which === 'F' ? 'Final' : 'Parcial ' + which} · ${qi + 1}/${qs.length}`, noBack: true });
        tMax = base * (q.t === 'emp' || q.t === 'ord' ? 1.6 : 1); tLeft = tMax;
        const tmr = document.createElement('div'); tmr.className = 'timer'; tmr.innerHTML = '<i></i>'; body.appendChild(tmr);
        const qd = document.createElement('div'); qd.className = 'q'; body.appendChild(qd);
        const area = document.createElement('div'); body.appendChild(area);
        const tools = document.createElement('div'); tools.className = 'comodines'; body.appendChild(tools);
        const hintBox = document.createElement('div'); body.appendChild(hintBox);
        const cn = q.c || 0, learned = cn ? m.apuntes[cn - 1] : true;
        const apOf = cn ? M.clases[cn - 1].ap : (M.repaso || []).slice(0, 8);
        const showHint = (title, lines) => { hintBox.innerHTML = `<div class="hint"><b>${esc(title)}</b><br>${lines.map(esc).join('<br>')}</div>`; };
        const grade = (frac, extra) => {
          if (answered) return; answered = true; clearInterval(timer);
          let pts = frac >= 1 ? 1 : 0;
          if (frac < 1 && frac > 0) { const need = { Baja: 0.5, Media: 0.75, Alta: 2 }[exig]; if (frac >= need) pts = 0.5; }
          if (pts > 0 && pac === 'Baja' && tLeft < tMax * 0.25) pts = Math.min(pts, 0.5);
          total += pts; results.push({ q: q.q, pts });
          Audio8.sfx(pts >= 1 ? 'good' : pts > 0 ? 'select' : 'bad');
          const fb = document.createElement('div'); fb.className = 'hint';
          let txt = pts >= 1 ? '¡Correcto!' : pts > 0 ? 'Medio punto: casi.' : (tLeft <= 0 ? '¡Se terminó el tiempo!' : 'Incorrecto.');
          if (q.t === 'vf') txt += ' ' + q.x;
          else if (pts < 1 && (q.t === 'mc' || q.t === 'comp')) txt += ' Era: ' + q.o[0] + '.';
          if (pts < 1 && P.aliento) txt += ' — ' + P.aliento;
          if (extra) txt = extra + ' ' + txt;
          fb.textContent = txt; hintBox.innerHTML = ''; hintBox.appendChild(fb);
          tools.innerHTML = '';
          const b = document.createElement('button'); b.className = 'opt'; b.style.textAlign = 'center'; b.textContent = qi + 1 < qs.length ? 'Siguiente ▶' : 'Ver resultado ▶';
          b.onclick = () => { Audio8.sfx('select'); i++; next(); };
          tools.appendChild(b); UI.setScope(UI.el.panel); UI.focusIdx = UI.focusables().indexOf(b); UI.refreshFocus();
        };
        // ---- render por tipo ----
        const mkOpt = (txt, fn) => { const b = document.createElement('button'); b.className = 'opt'; b.textContent = txt; b.onclick = fn; return b; };
        if (q.t === 'mc' || q.t === 'comp') {
          qd.textContent = q.t === 'comp' ? 'Completá: ' + q.q : q.q;
          let list = q.o.slice(); if (P.prof === 'Básica' && list.length > 3) list = [list[0], list[1], list[2]];
          opts = shuffle(list.map(t => ({ t, ok: t === q.o[0] })));
          opts.forEach(op => { op.el = mkOpt(op.t, () => {
            if (answered) return;
            if (!op.ok && segunda > 0) { segunda--; op.el.classList.add('gone'); Audio8.sfx('bad'); showHint(P.nombre + ':', ['Mmm, no. Pensalo otra vez, te doy otra oportunidad.']); UI.refreshFocus(true); return; }
            op.el.classList.add(op.ok ? 'ok' : 'no'); opts.find(x => x.ok).el.classList.add('ok'); grade(op.ok ? 1 : 0);
          }); area.appendChild(op.el); });
        } else if (q.t === 'vf') {
          qd.textContent = 'Verdadero o falso: ' + q.q;
          opts = [{ t: 'Verdadero', ok: q.a === true }, { t: 'Falso', ok: q.a === false }];
          opts.forEach(op => { op.el = mkOpt(op.t, () => {
            if (answered) return;
            if (!op.ok && segunda > 0) { segunda--; op.el.classList.add('gone'); Audio8.sfx('bad'); showHint(P.nombre + ':', ['¿Seguro? Pensalo de nuevo.']); UI.refreshFocus(true); return; }
            op.el.classList.add(op.ok ? 'ok' : 'no'); grade(op.ok ? 1 : 0);
          }); area.appendChild(op.el); });
        } else if (q.t === 'emp') {
          qd.textContent = q.q + ' (tocá cada respuesta para cambiarla)';
          const rights = shuffle(q.p.map(p => p[1]));
          const cur = q.p.map((_, k) => k % rights.length);
          if (q.p.every((p, k) => rights[cur[k]] === p[1])) cur.push(cur.shift());
          const fixed = {};
          const rows = q.p.map((p, k) => {
            const row = document.createElement('div'); row.className = 'row';
            const lab = document.createElement('div'); lab.className = 'lab'; lab.textContent = p[0];
            const b = mkOpt('', () => { if (answered || fixed[k]) return; cur[k] = (cur[k] + 1) % rights.length; b.textContent = rights[cur[k]] + ' ⟳'; Audio8.sfx('blip'); });
            b.textContent = rights[cur[k]] + ' ⟳';
            row.appendChild(lab); row.appendChild(b); area.appendChild(row); return { b, k };
          });
          const conf = mkOpt('✔ Confirmar respuesta', () => {
            if (answered) return;
            let ok = 0; q.p.forEach((p, k) => { const good = rights[cur[k]] === p[1]; if (good) ok++; rows[k].b.classList.add(good ? 'ok' : 'no'); });
            grade(ok / q.p.length, ok < q.p.length ? 'Correctas: ' + q.p.map(p => p[0] + ' → ' + p[1]).join(' · ') + '.' : '');
          }); conf.style.textAlign = 'center'; area.appendChild(conf);
          opts = { fix: (n) => { let done = 0; q.p.forEach((p, k) => { if (done >= n || fixed[k]) return; cur[k] = rights.indexOf(p[1]); fixed[k] = true; rows[k].b.textContent = rights[cur[k]] + ' 🔒'; rows[k].b.classList.add('ok'); done++; }); } };
        } else if (q.t === 'ord') {
          qd.textContent = q.q + ' (usá ▲ ▼ para mover)';
          let order = shuffle(q.o.slice()); if (order.join() === q.o.join()) order.reverse();
          const locked = {};
          const drawOrd = () => {
            area.innerHTML = '';
            order.forEach((it, k) => {
              const row = document.createElement('div'); row.className = 'row';
              const lab = document.createElement('div'); lab.className = 'lab'; lab.textContent = (k + 1) + '. ' + it + (locked[it] ? ' 🔒' : '');
              const up = mkOpt('▲', () => { if (answered || k === 0 || locked[it] || locked[order[k - 1]]) return; [order[k - 1], order[k]] = [order[k], order[k - 1]]; Audio8.sfx('blip'); drawOrd(); UI.refreshFocus(); });
              const dn = mkOpt('▼', () => { if (answered || k === order.length - 1 || locked[it] || locked[order[k + 1]]) return; [order[k + 1], order[k]] = [order[k], order[k + 1]]; Audio8.sfx('blip'); drawOrd(); UI.refreshFocus(); });
              up.classList.add('mini'); dn.classList.add('mini');
              row.appendChild(lab); row.appendChild(up); row.appendChild(dn); area.appendChild(row);
            });
            const conf = mkOpt('✔ Confirmar orden', () => {
              if (answered) return;
              let ok = 0; order.forEach((it, k) => { if (q.o[k] === it) ok++; });
              grade(ok / q.o.length, ok < q.o.length ? 'Orden correcto: ' + q.o.join(' → ') + '.' : '');
            }); conf.style.textAlign = 'center'; area.appendChild(conf);
          };
          drawOrd();
          opts = { fix: (n) => { for (let k = 0; k < n; k++) { const it = q.o[k]; order = order.filter(x => x !== it); order.splice(k, 0, it); locked[it] = true; } drawOrd(); } };
        }
        // ---- herramientas: comodines, ayuda del profe, consultar ----
        const tool = (label, fn) => { const b = mkOpt(label, () => { if (answered) return; Audio8.sfx('select'); fn(b); }); tools.appendChild(b); return b; };
        if (com['5050'] && q.t !== 'vf') tool('50/50', (b) => {
          delete com['5050']; b.remove();
          if (Array.isArray(opts)) { const wrong = shuffle(opts.filter(x => !x.ok && !x.el.classList.contains('gone'))); wrong.slice(0, Math.ceil(wrong.length / 2)).forEach(x => x.el.classList.add('gone')); }
          else opts.fix(Math.ceil((q.p || q.o).length / 2));
          UI.refreshFocus(true);
        });
        if (com.pista) tool('Pista', (b) => {
          delete com.pista; b.remove();
          if (learned) showHint(cn ? `Tus apuntes — Clase ${cn}` : 'Tu repaso para el final', apOf); else showHint('Pista', [`No tenés apuntes de la clase ${cn}: faltaste.`]);
        });
        if (ayudaProf > 0 && q.t !== 'vf') tool('Pedir ayuda al profe', (b) => {
          ayudaProf--; b.remove();
          if (Array.isArray(opts)) { const w = opts.find(x => !x.ok && !x.el.classList.contains('gone')); if (w) w.el.classList.add('gone'); }
          else opts.fix(1);
          showHint(P.nombre + ':', [P.aliento || 'Te ayudo con una. El resto, pensalo vos.']); UI.refreshFocus(true);
        });
        if (catalogacion && S.inv.reglas) tool('Consultar reglas', (b) => {
          b.remove(); usedReglas = true; tLeft -= tMax * 0.25;
          showHint('Reglas de catalogación, CDD y CDU', apOf);
        });
        // ---- temporizador ----
        const bar = tmr.querySelector('i');
        timer = setInterval(() => {
          if (answered) return;
          tLeft -= 0.1;
          const f = Math.max(0, tLeft / tMax); bar.style.width = (f * 100) + '%'; bar.className = f < 0.25 ? 'crit' : f < 0.5 ? 'warn' : '';
          if (tLeft <= 0) {
            if (q.t === 'emp' || q.t === 'ord') { const c = [...area.querySelectorAll('.opt')].pop(); c.click(); }
            else { if (Array.isArray(opts)) { const g = opts.find(x => x.ok); if (g && g.el) g.el.classList.add('ok'); } grade(0); }
          }
        }, 100);
        UI.setScope(UI.el.panel);
      };
      next();
    });
  },
};

function fitScreen() {

  const w = window.innerWidth - 16, h = window.innerHeight - padH;
  let s = Math.min(w / 240, h / 160);

// ============================================================
// ETAPA 2 — cuatrimestres, inscripciones, correlatividades,
// bedelía (reclamos y cambio de materia) y mesas de finales
// ============================================================
const SEMANA_MESAS = CONFIG.semanasCursada + 1; // semana 7: mesas de final e inscripción
CONFIG.inscApertura = 19 * 60;       // la inscripción abre el lunes de la semana de mesas a las 19:00
CONFIG.inscAviso = 18 * 60;          // aviso una hora antes
CONFIG.inscVentana = 25;             // si entrás 25 minutos después, perdés el cupo
CONFIG.mesaHora = [18 * 60, 19 * 60];
CONFIG.reclamosMax = 2;
CONFIG.exitoReclamo = 0.55;

// ---------------- MATERIAS EN EL ESTADO ----------------
function mkMateria(estado, cuatri) { return { estado, cuatri: cuatri || 0, ses: [null, null, null, null, null, null], faltas: 0, notas: [null, null], apuntes: [false, false, false, false], seen: [], recrim: false, resultado: null, finales: [] }; }
function mat(code) { return S.materias[code] || { estado: 'libre', ses: [], notas: [], apuntes: [], seen: [], finales: [] }; }
function cursadaAprobada(code) { const e = mat(code).estado; return e === 'final' || e === 'aprobada'; }
function ensureProfe(pid) { S.profes[pid] = S.profes[pid] || { vinc: 0, desc: { animo: false, pac: false, exig: false, prof: false, asist: false }, clases: 0 }; }
function enMesas() { return S.week === SEMANA_MESAS; }

// repaso automático para materias que no lo traen (Inglés)
function factOf(q) {
  if (q.t === 'mc' || q.t === 'comp') return q.q.replace('___', '[' + q.o[0] + ']') + (q.t === 'mc' ? ' → ' + q.o[0] + '.' : '');
  if (q.t === 'vf') return (q.a ? q.q + ' ' : '') + (q.x || '');
  if (q.t === 'ord') return q.q.replace(/\.$/, '') + ': ' + q.o.join(' → ') + '.';
  return '';
}
Object.values(MATERIAS).forEach(M => { if (!M.repaso && M.fin) M.repaso = M.fin.map(factOf).filter(Boolean); });

function mensajeMesa(x, y) { return MENSAJES_MESAS[Math.floor(hash2(x * 7 + (S ? S.day : 0), y * 13 + (S ? S.week * 5 + S.cuatri : 0), 4) * MENSAJES_MESAS.length)]; }

// ---------------- MIGRACIÓN Y VALIDACIÓN ----------------
function migrate(st) {
  if (st && st.v === 1) {
    st.v = 2;
    st.inscr = { pend: [], reclamos: 0, cambio: false, aviso: {} };
    st.mesas = [];
    Object.values(st.materias || {}).forEach(m => { m.cuatri = m.cuatri || 1; m.finales = m.finales || []; });
    if (st.receso) { st.week = SEMANA_MESAS; delete st.receso; }
    if (st.time > CONFIG.finClases && st.locked) st.locked = true;
  }
  return st;
}
validState = function (st) {
  try {
    if (!st || st.v !== CONFIG.version) return false;
    if (!st.player || typeof st.player.name !== 'string' || !st.player.name.trim() || st.player.name.length > 14) return false;
    if (!st.pos || !MAPS[st.pos.map] || !Number.isFinite(st.pos.x) || !Number.isFinite(st.pos.y)) return false;
    if (!Number.isFinite(st.week) || !Number.isFinite(st.day) || !Number.isFinite(st.time) || !Number.isFinite(st.cuatri)) return false;
    if (!st.materias || typeof st.materias !== 'object' || !st.inscr || !Array.isArray(st.inscr.pend) || !Array.isArray(st.mesas)) return false;
    for (const k in st.materias) { const m = st.materias[k]; if (!MATERIAS[k] || !HORARIO[k] || !Array.isArray(m.ses) || m.ses.length !== 6 || !Array.isArray(m.notas)) return false; }
    if (!st.profes || !st.inv || !st.flags || !Array.isArray(st.log)) return false;
    return true;
  } catch (e) { return false; }
};
Save.load = function () {
  try { const raw = localStorage.getItem(CONFIG.saveKey); if (!raw) return null; const st = migrate(JSON.parse(raw)); return validState(st) ? st : 'corrupt'; }
  catch (e) { return 'corrupt'; }
};
const _newState = newState;
newState = function (player) {
  const st = _newState(player);
  st.inscr = { pend: [], reclamos: 0, cambio: false, aviso: {} };
  st.mesas = [];
  delete st.receso;
  Object.keys(st.materias).forEach(c => { st.materias[c] = mkMateria('cursando', 1); });
  return st;
};

// ---------------- CALENDARIO: CLASES Y MESAS ----------------
sesionDe = function (code) {
  const m = S.materias[code]; if (!m) return null;
  const h = HORARIO[code]; if (h.dia !== S.day) return null;
  if (enMesas()) {
    if (!S.mesas.includes(code) || m.estado !== 'final') return null;
    const [ini, fin] = CONFIG.mesaHora;
    return { code, idx: 'F', tipo: 'F', ini, fin, aula: h.aula, prof: h.prof, mesa: true };
  }
  if (m.estado !== 'cursando' || S.week > CONFIG.semanasCursada) return null;
  const idx = S.week - 1; if (m.ses[idx] !== null) return null;
  const [ini, fin] = turno(code);
  return { code, idx, tipo: sesionTipo(S.week), ini, fin, aula: h.aula, prof: h.prof };
};
sesionesHoy = function () { return Object.keys(S.materias).map(sesionDe).filter(Boolean).sort((a, b) => a.ini - b.ini); };
sesionVisibleEnAula = function (n) {
  return Object.keys(S.materias).map(code => {
    const h = HORARIO[code], m = S.materias[code];
    if (h.dia !== S.day || h.aula !== n) return null;
    if (enMesas()) { if (!(S.mesas.includes(code) || m.rindioHoy === S.week * 10 + S.day)) return null; const [ini, fin] = CONFIG.mesaHora; return { code, ini, fin, prof: h.prof, tipo: 'F' }; }
    if (S.week > CONFIG.semanasCursada || m.cuatri !== S.cuatri || !(m.estado === 'cursando' || m.ses[S.week - 1] !== null)) return null;
    const [ini, fin] = turno(code); return { code, ini, fin, prof: h.prof, idx: S.week - 1, tipo: sesionTipo(S.week) };
  }).filter(Boolean).find(s => S.time >= s.ini - 15 && S.time < s.fin) || null;
};
aulaMapId = function (n) {
  const hoy = Object.keys(S.materias).filter(c => HORARIO[c].aula === n && HORARIO[c].dia === S.day && (S.materias[c].estado === 'cursando' || S.mesas.includes(c)));
  return 'aula' + n + (hoy.some(c => HORARIO[c].prof === 'baja') ? 'U' : '');
};

// ---------------- RELOJ: 21:30 terminan las clases, 22:30 cierra ----------------
paso = function (min) {
  if (S.locked) return;
  const before = S.time;
  if (before >= CONFIG.finClases) S.time += min / 2;
  else { S.time += min; if (S.time > CONFIG.finClases) S.time = CONFIG.finClases + (S.time - CONFIG.finClases) / 2; }
  avisosReloj(before, S.time);
  if (S.time >= CONFIG.diaFin) { S.time = CONFIG.diaFin; S.locked = true; Game.onDayLimit(); }
  Game.updateHud();
};
function avisosReloj(a, b) {
  const cruza = (t) => a < t && b >= t;
  if (enMesas() && S.day === 0) {
    if (cruza(CONFIG.inscAviso) && !S.inscr.aviso['a' + S.cuatri]) { S.inscr.aviso['a' + S.cuatri] = 1; Game.notify(['📢 Blog del IFTS 13: en una hora (19:00) abre la inscripción al próximo cuatrimestre.', 'Entrá al blog desde el MENÚ o desde las compus de la biblioteca. Si llegás 25 minutos tarde, perdés el cupo.']); }
    if (cruza(CONFIG.inscApertura) && !S.inscr.aviso['b' + S.cuatri]) { S.inscr.aviso['b' + S.cuatri] = 1; Game.notify(['📢 ¡Abrió la inscripción! Tenés hasta las 19:25 para anotarte.']); }
  }
  if (cruza(CONFIG.finClases) && !enMesasSinClases()) Game.onClassesOver();
}
function enMesasSinClases() { return false; }
Game.notifQ = [];
Game.notify = function (lines) { this.notifQ.push(lines); Audio8.sfx('bell'); UI.toast(Array.isArray(lines) ? lines[0] : lines, 2500); };

// ---------------- FIN DEL DÍA ----------------
Game.endDay = async function () {
  if (this._ending) return; this._ending = true;
  UI.closePanel();
  const resumen = [];
  if (!this._skipAus) Object.keys(S.materias).forEach(code => {
    const s = sesionDe(code); if (!s) return;
    const m = S.materias[code], P = profeDe(code), nm = MATERIAS[code].corto;
    if (s.mesa) {
      S.mesas = S.mesas.filter(c => c !== code);
      m.estado = 'recursa'; m.resultado = 'Ausente al final';
      resumen.push(`Te anotaste a la mesa de ${nm} y no fuiste: tenés que recursarla.`);
      addLog(`Ausente a la mesa de final de ${nm}. Recursa.`);
    } else if (esExamen(s.tipo)) {
      m.ses[s.idx] = 'A'; m.estado = 'recursa'; m.resultado = 'Ausente al parcial';
      resumen.push(`Faltaste al ${nombreSesion(s.tipo).toLowerCase()} de ${nm}: tenés que recursarla.`);
      addLog(`Ausente al ${nombreSesion(s.tipo).toLowerCase()} de ${nm}. Recursa.`);
    } else {
      m.ses[s.idx] = 'A'; S.stats.faltas++;
      const cn = claseNum(s.tipo);
      S.estudio = cap(S.estudio - 0.5);
      if (P.asist === 'Baja') resumen.push(`Faltaste a ${nm}. No te pone falta, pero te perdiste la clase ${cn}.`);
      else {
        m.faltas++; m.recrim = P.asist === 'Alta';
        resumen.push(`Falta en ${nm} (${fmtN(m.faltas)}/${CONFIG.faltasMax}). Te perdiste la clase ${cn}.`);
        if (m.faltas > CONFIG.faltasMax) { m.estado = 'recursa'; m.resultado = 'Superó las faltas'; resumen.push(`Superaste las faltas permitidas en ${nm}: tenés que recursarla.`); }
      }
      ensureProfe(HORARIO[code].prof); S.profes[HORARIO[code].prof].desc.asist = true;
      addLog(`Ausente en ${nm} (${nombreSesion(s.tipo)}).`);
    }
  });
  S.day++;
  let evento = null;
  if (S.day > 4) {
    S.day = 0; S.week++;
    if (S.week === SEMANA_MESAS) { evento = 'fin'; S.inscr.reclamos = 0; S.inscr.cambio = false; }
    if (S.week > SEMANA_MESAS) { evento = 'nuevo'; }

  if (resumen.length) await UI.say(resumen);
  if (evento === 'fin') await Academia.finCuatrimestre();
  if (evento === 'nuevo') await Inscripciones.empezarCuatrimestre();
  Save.write();
  this._ending = false;
  await this.dayStartCard();
};

Academia.clase = async function (s) {

  const o = { name: P.nombre, portrait: profPortrait(s.prof) };

  Audio8.sfx('bell');

  if (tarde) await UI.say(P.tarde, o);
  if (m.recrim && P.recrimina) { await UI.say(P.recrimina, o); m.recrim = false; }
  await UI.say([P.inicio, `Hoy: «${cl.t}».`], o);
  const an = ANECDOTAS[code] && ANECDOTAS[code][cn];
  if (an) await UI.say(an, o);
  // Café literario de María Pérez (clase 4 = quinta sesión del nivel)
  if (code === 'LIJ' && cn === 4) {
    const r = await UI.choose('¿Qué les pareció el café literario? ¡Quiero escucharlos!', ['¡Me encantó! Traje mi libro favorito', 'Estuvo lindo', 'No fui...'], o);
    if (r === 0) { st.vinc = Math.min(10, st.vinc + 1); await UI.say('¡Eso! ¡Así se participa!', o); }
    else if (r === 1) await UI.say('Bien. La próxima quiero más entusiasmo, ¿eh?', o);
    else { st.vinc = Math.max(0, st.vinc - 0.5); await UI.say('Mmm. Te lo perdiste, {n}.', o); }
  }
  // el profe dicta lo central; el resto queda en la Libreta
  const dict = cl.ap.length > 4 ? shuffle(cl.ap.slice()).slice(0, 4) : cl.ap;
  for (let i = 0; i < dict.length; i++) {
    await UI.say(dict[i], o);
    if (i === 1) {
      const r = await UI.choose(P.participa ? '¿Levantás la mano para participar?' : '¿Querés hacer una pregunta?', ['Levantar la mano', 'Seguir escuchando'], { cancel: 1 });
      if (r === 0) {
        if (P.interrumpe) { st.vinc = Math.max(0, st.vinc - 0.5); await UI.say(P.interrumpe, o); st.desc.pac = true; }
        else { st.vinc = Math.min(10, st.vinc + (P.participa ? 1 : 0.5)); await UI.say(P.participa ? ['¡Muy bien, {n}! ¡Eso es participar!', dict[i]] : ['Buena pregunta. Te lo repito más despacio:', dict[i]], o); }
      } else if (P.participa) { st.vinc = Math.max(0, st.vinc - 0.3); await UI.say('¿Nadie? ¡Acá se participa, eh!', o); }
    }
  }
  m.apuntes[cn - 1] = true;
  Audio8.sfx('item');
  await UI.say(cl.ap.length > dict.length ? `(Anotaste ${cl.ap.length} apuntes en tu Libreta: lo que dictó y lo que quedó en el pizarrón)` : `(Anotaste ${cl.ap.length} apuntes en tu Libreta)`);
  const pool = [...M.p1, ...M.p2].filter(q => q.c === cn && (q.t === 'mc' || q.t === 'vf'));
  if (pool.length) {
    const q = pool[Math.floor(Math.random() * pool.length)];
    const opts = q.t === 'vf' ? ['Verdadero', 'Falso'] : shuffle(q.o.slice(0, 3));
    const r = await UI.choose(`${P.pregunta} ${q.q}`, opts, o);
    const ok = q.t === 'vf' ? (r === 0) === q.a : opts[r] === q.o[0];
    if (ok) { Audio8.sfx('good'); st.vinc = Math.min(10, st.vinc + 1); S.estudio = cap(S.estudio + 0.3); S.social = cap(S.social + 0.2); await UI.say(P.bien || '¡Muy bien!', o); }
    else { Audio8.sfx('bad'); await UI.say(st.vinc >= 6 || P.pac === 'Alta' ? `No del todo. ${q.t === 'vf' ? q.x : 'Era: ' + q.o[0]} Repasalo.` : `No. ${q.t === 'vf' ? q.x : 'Era: ' + q.o[0]}`, o); }
  }
  await UI.say(P.cierre, o);
  st.clases++; st.desc.animo = true; if (st.clases >= 2) st.desc.pac = true;
  S.estudio = cap(S.estudio + CONFIG.estudioPorClase); S.stats.classes++;
  S.time = s.fin; addLog(`${tarde ? 'Llegaste tarde a' : 'Presente en'} ${M.corto} (clase ${cn}).`);
  Game.updateHud();
  if (S.time >= CONFIG.finClases) Game.onClassesOver();
};

Academia.pickQuestions = function (code, bankKey, P) {
  const m = S.materias[code], key = bankKey;
  const bank = (MATERIAS[code][key] || []).map((q, i) => ({ ...q, id: `${key}-${i}` }));
  let pool = bank.filter(q => !m.seen.includes(q.id));
  if (pool.length < 5) { m.seen = m.seen.filter(id => !id.startsWith(key + '-')); pool = bank.slice(); }
  const pref = { 'Básica': { vf: 3, mc: 3, comp: 1, ord: 0.3 }, Intermedia: { mc: 3, vf: 1.5, comp: 1, ord: 1 }, Avanzada: { ord: 3, comp: 3, mc: 1.2, vf: 0.8 } }[P.prof] || {};
  const take = (d) => {
    let c = pool.filter(q => q.d === d); if (!c.length) c = pool;
    let best = null, bv = -1;
    c.forEach(q => { const v = (pref[q.t] || 1) * Math.random(); if (v > bv) { bv = v; best = q; } });
    pool = pool.filter(q => q !== best); return best;
  };
  const targets = [1, 1, 2, 2, 3];
  let sorpresa = false;
  if (P.animo === 'Intenso' && Math.random() < 0.3) { targets[1] = 3; sorpresa = true; }
  const qs = targets.map(take).filter(Boolean);
  qs.forEach(q => m.seen.push(q.id));
  return { qs, sorpresa, rest: pool };
};
Academia.examen = async function (s) {
  if (s.tipo === 'F') return Finales.rendir(s);
  const code = s.code, M = MATERIAS[code], m = S.materias[code], P = PROFES[s.prof]; ensureProfe(s.prof); const st = S.profes[s.prof];
  const o = { name: P.nombre, portrait: profPortrait(s.prof) };
  const which = s.tipo === 'P1' ? 1 : 2;
  const late = Math.max(0, S.time - s.ini);
  Audio8.sfx('bell');
  if (late > 0) await UI.say(`Llegaste ${Math.round(late)} minutos tarde: vas a tener menos tiempo.`, o);
  let pac = P.pac;
  if (m.recrim && P.asist === 'Alta') { await UI.say(P.recrimina, o); pac = { Alta: 'Media', Media: 'Baja', Baja: 'Baja' }[pac]; m.recrim = false; }
  await UI.say(P.examen, o);
  const exig = P.exig === 'Impredecible' ? ['Baja', 'Media', 'Alta'][Math.floor(Math.random() * 3)] : P.exig;
  const hadReglas = S.inv.reglas && code.startsWith('CAT');
  const comodines = await Examen.elegirComodines(CONFIG.comodinesPorEstudio(S.estudio));
  const { qs, sorpresa } = this.pickQuestions(code, 'p' + which, P);
  if (sorpresa) await UI.say('¡Sorpresa! Agregué una pregunta difícil.', o);
  Audio8.play('examen');
  const res = await Examen.run({ code, which, qs, P, pac, exig, late, comodines, catalogacion: code.startsWith('CAT') });
  Audio8.play(W.map.music);
  let nota = res.total;
  if (P.exig === 'Impredecible' && Math.random() < 0.15) { await UI.say('Mmm... no llegué a corregir todo. Les pongo a todos por lo menos un 3. ¡Sigan vendiendo!', o); nota = Math.max(nota, 3); }
  nota = Math.round(nota * 2) / 2;
  m.notas[which - 1] = nota; m.ses[s.idx] = nota;
  st.desc.exig = true; st.desc.prof = true; S.stats.exams++;
  if (hadReglas) S.inv.reglas = false;
  addLog(`${nombreSesion(s.tipo)} de ${M.corto}: ${fmtN(nota)}/5.`);
  Audio8.sfx(nota >= 3 ? 'good' : 'bad');
  await UI.say([`Nota del ${nombreSesion(s.tipo).toLowerCase()}: ${fmtN(nota)} / 5.`, which === 2 ? '' : (esPromocionable(code) ? 'Recordá: con 7 o más entre los dos parciales, promocionás.' : `Para ir a final en esta materia necesitás al menos ${CONFIG.noPromoMinParcial} en cada parcial.`)].filter(Boolean), o);
  if (hadReglas) await UI.say('Devolviste las reglas, la CDD y la CDU a la biblioteca. Para el próximo examen, buscalas de nuevo.');
  S.time = s.fin;
  if (which === 2) await this.cierreCursada(code);
  Game.updateHud();
  if (S.time >= CONFIG.finClases) Game.onClassesOver();
};
Academia.cierreCursada = async function (code) {
  const m = S.materias[code], [n1, n2] = m.notas, sum = (n1 || 0) + (n2 || 0), nm = MATERIAS[code].nombre;
  let msg;
  const mesa = 'Anotate a la mesa en el blog: los finales se toman en la semana de mesas.';
  if (!esPromocionable(code)) {
    if (n1 >= CONFIG.noPromoMinParcial && n2 >= CONFIG.noPromoMinParcial && sum >= CONFIG.finalMin) { m.estado = 'final'; m.resultado = `Cursada aprobada (${fmtN(sum)}). Debe final.`; msg = `${nm}: cursada aprobada con ${fmtN(sum)}. Es de final obligatorio. ${mesa}`; }
    else { m.estado = 'recursa'; m.resultado = `Desaprobada (${fmtN(n1)} y ${fmtN(n2)})`; msg = `${nm}: necesitabas al menos ${CONFIG.noPromoMinParcial} en cada parcial. Tenés que recursarla.`; }
  } else if (sum >= CONFIG.promoMin) { m.estado = 'aprobada'; m.resultado = `Promocionada con ${fmtN(sum)}`; S.aprobadas[code] = sum; msg = `¡${nm} PROMOCIONADA con ${fmtN(sum)}!`; Audio8.sfx('item'); }
  else if (sum >= CONFIG.finalMin) { m.estado = 'final'; m.resultado = `Debe final (${fmtN(sum)})`; msg = `${nm}: sumaste ${fmtN(sum)}. Vas a final. ${mesa}`; }
  else { m.estado = 'recursa'; m.resultado = `Desaprobada (${fmtN(sum)})`; msg = `${nm}: sumaste ${fmtN(sum)}. Tenés que recursarla.`; }
  addLog(msg);
  await UI.say(msg);
};
