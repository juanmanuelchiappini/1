<!DOCTYPE html>
<html lang="es">
<head>

<title>IFTS 13 RPG — Bibliotecología</title>
<style>

.bars { display: inline-flex; gap: calc(var(--s)*.6px); vertical-align: middle; margin-left: calc(var(--s)*2px); }
.bars i { display: inline-block; width: calc(var(--s)*2.2px); height: calc(var(--s)*5px); background: #3a3d55; border-radius: 1px; }

/* ---------- Cuadro de diálogo ---------- */
#dialog { position: absolute; left: calc(var(--s)*3px); right: calc(var(--s)*3px); bottom: calc(var(--s)*3px); min-height: calc(var(--s)*42px); background: var(--paper); border: calc(var(--s)*2px) solid var(--frame); box-shadow: inset 0 0 0 calc(var(--s)*1px) var(--frame2), 0 0 0 calc(var(--s)*1px) #2a3048; border-radius: calc(var(--s)*4px); padding: calc(var(--s)*4px) calc(var(--s)*7px); cursor: pointer; }
#dialog .name { position: absolute; top: calc(var(--s)*-9px); left: calc(var(--s)*8px); background: #4a5a7c; color: #fff; font-weight: bold; padding: 0 calc(var(--s)*4px); border-radius: calc(var(--s)*2px); font-size: calc(var(--s)*6px); border: calc(var(--s)*1px) solid #2a3048; }
#dialog .txt { text-shadow: calc(var(--s)*.6px) calc(var(--s)*.6px) 0 #d8d8d0; white-space: pre-wrap; }

@keyframes bob { from { transform: translateY(0) } to { transform: translateY(calc(var(--s)*1.5px)) } }

/* ---------- Opciones ---------- */
#choices { position: absolute; right: calc(var(--s)*4px); bottom: calc(var(--s)*50px); background: var(--paper); border: calc(var(--s)*2px) solid var(--frame); box-shadow: inset 0 0 0 calc(var(--s)*1px) var(--frame2); border-radius: calc(var(--s)*4px); padding: calc(var(--s)*3px) calc(var(--s)*4px); max-width: 70%; max-height: calc(var(--s)*100px); overflow-y: auto; }
.btn { display: block; width: 100%; text-align: left; background: none; border: none; font: inherit; color: var(--ink); padding: calc(var(--s)*1.2px) calc(var(--s)*4px) calc(var(--s)*1.2px) calc(var(--s)*9px); cursor: pointer; position: relative; border-radius: calc(var(--s)*2px); }
.btn.focus, .btn:hover { background: #e4e8f4; }
.btn.focus::before { content: "▶"; position: absolute; left: calc(var(--s)*1.5px); color: #c0392b; font-size: .8em; top: 50%; transform: translateY(-50%); }
.btn:disabled { color: #9a9a9a; }
/* ---------- Paneles ---------- */
#panel { position: absolute; inset: calc(var(--s)*3px); background: var(--paper); border: calc(var(--s)*2px) solid var(--frame); box-shadow: inset 0 0 0 calc(var(--s)*1px) var(--frame2), 0 0 0 calc(var(--s)*1px) #2a3048; border-radius: calc(var(--s)*4px); display: flex; flex-direction: column; overflow: hidden; }
#panel .head { background: linear-gradient(#5a7ab8, #4a64a0); color: #fff; font-weight: bold; padding: calc(var(--s)*2px) calc(var(--s)*6px); text-shadow: calc(var(--s)*.6px) calc(var(--s)*.6px) 0 #223; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
#panel .body { flex: 1; overflow-y: auto; padding: calc(var(--s)*4px) calc(var(--s)*6px); touch-action: pan-y; -webkit-overflow-scrolling: touch; }
#panel .foot { padding: calc(var(--s)*2px) calc(var(--s)*4px); border-top: calc(var(--s)*1px) solid #d8dcea; display: flex; gap: calc(var(--s)*2px); flex-wrap: wrap; }
#panel .foot .btn { width: auto; flex: 1; text-align: center; background: #eef0f8; padding-left: calc(var(--s)*8px); }
.tabs { display: flex; gap: calc(var(--s)*1px); flex-wrap: wrap; }
.tabs .btn { width: auto; padding: 0 calc(var(--s)*3px) 0 calc(var(--s)*8px); color: #fff; font-size: .85em; }

.tabs .btn.focus, .tabs .btn:hover { background: rgba(255,255,255,.35); }

.timer { height: calc(var(--s)*3px); background: #e0e3ee; border-radius: 2px; overflow: hidden; margin: calc(var(--s)*1px) 0 calc(var(--s)*3px); }
.timer i { display: block; height: 100%; background: #2f9e6e; width: 100%; transition: width .2s linear; }
.timer i.warn { background: #e8b830; } .timer i.crit { background: #c0392b; }
.q { font-weight: bold; margin-bottom: calc(var(--s)*3px); }
.opt { display: block; width: 100%; margin: calc(var(--s)*1.2px) 0; text-align: left; background: #fff; border: calc(var(--s)*1px) solid #c8cee0; border-radius: calc(var(--s)*3px); font: inherit; color: var(--ink); padding: calc(var(--s)*2px) calc(var(--s)*4px) calc(var(--s)*2px) calc(var(--s)*9px); cursor: pointer; position: relative; }
.opt.focus, .opt:hover { border-color: #5a7ab8; background: #eef2ff; }
.opt.focus::before { content: "▶"; position: absolute; left: calc(var(--s)*2px); color: #c0392b; font-size: .8em; top: 50%; transform: translateY(-50%); }
.opt.ok { background: #d9f2e3; border-color: #2f9e6e; } .opt.no { background: #f8dcd8; border-color: #c0392b; } .opt.gone { opacity: .25; pointer-events: none; }
.row { display: flex; gap: calc(var(--s)*2px); align-items: center; margin: calc(var(--s)*1.2px) 0; }
.row .lab { flex: 1; background: #fff; border: calc(var(--s)*1px) solid #c8cee0; border-radius: calc(var(--s)*3px); padding: calc(var(--s)*1.5px) calc(var(--s)*3px); }
.row .opt { flex: 1.2; margin: 0; }
.row .mini { flex: 0 0 auto; width: auto; padding: calc(var(--s)*1.5px) calc(var(--s)*3px) calc(var(--s)*1.5px) calc(var(--s)*8px); margin: 0; }
.comodines { display: flex; gap: calc(var(--s)*2px); flex-wrap: wrap; margin-top: calc(var(--s)*2px); }
.comodines .opt { width: auto; flex: 1; text-align: center; font-size: .82em; background: #fff8e0; }
.hint { background: #fff8e0; border: calc(var(--s)*1px) dashed #d2a92a; border-radius: calc(var(--s)*3px); padding: calc(var(--s)*2px) calc(var(--s)*3px); margin-top: calc(var(--s)*2px); font-size: .88em; }
/* ---------- Título y creación ---------- */
.title-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.logo { font-size: calc(var(--s)*17px); font-weight: 900; color: #f7d55a; letter-spacing: calc(var(--s)*.5px); text-shadow: calc(var(--s)*1px) calc(var(--s)*1px) 0 #8a3f2e, calc(var(--s)*2px) calc(var(--s)*2px) 0 #3a1c14; line-height: 1; }
.sub { color: #f4f0e0; font-weight: bold; margin: calc(var(--s)*2px) 0 calc(var(--s)*6px); text-shadow: calc(var(--s)*.6px) calc(var(--s)*.6px) 0 #000; font-size: calc(var(--s)*6.5px); }
.menu { background: var(--paper); border: calc(var(--s)*2px) solid var(--frame); border-radius: calc(var(--s)*4px); padding: calc(var(--s)*3px); min-width: 46%; }
.models { display: flex; gap: calc(var(--s)*4px); justify-content: center; }
.model { background: #fff; border: calc(var(--s)*1px) solid #c8cee0; border-radius: calc(var(--s)*3px); padding: calc(var(--s)*2px); cursor: pointer; font: inherit; color: var(--ink); }

.model.on { border-color: #c0392b; box-shadow: 0 0 0 calc(var(--s)*1px) #c0392b; } .model.focus { background: #eef2ff; }
.swatches { display: flex; gap: calc(var(--s)*1.5px); flex-wrap: wrap; }
.sw { width: calc(var(--s)*10px); height: calc(var(--s)*10px); border-radius: calc(var(--s)*2px); border: calc(var(--s)*1px) solid #555; cursor: pointer; padding: 0; }

input.name { font: inherit; padding: calc(var(--s)*1.5px) calc(var(--s)*3px); border: calc(var(--s)*1px) solid #8a94b8; border-radius: calc(var(--s)*2px); width: calc(var(--s)*70px); max-width: 100%; }
#preview { width: calc(var(--s)*32px); height: calc(var(--s)*48px); image-rendering: pixelated; }
/* ---------- Avisos y transición ---------- */

#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .18s; }
#fade.on { opacity: 1; }
#cheat { position: absolute; left: 50%; top: 40%; transform: translate(-50%,-50%); background: #111; border: 2px solid #3f3; padding: 6px; }
#cheat input { font: 14px monospace; background: #000; color: #3f3; border: none; outline: none; width: 220px; }
/* ---------- Controles táctiles ---------- */
#pad { display: flex; justify-content: space-between; align-items: center; width: min(100%, calc(240px * var(--s) + 40px)); max-width: 560px; padding: 0 4px; touch-action: none; }
.dpad { position: relative; width: 132px; height: 132px; }
.dpad button { position: absolute; width: 44px; height: 44px; background: #2b2e44; border: 2px solid #11121b; color: #9aa3c8; font-size: 18px; border-radius: 8px; touch-action: none; }

button:active { filter: brightness(1.3); }
#keys { color: #7e86aa; font-size: 12px; text-align: center; }
@media (hover: hover) and (pointer: fine) { #pad { display: none; } }

<script>

function dificultadProfe(p) {
  const e = { Baja:1, Media:2, Alta:3 }[p.exig];
  const pa = { Alta:1, Media:2, Baja:3 }[p.pac];
  const pr = { 'Básica':1, Intermedia:2, Avanzada:3 }[p.prof];
  if (!e) return { n: '6–8', txt: 'Variable' };
  const n = e + pa + pr;
  return { n, txt: n <= 4 ? 'Fácil' : n <= 6 ? 'Normal' : 'Difícil' };
}

ICI: {

      '"Ciencia" viene de scientia (de scire, saber). Para Bunge, la ciencia aplicada a producir bienes se convierte en tecnología.',
      'Sentidos de la información: potencial (la que podría dar un objeto), efectiva (la que necesita el receptor) y real (la que recibe). La comunicación es solo la transmisión: no es lo mismo que información.',
      'Para Briet, una estrella no es un documento, pero su fotografía o el catálogo de estrellas sí.',
      'Paradigmas de Capurro, en orden: físico (Shannon y Weaver; se lo critica por excluir al usuario), cognitivo (Belkin, Brookes) y social (Hjørland).',
      'Multidisciplina: las disciplinas trabajan por separado. Interdisciplina: dialogan. Transdisciplina: crean un campo común nuevo.' ]},
    { t: 'El proceso informativo documental y el SID', ap: [
      'Se dice "ciencia de la información" en singular porque su objeto es uno solo: la información.',
      'El mensaje es material (un documento); la información es una cualidad inmaterial que depende del receptor.',
      'El proceso informativo documental no tiene fase de creación: trabaja con documentos que ya existen.',
      'Silencio: no se recupera algo pertinente. Ruido: se recupera lo que no sirve.',
      'Sistema según Bertalanffy: entrada, proceso y salida. El macrosistema de un SID es la organización donde está inserto.' ]},
    { t: 'Bases de datos, TIC y difusión', ap: [
      'En una tabla, el campo es la columna y el registro es la fila. Bases según Blajean: factuales (estadísticas), de directorio (personas o instituciones) y documentales (cada registro es un documento).',
      'El operador XOR recupera A o B, pero no los dos. Un tesauro es una lista de términos relacionados jerárquicamente para indizar y recuperar.',
      'Software libre: ICA-AtoM para archivos, Koha para bibliotecas, CollectionSpace para museos. Las TIC son herramientas, no la gestión en sí misma.' ]},
    { t: 'Las instituciones documentales', ap: [
      '"Documento" viene del latín docere, enseñar.',
      'Archivo: procedencia y orden natural. Biblioteca: tema y necesidades de los usuarios. Centro de documentación: análisis exhaustivo y documentos secundarios. Museo: conservación de las piezas.',

function tFloor(ctx, px, py, x, y, dark) {

// Hoja de sprites 48x96: columnas = cuadros (quieto, paso A, paso B), filas = abajo, arriba, izquierda, derecha
function buildPerson(look) {
  const sheet = mkCanvas(48, 96);
  const sctx = sheet.getContext('2d');
  for (let dir = 0; dir < 4; dir++) for (let f = 0; f < 3; f++) {
    const g = drawPersonGrid(look, dir === 3 ? 2 : dir, f);
    if (dir === 3) g.forEach(row => row.reverse());
    outlineGrid(g, look.outline || PAL.outline);
    gridTo(sctx, g, f * 16, dir * 24);
  }
  return sheet;
}
function newGrid(w, h) { return Array.from({ length: h }, () => Array(w).fill(null)); }
function gr(g, x, y, w, h, c) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (g[j] && i >= 0 && i < g[j].length) g[j][i] = c; }
function outlineGrid(g, col) {
  const h = g.length, w = g[0].length, mark = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (!g[y][x]) {
    if ((g[y-1]&&g[y-1][x]) || (g[y+1]&&g[y+1][x]) || g[y][x-1] || g[y][x+1]) mark.push([x,y]);
  }
  mark.forEach(([x,y]) => g[y][x] = col);
}
function gridTo(ctx, g, ox, oy) { g.forEach((row, y) => row.forEach((c, x) => { if (c) { ctx.fillStyle = c; ctx.fillRect(ox + x, oy + y, 1, 1); } })); }

function drawPersonGrid(L, dir, f) {
  const g = newGrid(16, 24);
  const skin = L.skin, skinD = shade(skin, -0.18), hair = L.hair, hairD = shade(hair, -0.25), hairL = shade(hair, 0.22);
  const top = L.top, topD = shade(top, -0.25), bot = L.bottom, botD = shade(bot, -0.25), shoe = L.shoes || '#2A2A2A';
  const stepA = f === 1, stepB = f === 2;
  if (dir === 0 || dir === 1) {
    // piernas
    const lyl = stepA ? -1 : 0, lyr = stepB ? -1 : 0;
    gr(g, 5, 18, 3, 4 + lyl, bot); gr(g, 8, 18, 3, 4 + lyr, botD);
    gr(g, 4, 22 + lyl, 4, 2, shoe); gr(g, 8, 22 + lyr, 4, 2, shade(shoe, -0.2));
    if (L.style === 'long' && L.skirt) gr(g, 4, 17, 8, 3, bot);
    // torso

    if (L.inner && dir === 0) { gr(g, 7, 11, 2, 6, L.inner); }
    if (L.apron && dir === 0) { gr(g, 5, 13, 6, 6, '#F2F2EE'); gr(g, 5, 13, 6, 1, '#DADAD4'); }
    // brazos
    const al = stepB ? 1 : 0, ar = stepA ? 1 : 0;
    gr(g, 3, 12 + al, 1, 5, top); gr(g, 12, 12 + ar, 1, 5, topD);
    gr(g, 3, 17 + al, 1, 1, skin); gr(g, 12, 17 + ar, 1, 1, skinD);
    if (L.necklace && dir === 0) { [5,7,9].forEach(x => gr(g, x, 12, 1, 1, '#8A5A36')); gr(g, 6, 13, 1, 1, '#8A5A36'); gr(g, 8, 13, 1, 1, '#8A5A36'); }
    // cabeza
    gr(g, 4, 3, 8, 8, skin); gr(g, 10, 3, 2, 8, skinD); gr(g, 6, 10, 4, 1, skinD);
    if (dir === 0) {
      gr(g, 6, 6, 1, 2, '#2A1E1A'); gr(g, 9, 6, 1, 2, '#2A1E1A');
      gr(g, 5, 8, 1, 1, shade(skin, -0.05)); gr(g, 7, 9, 2, 1, shade(skin, -0.25));
      if (L.glasses) { gr(g, 5, 6, 3, 2, '#DDE8EE'); gr(g, 8, 6, 3, 2, '#DDE8EE'); gr(g, 6, 6, 1, 2, '#2A1E1A'); gr(g, 9, 6, 1, 2, '#2A1E1A'); gr(g, 5, 5, 6, 1, '#3A3A3A'); }
      if (L.beard) { gr(g, 5, 8, 6, 3, hair); gr(g, 7, 9, 2, 1, shade(skin, -0.25)); }
    }

    if (dir === 1) { gr(g, 4, 3, 8, 7, hair); gr(g, 10, 3, 2, 7, hairD); if (L.style === 'bald') { gr(g, 5, 3, 6, 5, skin); } }
  } else {
    // perfil (mira a la izquierda)
    const legF = stepA ? -1 : stepB ? 1 : 0;
    gr(g, 6 + legF, 18, 3, 4, bot); gr(g, 7 - legF, 18, 3, 4, botD);
    gr(g, 5 + legF, 22, 4, 2, shoe); gr(g, 7 - legF, 22, 4, 2, shade(shoe, -0.2));
    gr(g, 5, 11, 6, 8, top); gr(g, 9, 11, 2, 8, topD); gr(g, 5, 11, 6, 1, shade(top, 0.15));
    if (L.apron) gr(g, 5, 13, 2, 6, '#F2F2EE');
    const sw = stepA ? -1 : stepB ? 1 : 0;
    gr(g, 7 + sw, 12, 2, 5, topD); gr(g, 7 + sw, 17, 2, 1, skin);
    gr(g, 5, 3, 7, 8, skin); gr(g, 4, 6, 1, 2, skin); gr(g, 9, 3, 3, 8, skinD);
    gr(g, 6, 6, 1, 2, '#2A1E1A'); gr(g, 5, 9, 2, 1, shade(skin, -0.25));
    if (L.glasses) { gr(g, 5, 6, 3, 2, '#DDE8EE'); gr(g, 6, 6, 1, 2, '#2A1E1A'); gr(g, 8, 5, 3, 1, '#3A3A3A'); }
    if (L.beard) { gr(g, 5, 8, 5, 3, hair); }
    hairSide(g, L, hair, hairD, hairL);

}
function hairDown(g, L, back, h, hd, hl) {
  const s = L.style;
  if (s === 'bald') { gr(g, 4, 5, 1, 2, h); gr(g, 11, 5, 1, 2, h); return; }
  gr(g, 4, 2, 8, 3, h); gr(g, 5, 1, 6, 1, h); gr(g, 4, 5, 1, 2, h); gr(g, 11, 5, 1, 2, hd);
  gr(g, 6, 2, 3, 1, hl);
  if (s === 'square') { gr(g, 4, 1, 8, 1, h); }
  if (s === 'curly') { [4,6,8,10].forEach(x => gr(g, x, 0, 2, 1, h)); gr(g, 3, 3, 1, 4, h); gr(g, 12, 3, 1, 4, hd); }
  if (s === 'long') { gr(g, 3, 4, 2, 10, h); gr(g, 11, 4, 2, 10, hd); if (back) gr(g, 4, 9, 8, 5, h); }
  if (s === 'bob') { gr(g, 3, 4, 2, 6, h); gr(g, 11, 4, 2, 6, hd); if (back) gr(g, 4, 8, 8, 2, h); }
  if (s === 'ponytail' && back) { gr(g, 7, 9, 2, 6, h); }
  if (s === 'bun') { gr(g, 6, 0, 4, 2, hd); gr(g, 7, 0, 2, 1, h); }
}
function hairSide(g, L, h, hd, hl) {
  const s = L.style;
  if (s === 'bald') { gr(g, 9, 5, 2, 2, h); return; }
  gr(g, 5, 2, 7, 3, h); gr(g, 6, 1, 5, 1, h); gr(g, 9, 2, 3, 6, h); gr(g, 6, 2, 3, 1, hl);
  if (s === 'curly') { gr(g, 5, 0, 2, 1, h); gr(g, 8, 0, 2, 1, h); gr(g, 12, 3, 1, 4, hd); }
  if (s === 'long') gr(g, 9, 4, 3, 10, hd);
  if (s === 'bob') gr(g, 9, 4, 3, 6, hd);
  if (s === 'ponytail') { gr(g, 12, 4, 2, 2, h); gr(g, 12, 6, 2, 6, hd); }
  if (s === 'bun') gr(g, 10, 0, 3, 3, hd);
}

function buildPortrait(look, bg) {
  const c = mkCanvas(48, 48), ctx = c.getContext('2d');
  R(ctx, 0, 0, 48, 48, bg || '#7FB9E6'); R(ctx, 0, 34, 48, 14, shade(bg || '#7FB9E6', -0.15));
  const g = newGrid(48, 48);
  const skin = look.skin, skinD = shade(skin, -0.18), h = look.hair, hd = shade(h, -0.25), hl = shade(h, 0.25);
  const top = look.top, topD = shade(top, -0.25);
  const ell = (cx, cy, rx, ry, col) => { for (let y = Math.floor(cy-ry); y <= cy+ry; y++) for (let x = Math.floor(cx-rx); x <= cx+rx; x++) if (((x-cx)/rx)**2 + ((y-cy)/ry)**2 <= 1) gr(g, x, y, 1, 1, col); };
  const s = look.style;
  // pelo de atrás
  if (s === 'long') { gr(g, 11, 14, 26, 30, hd); }
  if (s === 'bob') { gr(g, 11, 14, 26, 16, hd); }
  if (s === 'ponytail') { gr(g, 34, 18, 5, 14, hd); }
  // hombros
  ell(24, 47, 19, 9, top); ell(30, 47, 13, 7, topD); gr(g, 5, 46, 38, 2, top);
  if (look.inner) { gr(g, 21, 39, 6, 9, look.inner); }
  if (look.apron) { gr(g, 16, 42, 16, 6, '#F2F2EE'); }
  if (look.necklace) { for (let x = 17; x <= 31; x += 2) gr(g, x, 40 + Math.round(Math.abs(x-24)/4), 1, 1, '#8A5A36'); }
  // cuello y cara
  gr(g, 20, 32, 8, 6, skinD);
  ell(24, 23, 10, 12, skin); ell(29, 25, 5, 10, skinD); ell(24, 23, 9, 11, skin);
  // orejas
  gr(g, 13, 22, 2, 5, skinD); gr(g, 33, 22, 2, 5, skinD);
  // ojos
  [[18,22],[27,22]].forEach(([x,y]) => { gr(g, x, y, 4, 3, '#FFFFFF'); gr(g, x+1, y, 2, 3, '#2A1E1A'); gr(g, x+1, y, 1, 1, '#FFFFFF'); gr(g, x, y-2, 4, 1, hd); });
  gr(g, 23, 25, 2, 3, skinD);
  gr(g, 21, 30, 6, 1, '#9A4A3A'); gr(g, 22, 31, 4, 1, shade(skin, -0.1));
  if (look.beard) { gr(g, 15, 27, 18, 7, h); ell(24, 32, 8, 4, h); gr(g, 21, 29, 6, 2, '#9A4A3A'); gr(g, 20, 28, 8, 1, h); }
  if (look.glasses) { [[17,21],[26,21]].forEach(([x,y]) => { gr(g, x, y, 6, 1, '#2A2A2A'); gr(g, x, y+4, 6, 1, '#2A2A2A'); gr(g, x, y, 1, 5, '#2A2A2A'); gr(g, x+5, y, 1, 5, '#2A2A2A'); }); gr(g, 23, 22, 3, 1, '#2A2A2A'); }
  // pelo de arriba
  if (s !== 'bald') {
    ell(24, 13, 12, 7, h); gr(g, 12, 13, 3, 9, h); gr(g, 33, 13, 3, 9, hd);
    gr(g, 18, 8, 8, 2, hl);
    if (s === 'curly') { for (let x = 13; x <= 35; x += 4) ell(x, 9, 3, 3, h); }
    if (s === 'square') { gr(g, 13, 7, 22, 6, h); gr(g, 15, 7, 12, 1, hl); }
    if (s === 'long' || s === 'bob') { gr(g, 11, 14, 4, s==='long'?24:14, h); gr(g, 33, 14, 4, s==='long'?24:14, hd); }
    if (s === 'bun') { ell(24, 5, 6, 4, hd); ell(23, 4, 3, 2, h); }
    if (s === 'short' || s === 'ponytail' || s === 'bob' || s === 'long') gr(g, 15, 14, 18, 2, h);
  } else { gr(g, 13, 18, 3, 6, h); gr(g, 32, 18, 3, 6, hd); }
  outlineGrid(g, PAL.outline);
  gridTo(ctx, g, 0, 0);
  return c;
}

const WALKABLE = new Set(['.', ',', 'q', 'S', 'L', 'D', 'd', 'e']);

class GameMap {
  constructor(id, w, h, fill) {
    this.id = id; this.w = w; this.h = h;
    this.t = Array.from({ length: h }, () => Array(w).fill(fill));
    this.deco = []; this.warps = {}; this.inter = {}; this.music = 'pasillo';
    this.dark = false; this.canvas = null; this.name = '';
  }
  tile(x, y) { return (x < 0 || y < 0 || x >= this.w || y >= this.h) ? 'W' : this.t[y][x]; }
  set(x, y, c) { if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.t[y][x] = c; }
  fill(x0, y0, x1, y1, c) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) this.set(x, y, c); }
  solidAt(x, y) { return !WALKABLE.has(this.tile(x, y)); }
  block(x0, y0, x1, y1, face = 'B') { this.fill(x0, y0, x1, y1 - 1, 'W'); this.fill(x0, y1, x1, y1, face); }
  warp(x, y, to) { this.warps[x + ',' + y] = to; }
  on(x, y, fn) { this.inter[x + ',' + y] = fn; }
}

function drawTileAt(ctx, map, x, y) {
  const px = x * TS, py = y * TS, c = map.tile(x, y);
  switch (c) {
    case '.': tFloor(ctx, px, py, x, y, false); break;
    case ',': tFloor(ctx, px, py, x, y, true); break;
    case 'q': tBathFloor(ctx, px, py, x, y); break;
    case 'W': tCap(ctx, px, py, x, y, map); break;
    case 'B': { const above = map.tile(x, y-1), below = map.tile(x, y+1);
      tBrick(ctx, px, py, x, y, { base: below !== 'B' && below !== 'H', top: above === 'W' && map.tallWall }); break; }
    case 'b': tBathFace(ctx, px, py, x, y); break;
    case 'D': tDoorFace(ctx, px, py, false); break;
    case 'd': tDoorTop(ctx, px, py, x, y, false); break;
    case 'e': tDoorTop(ctx, px, py, x, y, true); break;
    case 'S': tStairs(ctx, px, py, map.tile(x-1,y) === 'R' ? 'L' : map.tile(x+1,y) === 'R' ? 'R' : ''); break;
    case 'L': tLanding(ctx, px, py); break;
    case 'R': tVoid(ctx, px, py, x, y, map); break;
    case 's': tSmallStairs(ctx, px, py, x, y); break;
    case 'k': tDesk(ctx, px, py, 't'); break;
    case 'K': tDesk(ctx, px, py, 'b'); break;
    case 'c': tChair(ctx, px, py, 'R'); break;
    case 'C': tChair(ctx, px, py, 'L'); break;
    case 't': tTeacherDesk(ctx, px, py, 't'); break;
    case 'T': tTeacherDesk(ctx, px, py, 'b'); break;

// ---------------- AULAS ----------------
function buildAula(n) {
  const side = PIZARRON[n];
  const m = new GameMap('aula' + n, 14, 11, ',');
  m.name = 'Aula ' + n; m.music = 'aula'; m.dark = true; m.tallWall = true; m.aula = n;
  m.boardSide = side;
  m.fill(0, 0, 13, 0, 'W'); m.fill(0, 10, 13, 10, 'W'); m.fill(0, 0, 0, 10, 'W'); m.fill(13, 0, 13, 10, 'W');
  m.fill(1, 1, 12, 2, 'B');
  const X = (x) => side === 'R' ? x : 13 - x;
  // pizarrón en pared lateral
  m.boardY0 = 3; m.boardY1 = 8;
  for (let y = 3; y <= 8; y++) m.set(X(13), y, 'P');
  // escritorio docente
  m.set(X(11), 4, 't'); m.set(X(11), 5, 'T');
  m.profPos = { x: X(12), y: 6, dir: side === 'R' ? 2 : 3 };
  // pupitres dobles con sillas mirando al pizarrón
  m.seats = [];
  [3, 6, 9].forEach(cx => [[3, 4], [6, 7]].forEach(([ya, yb]) => {
    m.set(X(cx), ya, 'k'); m.set(X(cx), yb, 'K');
    const ch = side === 'R' ? 'c' : 'C';
    m.set(X(cx - 1), ya, ch); m.set(X(cx - 1), yb, ch);
    m.seats.push({ x: X(cx - 1), y: ya }, { x: X(cx - 1), y: yb });
  }));
  // puerta inferior
  m.set(7, 10, 'd'); m.warp(7, 10, { map: 'piso1', aulaOut: n });
  m.entry = { x: 7, y: 9, dir: 1 };
  // decoración variable por aula
  const cols = ['#E85D75', '#3A7BD5', '#2F9E6E', '#E8B830', '#8E5BB8', '#E07A3A'];
  m.deco.push({ k: 'clock', x: 6 + (n % 3), y: 1 });
  m.deco.push({ k: 'poster', x: 2 + (n % 2), y: 1, c: cols[n % 6] }, { k: 'poster', x: 10 - (n % 2), y: 2, c: cols[(n + 2) % 6] });
  m.deco.push({ k: 'window', x: 4 + (n % 4), y: 1 });
  if (n % 2) m.deco.push({ k: 'cards', x: 8 + (n % 3), y: 1 });
  return m;
}

  titleT += 0.25;
  const m = MAPS.piso1;
  const x = Math.floor((Math.sin(titleT / 200) * 0.5 + 0.5) * (m.w * TS - 240));
  ctx.drawImage(m.canvas, -x, -Math.floor(5.5 * TS));
  ctx.fillStyle = 'rgba(20,16,30,.45)'; ctx.fillRect(0, 0, 240, 160);
}

// ---------------- MOVIMIENTO ----------------
function update(dt) {
  if (S) S.stats.playMs += dt;
  if (Game.scene !== 'world' || !W.map) return;
  if (W.moving) {
    const spd = Input.held.b ? 1 / 90 : 1 / 150;
    W.mt += dt * spd; W.anim += dt / 16;
    if (W.mt >= 1) {
      W.moving = false; W.px = W.to.x; W.py = W.to.y; S.pos = { map: W.map.id, x: W.px, y: W.py, dir: W.dir };
      paso(CONFIG.segPorPaso / 60);
      onArrive();
    }
    return;
  }
  if (UI.active() || W.sitting || Game.lockInput) return;
  const d = Input.dirHeld();
  if (!d) { W.holdT = 0; return; }
  const nd = DIRK[d];
  if (nd !== W.dir && W.holdT === 0) { W.dir = nd; W.holdT = 1; W.lastTurn = performance.now(); return; }
  if (performance.now() - W.lastTurn < 70 && W.holdT === 1) return;
  W.holdT = 2; W.dir = nd;
  if (S.locked) { Game.onDayLimit(); return; }
  const [vx, vy] = DIRV[nd], tx = W.px + vx, ty = W.py + vy;
  if (blocked(tx, ty)) { if (!W._bump || performance.now() - W._bump > 300) { Audio8.sfx('bump'); W._bump = performance.now(); } return; }
  W.from = { x: W.px, y: W.py }; W.to = { x: tx, y: ty }; W.mt = 0; W.moving = true;
}
function onArrive() {
  const wp = W.map.warps[W.px + ',' + W.py];
  if (!wp) return;
  Game.doWarp(wp);
}

// ---------------- JUEGO ----------------
const Game = {

    setInterval(() => { if (this.scene === 'world') Save.write(); }, 30000);
    let last = performance.now();
    const loop = (t) => { const dt = Math.min(50, t - last); last = t; update(dt); render(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
    this.title();

    if (t === 't' || t === 'T') return UI.say(m.id === 'biblioteca' ? 'El mostrador de préstamo. Hay una pila de fichas para ordenar.' : 'El escritorio del profesor.');

// ---------------- ACADEMIA: CLASES Y EXÁMENES ----------------
const Academia = {
  async clase(s) {
    const code = s.code, M = MATERIAS[code], m = S.materias[code], P = PROFES[s.prof], st = S.profes[s.prof];
    const o = { name: P.nombre, portrait: profPortrait(s.prof) };

    const tarde = S.time > s.ini;

    m.ses[s.idx] = tarde ? 'T' : 'P';
    if (tarde) await UI.say(P.tarde, o);

    await UI.say([P.inicio, `Hoy: «${cl.t}».`], o);
    // la clase
    for (let i = 0; i < cl.ap.length; i++) {
      await UI.say(cl.ap[i], o);

    await UI.say(`(Anotaste ${cl.ap.length} apuntes en tu Libreta)`);
    // pregunta del profe a la clase
    const pool = [...M.p1, ...M.p2].filter(q => q.c === cn && (q.t === 'mc' || q.t === 'vf'));
    if (pool.length) {
      const q = pool[Math.floor(Math.random() * pool.length)];

      const r = await UI.choose(`${P.pregunta} ${q.q}`, opts, o);

      if (ok) { Audio8.sfx('good'); st.vinc = Math.min(10, st.vinc + 1); S.estudio = cap(S.estudio + 0.3); S.social = cap(S.social + 0.2); await UI.say(P.animo === 'Harto' ? 'Correcto. Al menos alguien lee.' : '¡Muy bien!', o); }
      else { Audio8.sfx('bad'); await UI.say(st.vinc >= 6 || P.pac === 'Alta' ? `No del todo. ${q.t === 'vf' ? q.x : 'Era: ' + q.o[0]} Repasalo.` : `No. ${q.t === 'vf' ? q.x : 'Era: ' + q.o[0]}`, o); }
    }
    await UI.say(P.cierre, o);
    st.clases++; st.desc.animo = true; if (st.clases >= 2) st.desc.pac = true;
    S.estudio = cap(S.estudio + CONFIG.estudioPorClase); S.stats.classes++;
    S.time = s.fin; addLog(`${tarde ? 'Llegaste tarde a' : 'Presente en'} ${M.corto} (clase ${cn}).`);
    Game.updateHud();
    if (S.time >= CONFIG.diaFin) { S.locked = true; Game.onDayLimit(); }
  },
  pickQuestions(code, which, P) {
    const m = S.materias[code], bank = MATERIAS[code]['p' + which].map((q, i) => ({ ...q, id: `p${which}-${i}` }));
    let pool = bank.filter(q => !m.seen.includes(q.id));
    if (pool.length < 5) { m.seen = m.seen.filter(id => !id.startsWith('p' + which)); pool = bank.slice(); }
    const pref = { 'Básica': { vf: 3, mc: 3, comp: 1, emp: 0.4, ord: 0.3 }, Intermedia: { mc: 3, vf: 1.5, emp: 1.5, comp: 1, ord: 1 }, Avanzada: { emp: 3, ord: 3, comp: 3, mc: 1, vf: 0.6 } }[P.prof];
    const take = (d) => {
      let c = pool.filter(q => q.d === d); if (!c.length) c = pool;
      let tot = c.reduce((a, q) => a + (pref[q.t] || 1) * Math.random(), 0) * 0, best = null, bv = -1;
      c.forEach(q => { const v = (pref[q.t] || 1) * Math.random(); if (v > bv) { bv = v; best = q; } });
      pool = pool.filter(q => q !== best); return best;
    };
    const targets = [1, 1, 2, 2, 3];
    let sorpresa = false;
    if (P.animo === 'Intenso' && Math.random() < 0.3) { targets[1] = 3; sorpresa = true; }
    const qs = targets.map(take).filter(Boolean);
    qs.forEach(q => m.seen.push(q.id));
    return { qs, sorpresa };
  },
  async examen(s) {
    const code = s.code, M = MATERIAS[code], m = S.materias[code], P = PROFES[s.prof], st = S.profes[s.prof];

    let pac = P.pac;
    if (m.recrim && P.asist === 'Alta') { await UI.say(P.recrimina, o); pac = { Alta: 'Media', Media: 'Baja', Baja: 'Baja' }[pac]; m.recrim = false; }
    await UI.say(P.examen, o);
    let exig = P.exig === 'Impredecible' ? ['Baja', 'Media', 'Alta'][Math.floor(Math.random() * 3)] : P.exig;

    nota = Math.round(nota * 2) / 2;

    st.desc.exig = true; st.desc.prof = true; S.stats.exams++;
    if (S.inv.reglas && code.startsWith('CAT')) { S.inv.reglas = false; }
    addLog(`${nombreSesion(s.tipo)} de ${M.corto}: ${fmtN(nota)}/5.`);
    Audio8.sfx(nota >= 3 ? 'good' : 'bad');
    await UI.say([`Nota del ${nombreSesion(s.tipo).toLowerCase()}: ${fmtN(nota)} / 5.`, which === 2 ? '' : (esPromocionable(code) ? 'Recordá: con 7 o más entre los dos parciales, promocionás.' : `Para ir a final en esta materia necesitás al menos ${CONFIG.noPromoMinParcial} en cada parcial.`)].filter(Boolean), o);
    if (hadReglas) await UI.say('Devolviste las reglas, la CDD y la CDU a la biblioteca. Para el próximo parcial, buscalas de nuevo.');
    S.time = s.fin;
    if (which === 2) await this.cierreCursada(code);
    Game.updateHud();
    if (S.time >= CONFIG.diaFin) { S.locked = true; Game.onDayLimit(); }
  },
  async cierreCursada(code) {
    const m = S.materias[code], [n1, n2] = m.notas, sum = (n1 || 0) + (n2 || 0), nm = MATERIAS[code].nombre;

    else { m.estado = 'recursa'; m.resultado = `Desaprobada (${fmtN(sum)})`; msg = `${nm}: sumaste ${fmtN(sum)}. Tenés que recursarla.`; }

        <p>Promedio general: <b>${fmtN(promedio())}</b> · Niveles aprobados: <b>${Object.keys(S.aprobadas).length}/28</b></p>
        <p class="small muted">Las inscripciones al próximo cuatrimestre, las mesas de finales y los recuperatorios llegan en la etapa 2 del juego. Tu partida queda guardada.</p>`,

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------------- PANTALLA DEL EXAMEN ----------------
const Examen = {
  elegirComodines(n) {
    if (n <= 0) return Promise.resolve({});
    return new Promise(res => {
      const sel = {};
      const COM = [['5050', '50/50', 'Elimina la mitad de las opciones incorrectas en una consigna.'], ['tiempo', 'Tiempo extra', '+50 % de tiempo en todo el examen.'], ['pista', 'Pista', 'Muestra tus apuntes de esa clase (si fuiste).']];
      const draw = () => {
        const body = UI.openPanel({ title: `Comodines (${Object.keys(sel).length}/${n})`, noBack: true,
          foot: [{ label: 'Empezar el examen ▶', fn: () => { UI.closePanel(); res(sel); } }] });
        body.innerHTML = `<p class="small">Tu nivel de estudio te da <b>${n}</b> comodín${n > 1 ? 'es' : ''}. Elegilos ahora: una vez empezado el examen no se pueden cambiar.</p>`;
        COM.forEach(([k, l, d]) => {
          const b = document.createElement('button'); b.className = 'opt' + (sel[k] ? ' ok' : '');
          b.innerHTML = `<b>${sel[k] ? '✔ ' : ''}${l}</b><br><span class="small">${d}</span>`;
          b.onclick = () => { if (sel[k]) delete sel[k]; else if (Object.keys(sel).length < n) sel[k] = true; Audio8.sfx('select'); draw(); };
          body.appendChild(b);
        });
      };
      draw();
    });
  },
  run({ code, which, qs, P, pac, exig, late, comodines, catalogacion }) {
    return new Promise(resolve => {
      const M = MATERIAS[code], m = S.materias[code];
      const lateF = Math.max(0.5, 1 - late / 60);
      const base = CONFIG.tiempoPorPregunta[pac] * lateF * (comodines.tiempo ? 1.5 : 1);
      let i = 0, total = 0, timer = null, tLeft = 0, tMax = 0;
      let ayudaProf = pac === 'Alta' || pac === 'Media' ? 1 : 0;
      let segunda = pac === 'Alta' ? 1 : 0;
      const com = { ...comodines };
      let usedReglas = false;
      const results = [];
      const next = () => {
        clearInterval(timer);
        if (i >= qs.length) return finish();
        show(qs[i]);
      };
      const finish = () => {
        clearInterval(timer);
        const body = UI.openPanel({ title: `${M.corto} — ${which === 1 ? 'Primer' : 'Segundo'} parcial`, noBack: true, foot: [{ label: 'Entregar', fn: () => { UI.closePanel(); resolve({ total, usedReglas }); }, def: 1 }] });
        body.innerHTML = '<p><b>Resultado</b></p>' + results.map((r, k) => `<div class="small">${k + 1}. ${r.pts >= 1 ? '<span class="good">✔</span>' : r.pts > 0 ? '<span class="good">½</span>' : '<span class="bad">✘</span>'} ${esc(r.q)}</div>`).join('') + `<p>Total: <b>${fmtN(total)}</b> / 5</p>`;
      };
      const show = (q) => {
        const qi = i;
        let opts = null, answered = false, extraT = 0;
        const body = UI.openPanel({ title: `${M.corto} — Parcial ${which} · ${qi + 1}/${qs.length}`, noBack: true });
        tMax = base * (q.t === 'emp' || q.t === 'ord' ? 1.6 : 1); tLeft = tMax;
        const tmr = document.createElement('div'); tmr.className = 'timer'; tmr.innerHTML = '<i></i>'; body.appendChild(tmr);
        const qd = document.createElement('div'); qd.className = 'q'; body.appendChild(qd);
        const area = document.createElement('div'); body.appendChild(area);
        const tools = document.createElement('div'); tools.className = 'comodines'; body.appendChild(tools);
        const hintBox = document.createElement('div'); body.appendChild(hintBox);
        const cn = q.c, learned = m.apuntes[cn - 1];
        const showHint = (title, lines) => { hintBox.innerHTML = `<div class="hint"><b>${esc(title)}</b><br>${lines.map(esc).join('<br>')}</div>`; };
        const grade = (frac, extra) => {
          if (answered) return; answered = true; clearInterval(timer);
          let pts = frac >= 1 ? 1 : 0;
          if (frac < 1 && frac > 0) { const need = { Baja: 0.5, Media: 0.75, Alta: 2 }[exig]; if (frac >= need) pts = 0.5; }
          if (pts > 0 && pac === 'Baja' && tLeft < tMax * 0.25) pts = Math.min(pts, 0.5);
          total += pts; results.push({ q: q.q, pts });
          Audio8.sfx(pts >= 1 ? 'good' : pts > 0 ? 'select' : 'bad');
          const fb = document.createElement('div'); fb.className = 'hint';
          let txt = pts >= 1 ? '¡Correcto!' : pts > 0 ? 'Medio punto: casi.' : (tLeft <= 0 ? '¡Se terminó el tiempo!' : 'Incorrecto.');
          if (q.t === 'vf') txt += ' ' + q.x;
          else if (pts < 1 && (q.t === 'mc' || q.t === 'comp')) txt += ' Era: ' + q.o[0] + '.';
          if (pts < 1 && P.aliento) txt += ' — ' + P.aliento;
          if (extra) txt = extra + ' ' + txt;
          fb.textContent = txt; hintBox.innerHTML = ''; hintBox.appendChild(fb);
          tools.innerHTML = '';
          const b = document.createElement('button'); b.className = 'opt'; b.style.textAlign = 'center'; b.textContent = qi + 1 < qs.length ? 'Siguiente ▶' : 'Ver resultado ▶';
          b.onclick = () => { Audio8.sfx('select'); i++; next(); };
          tools.appendChild(b); UI.setScope(UI.el.panel); UI.focusIdx = UI.focusables().indexOf(b); UI.refreshFocus();
        };
        // ---- render por tipo ----
        const mkOpt = (txt, fn) => { const b = document.createElement('button'); b.className = 'opt'; b.textContent = txt; b.onclick = fn; return b; };
        if (q.t === 'mc' || q.t === 'comp') {
          qd.textContent = q.t === 'comp' ? 'Completá: ' + q.q : q.q;
          let list = q.o.slice(); if (P.prof === 'Básica' && list.length > 3) list = [list[0], list[1], list[2]];
          opts = shuffle(list.map(t => ({ t, ok: t === q.o[0] })));
          opts.forEach(op => { op.el = mkOpt(op.t, () => {
            if (answered) return;
            if (!op.ok && segunda > 0) { segunda--; op.el.classList.add('gone'); Audio8.sfx('bad'); showHint(P.nombre + ':', ['Mmm, no. Pensalo otra vez, te doy otra oportunidad.']); UI.refreshFocus(true); return; }
            op.el.classList.add(op.ok ? 'ok' : 'no'); opts.find(x => x.ok).el.classList.add('ok'); grade(op.ok ? 1 : 0);
          }); area.appendChild(op.el); });
        } else if (q.t === 'vf') {
          qd.textContent = 'Verdadero o falso: ' + q.q;
          opts = [{ t: 'Verdadero', ok: q.a === true }, { t: 'Falso', ok: q.a === false }];
          opts.forEach(op => { op.el = mkOpt(op.t, () => {
            if (answered) return;
            if (!op.ok && segunda > 0) { segunda--; op.el.classList.add('gone'); Audio8.sfx('bad'); showHint(P.nombre + ':', ['¿Seguro? Pensalo de nuevo.']); UI.refreshFocus(true); return; }
            op.el.classList.add(op.ok ? 'ok' : 'no'); grade(op.ok ? 1 : 0);
          }); area.appendChild(op.el); });
        } else if (q.t === 'emp') {
          qd.textContent = q.q + ' (tocá cada respuesta para cambiarla)';
          const rights = shuffle(q.p.map(p => p[1]));
          const cur = q.p.map((_, k) => k % rights.length);
          if (q.p.every((p, k) => rights[cur[k]] === p[1])) cur.push(cur.shift());
          const fixed = {};
          const rows = q.p.map((p, k) => {
            const row = document.createElement('div'); row.className = 'row';
            const lab = document.createElement('div'); lab.className = 'lab'; lab.textContent = p[0];
            const b = mkOpt('', () => { if (answered || fixed[k]) return; cur[k] = (cur[k] + 1) % rights.length; b.textContent = rights[cur[k]] + ' ⟳'; Audio8.sfx('blip'); });
            b.textContent = rights[cur[k]] + ' ⟳';
            row.appendChild(lab); row.appendChild(b); area.appendChild(row); return { b, k };
          });
          const conf = mkOpt('✔ Confirmar respuesta', () => {
            if (answered) return;
            let ok = 0; q.p.forEach((p, k) => { const good = rights[cur[k]] === p[1]; if (good) ok++; rows[k].b.classList.add(good ? 'ok' : 'no'); });
            grade(ok / q.p.length, ok < q.p.length ? 'Correctas: ' + q.p.map(p => p[0] + ' → ' + p[1]).join(' · ') + '.' : '');
          }); conf.style.textAlign = 'center'; area.appendChild(conf);
          opts = { fix: (n) => { let done = 0; q.p.forEach((p, k) => { if (done >= n || fixed[k]) return; cur[k] = rights.indexOf(p[1]); fixed[k] = true; rows[k].b.textContent = rights[cur[k]] + ' 🔒'; rows[k].b.classList.add('ok'); done++; }); } };
        } else if (q.t === 'ord') {
          qd.textContent = q.q + ' (usá ▲ ▼ para mover)';
          let order = shuffle(q.o.slice()); if (order.join() === q.o.join()) order.reverse();
          const locked = {};
          const drawOrd = () => {
            area.innerHTML = '';
            order.forEach((it, k) => {
              const row = document.createElement('div'); row.className = 'row';
              const lab = document.createElement('div'); lab.className = 'lab'; lab.textContent = (k + 1) + '. ' + it + (locked[it] ? ' 🔒' : '');
              const up = mkOpt('▲', () => { if (answered || k === 0 || locked[it] || locked[order[k - 1]]) return; [order[k - 1], order[k]] = [order[k], order[k - 1]]; Audio8.sfx('blip'); drawOrd(); UI.refreshFocus(); });
              const dn = mkOpt('▼', () => { if (answered || k === order.length - 1 || locked[it] || locked[order[k + 1]]) return; [order[k + 1], order[k]] = [order[k], order[k + 1]]; Audio8.sfx('blip'); drawOrd(); UI.refreshFocus(); });
              up.classList.add('mini'); dn.classList.add('mini');
              row.appendChild(lab); row.appendChild(up); row.appendChild(dn); area.appendChild(row);
            });
            const conf = mkOpt('✔ Confirmar orden', () => {
              if (answered) return;
              let ok = 0; order.forEach((it, k) => { if (q.o[k] === it) ok++; });
              grade(ok / q.o.length, ok < q.o.length ? 'Orden correcto: ' + q.o.join(' → ') + '.' : '');
            }); conf.style.textAlign = 'center'; area.appendChild(conf);
          };
          drawOrd();
          opts = { fix: (n) => { for (let k = 0; k < n; k++) { const it = q.o[k]; order = order.filter(x => x !== it); order.splice(k, 0, it); locked[it] = true; } drawOrd(); } };
        }
        // ---- herramientas: comodines, ayuda del profe, consultar ----
        const tool = (label, fn) => { const b = mkOpt(label, () => { if (answered) return; Audio8.sfx('select'); fn(b); }); tools.appendChild(b); return b; };
        if (com['5050'] && q.t !== 'vf') tool('50/50', (b) => {
          delete com['5050']; b.remove();
          if (Array.isArray(opts)) { const wrong = shuffle(opts.filter(x => !x.ok && !x.el.classList.contains('gone'))); wrong.slice(0, Math.ceil(wrong.length / 2)).forEach(x => x.el.classList.add('gone')); }
          else opts.fix(Math.ceil((q.p || q.o).length / 2));
          UI.refreshFocus(true);
        });
        if (com.pista) tool('Pista', (b) => {
          delete com.pista; b.remove();
          if (learned) showHint(`Tus apuntes — Clase ${cn}`, M.clases[cn - 1].ap); else showHint('Pista', [`No tenés apuntes de la clase ${cn}: faltaste.`]);
        });
        if (ayudaProf > 0 && q.t !== 'vf') tool('Pedir ayuda al profe', (b) => {
          ayudaProf--; b.remove();
          if (Array.isArray(opts)) { const w = opts.find(x => !x.ok && !x.el.classList.contains('gone')); if (w) w.el.classList.add('gone'); }
          else opts.fix(1);
          showHint(P.nombre + ':', [P.aliento || 'Te ayudo con una. El resto, pensalo vos.']); UI.refreshFocus(true);
        });
        if (catalogacion && S.inv.reglas) tool('Consultar reglas', (b) => {
          b.remove(); usedReglas = true; tLeft -= tMax * 0.25;
          showHint('Reglas de catalogación, CDD y CDU', M.clases[cn - 1].ap);
        });
        // ---- temporizador ----
        const bar = tmr.querySelector('i');
        timer = setInterval(() => {
          if (answered) return;
          tLeft -= 0.1;
          const f = Math.max(0, tLeft / tMax); bar.style.width = (f * 100) + '%'; bar.className = f < 0.25 ? 'crit' : f < 0.5 ? 'warn' : '';
          if (tLeft <= 0) {
            if (q.t === 'emp' || q.t === 'ord') { const c = [...area.querySelectorAll('.opt')].pop(); c.click(); }
            else { if (Array.isArray(opts)) { const g = opts.find(x => x.ok); if (g && g.el) g.el.classList.add('ok'); } grade(0); }
          }
        }, 100);
        UI.setScope(UI.el.panel);
      };
      next();
    });
  },
};

// ---------------- MENÚS ----------------
const Menus = {
  async main() {
    const r = await UI.choose(null, ['Libreta del estudiante', 'Horario', 'Objetos', 'Terminar jornada', 'Opciones', 'Cerrar'], { cancel: 5 });
    if (r === 0) this.libreta(0);
    if (r === 1) this.horario();
    if (r === 2) this.objetos();
    if (r === 3) Game.leaveHomeFromMenu();
    if (r === 4) this.opciones();
  },
  horario() {
    const rows = Object.keys(S.materias).sort((a, b) => HORARIO[a].dia - HORARIO[b].dia || turno(a)[0] - turno(b)[0]).map(c => {
      const h = HORARIO[c], [i, f] = turno(c), P = PROFES[h.prof];
      return `<tr><td><b>${DIAS[h.dia]}</b></td><td>${fmtT(i)}–${fmtT(f)}</td><td>${esc(MATERIAS[c].corto)}</td><td>Aula ${h.aula}</td><td>${esc(P.nombre)}</td></tr>`;
    }).join('');
    const wk = S.receso ? 'Receso' : `Semana ${S.week}: ${nombreSesion(sesionTipo(S.week))} de cada materia`;
    UI.openPanel({ title: 'Horario del cuatrimestre', html: `<p class="small">${wk}</p><table class="t"><tr><th>Día</th><th>Hora</th><th>Materia</th><th>Aula</th><th>Profesor/a</th></tr>${rows}</table>
      <p class="small muted">Cada semana hay una sesión por materia: clase 1, clase 2, primer parcial, clase 3, clase 4 y segundo parcial.</p>`,
      foot: [{ label: 'Cerrar', fn: () => UI.closePanel() }] });
  },
  objetos() {
    const items = ['<li><b>Libreta del estudiante</b> — tus apuntes, profesores y progreso.</li>'];
    if (S.inv.reglas) items.push('<li><b>Reglas de catalogación (AACR2), CDD y CDU</b> — habilitan «Consultar» en los parciales de Catalogación.</li>');
    UI.openPanel({ title: 'Objetos', html: `<ul>${items.join('')}</ul><p class="small muted">Estudio: ${fmtN(S.estudio)}/10 · Social: ${fmtN(S.social)}/10</p>`, foot: [{ label: 'Cerrar', fn: () => UI.closePanel() }] });
  },
  opciones() {
    const draw = () => UI.openPanel({ title: 'Opciones', html: `<p class="small">La partida se guarda sola en este navegador al cambiar de día, después de cada clase o examen y cada 30 segundos.</p>`,
      foot: [
        { label: 'Música: ' + (Audio8.opts.music ? 'sí' : 'no'), fn: () => { Audio8.setOpts({ music: !Audio8.opts.music }); S.sonido = { ...Audio8.opts }; draw(); } },
        { label: 'Efectos: ' + (Audio8.opts.sfx ? 'sí' : 'no'), fn: () => { Audio8.setOpts({ sfx: !Audio8.opts.sfx }); S.sonido = { ...Audio8.opts }; draw(); } },
        { label: 'Guardar ahora', fn: () => { UI.toast(Save.write() ? 'Partida guardada' : 'No se pudo guardar'); } },
        { label: 'Volver al título', fn: () => { Save.write(); UI.closePanel(); Game.title(); } },
        { label: 'Cerrar', fn: () => UI.closePanel() },
      ] });
    draw();
  },
  libreta(tab) {
    const tabs = ['Apuntes', 'Profesores', 'Progreso', 'Mecánicas', 'Situaciones'];
    const html = [this.libApuntes, this.libProfes, this.libProgreso, this.libMecanicas, this.libSituaciones][tab].call(this);
    UI.openPanel({ title: 'Libreta', tabs, activeTab: tab, onTab: (t) => this.libreta(t), html, foot: [{ label: 'Cerrar', fn: () => UI.closePanel() }] });
  },
  libApuntes() {
    return Object.keys(S.materias).map(code => {
      const M = MATERIAS[code], m = S.materias[code];
      const cls = M.clases.map((c, k) => {
        const idx = CONFIG.secuencia.indexOf('C' + (k + 1)), ses = m.ses[idx];
        if (m.apuntes[k]) return `<div><b>Clase ${k + 1}: ${esc(c.t)}</b><ul>${c.ap.map(a => `<li class="small">${esc(a)}</li>`).join('')}</ul></div>`;
        if (ses === 'A') return `<div class="small bad">Clase ${k + 1}: te la perdiste (faltaste).</div>`;
        return `<div class="small muted">Clase ${k + 1}: todavía no se dio.</div>`;
      }).join('');
      return `<div class="card"><h4>${esc(M.nombre)}</h4>${cls}</div>`;
    }).join('');
  },
  libProfes() {
    return Object.keys(S.profes).map(pid => {
      const P = PROFES[pid], st = S.profes[pid], d = st.desc;
      const v = (k, val) => d[k] ? `<b>${esc(val)}</b>` : '<span class="muted">???</span>';
      const dif = d.exig && d.pac && d.prof ? (() => { const x = dificultadProfe(P); return `<b>${x.n} · ${x.txt}</b>`; })() : '<span class="muted">???</span>';
      const mats = Object.keys(HORARIO).filter(c => HORARIO[c].prof === pid && S.materias[c]).map(c => `${MATERIAS[c].corto} (${DIAS[HORARIO[c].dia]}, aula ${HORARIO[c].aula})`).join(', ');
      return `<div class="card" style="display:flex;gap:6px"><canvas data-pid="${pid}" width="48" height="48" style="width:calc(var(--s)*28px);height:calc(var(--s)*28px);image-rendering:pixelated;flex:none"></canvas><div><h4>${esc(P.nombre)}</h4>
        <div class="small">${esc(mats)}</div>
        <div class="small">Ánimo: ${v('animo', P.animo)} · Paciencia: ${v('pac', P.pac)} · Exigencia: ${v('exig', P.exig)}</div>
        <div class="small">Profundidad: ${v('prof', P.prof)} · Asistencia: ${v('asist', P.asist)} · Dificultad: ${dif}</div>
        <div class="small">Vínculo: ${'♥'.repeat(Math.round(st.vinc / 2))}${'♡'.repeat(5 - Math.round(st.vinc / 2))}</div></div></div>`;
    }).join('') + '<p class="small muted">Los datos se descubren yendo a clase, rindiendo o charlando.</p>';
  },
  libProgreso() {
    const rows = Object.keys(S.materias).map(c => {
      const m = S.materias[c];
      const asis = m.ses.map((x, k) => esExamen(CONFIG.secuencia[k]) ? (x === null ? '·' : x === 'A' ? '✘' : fmtN(x)) : (x === null ? '·' : x === 'A' ? '✘' : x === 'T' ? 't' : '✔')).join(' ');
      const est = { cursando: 'Cursando', final: 'Debe final', recursa: 'Recursa', aprobada: 'Aprobada' }[m.estado];
      return `<tr><td>${esc(MATERIAS[c].corto)}${esPromocionable(c) ? '' : ' <span class="tag">final oblig.</span>'}</td><td class="small">${asis}</td><td>${m.faltas}/${CONFIG.faltasMax}</td><td>${est}</td></tr>`;
    }).join('');
    return `<p>Promedio: <b>${fmtN(promedio())}</b> · Niveles aprobados: <b>${Object.keys(S.aprobadas).length}/28</b> · Cuatrimestre ${S.cuatri}</p>
      <table class="t"><tr><th>Materia</th><th>C1 C2 P1 C3 C4 P2</th><th>Faltas</th><th>Estado</th></tr>${rows}</table>
      <p class="small muted">✔ presente · t tarde · ✘ ausente · número = nota del parcial (sobre 5)</p>
      <p class="small">Estudio ${fmtN(S.estudio)}/10 · Social ${fmtN(S.social)}/10 · Clases ${S.stats.classes} · Exámenes ${S.stats.exams} · Tiempo de juego ${Math.round(S.stats.playMs / 60000)} min</p>`;
  },
  libMecanicas() {
    return `<div class="card"><h4>Cursada</h4><ul class="small">
      <li>Cada materia tiene 6 sesiones, una por semana: clase 1, clase 2, primer parcial, clase 3, clase 4 y segundo parcial.</li>
      <li>Para cursar, sentate en el aula a horario. Tenés ${CONFIG.toleranciaClase} min de tolerancia en clases y ${CONFIG.toleranciaExamen} en parciales (el tiempo que llegás tarde se descuenta del examen).</li>
      <li>Podés faltar ${CONFIG.faltasMax} clases por materia. Con más, recursás. Algunos profes no ponen falta, pero igual te perdés los apuntes.</li>
      <li>Faltar a un parcial = recursar la materia.</li></ul></div>
      <div class="card"><h4>Notas</h4><ul class="small">
      <li>Cada examen tiene 5 consignas: 1 punto por respuesta correcta.</li>
      <li>Materias promocionables: con 7 o más entre los dos parciales, promocionás; de 4 a 6, vas a final; con 3 o menos, recursás.</li>
      <li>Catalogación, Fuentes y Biblioteconomía son de final obligatorio: necesitás al menos 2 en cada parcial para ir a final.</li>
      <li>Según el profe: exigencia baja o media acepta medio punto en emparejar u ordenar; con paciencia baja, si contestás sobre la hora, la correcta vale medio punto.</li></ul></div>
      <div class="card"><h4>Estudio y comodines</h4><ul class="small">
      <li>El estudio sube yendo a clase, contestando bien al profe y estudiando en la biblioteca (una vez por día).</li>
      <li>10 barritas: 3 comodines · 8 o 9: 2 · 6 o 7: 1 · menos de 6: ninguno. Se eligen antes de empezar el examen.</li>
      <li>Para los parciales de Catalogación, buscá en la biblioteca las reglas, la CDD y la CDU: habilitan «Consultar».</li></ul></div>
      <div class="card"><h4>Reloj</h4><ul class="small"><li>Cada paso, escalera y charla consume tiempo de juego. A las 21:30 termina la jornada. El cambio de día es manual: MENÚ → Terminar jornada.</li></ul></div>`;
  },
  libSituaciones() { return S.log.length ? '<ul class="small">' + S.log.map(l => `<li>${esc(l)}</li>`).join('') + '</ul>' : '<p class="small muted">Todavía no pasó nada.</p>'; },
};
// dibujar retratos en la pestaña de profesores
new MutationObserver(() => { document.querySelectorAll('canvas[data-pid]').forEach(c => { if (c.dataset.done) return; c.dataset.done = 1; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(profPortrait(c.dataset.pid), 0, 0); }); }).observe(document.body, { childList: true, subtree: true });

Game.leaveHomeFromMenu = async function () {
  const pend = sesionesHoy().filter(s => S.time < s.ini + (esExamen(s.tipo) ? CONFIG.toleranciaExamen : CONFIG.toleranciaClase));
  let msg = '¿Terminar la jornada y pasar al día siguiente?';
  if (pend.length) msg = `Todavía tenés ${pend.map(s => nombreSesion(s.tipo).toLowerCase() + ' de ' + MATERIAS[s.code].corto).join(' y ')}. Si terminás la jornada, faltás. ¿Seguro?`;
  const r = await UI.choose(msg, ['No', 'Sí, terminar jornada'], { cancel: 0 });
  if (r === 1) Game.endDay();
};

// ---------------- ESCALA DE PANTALLA ----------------
function fitScreen() {
  const touch = matchMedia('(hover: none), (pointer: coarse)').matches;
  const padH = touch ? 170 : 30;
  const w = window.innerWidth - 16, h = window.innerHeight - padH;
  let s = Math.min(w / 240, h / 160);
  if (s >= 2) s = Math.floor(s * 2) / 2;
  s = Math.max(1, s);
  document.documentElement.style.setProperty('--s', s);
}

window.addEventListener('load', () => Game.init());
