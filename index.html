ia bibliográfica del micromundo","Primaria","Secundaria no bibliográfica","Terciaria"],"c":4},{"d":2,"t":"vf","q":"Las fuentes secundarias bibliográficas obligan a un segundo paso: localizar el documento al que remiten.","a":true,"x":"Verdadero. Dan referencias; después hay que localizar el documento (quizás con otra fuente que diga dónde está) y consultarlo.","c":1},{"d":2,"t":"mc","q":"¿Por qué la cátedra usa \"recurso\" como sinónimo de fuente?","o":["Porque es un elemento disponible para resolver una necesidad de información, y la información puede verse como un bien","Porque es más corto","Porque así lo dice la ISBD","Porque solo se refiere a lo digital"],"c":1},{"d":3,"t":"mc","q":"¿Por qué los fascículos no son publicaciones en serie, si también salen en partes sucesivas?","o":["Porque se planean como una obra que termina y, completa, forma un libro; la publicación en serie se piensa continuar indefinidamente","Porque no tienen tapa","Porque son más baratos","Porque no tienen numeración"],"c":3}],"repaso":["Según Romanos de Tiratel, la información es... → Un conjunto de símbolos con capacidad de significar, registrado en distintos soportes y con el potencial de recuperarse.","¿Cuál de estas es una fuente terciaria? → Una guía de obras de referencia.","Es secundaria no bibliográfica: da el dato (conceptos, hechos, personas) sin necesidad de ir a otra fuente.","(Complemento) ¿Cuál de estas NO es una función de la revista científica? → Vender partes de un libro por separado.","(Complemento) ¿Cuántos dígitos tiene el ISSN? → 8, con el último de control.","El ISSN identifica el título de una publicación en serie (no cada número). El ISBN identifica una monografía (un libro, una edición).","Una revista tiene un ISSN para su versión impresa y otro para la versión en la web. ¿Cómo se llama el segundo? → eISSN.","Cada ejemplo con su categoría: «Una revista de moda» → publicación periódica popular.","Cada ejemplo con su categoría: «Un anuario de investigaciones en CD con ISSN» → publicación en serie electrónica.","Cada ejemplo con su categoría: «Una obra de cocina vendida por entregas» → fascículos (no es publicación en serie).","(Complemento) ¿Qué tipo de fuente es una base de datos bibliográfica, según el cuadro? → Secundaria bibliográfica del micromundo.","Las fuentes secundarias bibliográficas obligan a un segundo paso: localizar el documento al que remiten. Dan referencias; después hay que localizar el documento (quizás con otra fuente que diga dónde está) y consultarlo.","¿Por qué la cátedra usa \"recurso\" como sinónimo de fuente? → Porque es un elemento disponible para resolver una necesidad de información, y la información puede verse como un bien.","¿Por qué los fascículos no son publicaciones en serie, si también salen en partes sucesivas? → Porque se planean como una obra que termina y, completa, forma un libro; la publicación en serie se piensa continuar indefinidamente."],"nombre":"Fuentes y Servicios de Información III","corto":"Fuentes III"},"TAI1":{"clases":[{"t":"Fundamentos de la informática","ap":["¿De qué palabras viene \"informática\"? → Información y automática.","Cada tipo de dato con su ejemplo: «Numérico» → 21.419.","Cada tipo de dato con su ejemplo: «Alfabético» → Barcelona.","Cada tipo de dato con su ejemplo: «Alfanumérico» → Junín 726, #2.","Esa diferencia existe solo para las personas; para la computadora todo son elementos de entrada y de salida.","Ordená las 3 actividades del procesamiento de datos: captura de los datos de entrada → manipulación de los datos → manejo de los resultados de salida.","Cada programa con su tipo de software: «Windows o Linux» → software del sistema (sistema operativo).","Cada programa con su tipo de software: «Un procesador de texto» → software de aplicación.","Cada programa con su tipo de software: «Un controlador de impresora» → software del sistema.","Cada programa con su tipo de software: «Koha» → software de aplicación.","¿Por qué conviene automatizar el control de autoridades? → Porque es repetitiva y la computadora da más seguridad que el hombre, que se equivoca más.","Según la RAE, la informática hace posible el tratamiento de la información... → Automático y racional, por medio de computadoras.","¿Qué es un bit? → Un dígito binario: 1 o 0.","Cada razón para automatizar con su ejemplo: «Hacer lo que el hombre no puede hacer solo» → comunicaciones a larga distancia.","Cada razón para automatizar con su ejemplo: «Hacer más rápido lo que tardaría mucho» → un catálogo colectivo de varias bibliotecas.","Cada razón para automatizar con su ejemplo: «Ganar seguridad en tareas repetitivas» → el control de autoridades.","Cada razón para automatizar con su ejemplo: «Reemplazar al hombre en tareas monótonas» → liberarlo para tareas intelectuales.","¿Qué hace el sistema operativo? → Administra la computadora: asigna y planifica la memoria, los dispositivos y la CPU."]},{"t":"Bases de datos y sistemas gestores","ap":["En una base de datos de una biblioteca, emparejá cada término con su ejemplo: «Entidad» → los libros o los usuarios.","En una base de datos de una biblioteca, emparejá cada término con su ejemplo: «Atributo» → el título o el ISBN de un libro.","En una base de datos de una biblioteca, emparejá cada término con su ejemplo: «Registro» → todos los datos de un libro determinado.","En una base de datos de una biblioteca, emparejá cada término con su ejemplo: «Relación» → el préstamo de un libro a un usuario.","¿Qué diferencia hay entre una base de datos y un SGBD? → La base de datos son los datos almacenados; el SGBD es el programa que los gestiona y los mantiene consistentes.","¿Qué es la clave primaria de una tabla? → El atributo que identifica de forma única cada fila y no se repite.","Cada modelo de base de datos con su rasgo: «Relacional» → los datos se organizan en tablas relacionadas.","Cada modelo de base de datos con su rasgo: «En red» → un nodo puede tener varios padres.","Cada modelo de base de datos con su rasgo: «Jerárquico» → un árbol: cada hijo tiene un solo padre.","Cada modelo de base de datos con su rasgo: «Orientado a objetos» → cada entidad es un objeto con estado y comportamiento.","¿Cuál es una de las 6 características de una base de datos? → No redundancia: no guardar dos veces el mismo dato.","Cada tipo de relación con su ejemplo: «1» → persona-DNI.","Cada tipo de relación con su ejemplo: «N» → un profesor, muchas asignaturas.","Cada tipo de relación con su ejemplo: «M» → alumnos y profesores.","La tupla (o registro) es una fila; la columna es el atributo o campo."]},{"t":"Bases de datos documentales","ap":["El catálogo de una biblioteca, que da los datos de la obra y su ubicación pero no el texto, es una base de datos... → Referencial.","Cada base de datos con su tipo según el tratamiento documental: «Contenidos Corrientes del SISBI-UBA» → base de sumarios, sin análisis de contenido.","Cada base de datos con su tipo según el tratamiento documental: «Catálogo de la Biblioteca Nacional Mariano Moreno» → catálogo de biblioteca.","Cada base de datos con su tipo según el tratamiento documental: «SAIJ» → base con análisis documental más completo.","Cada base de datos con su tipo según el tratamiento documental: «Una base que registra quién cita a quién» → índice de citas.","Un catálogo colectivo con bases de varias bibliotecas conectadas entre sí es una base de datos... → Distribuida.","Cada base con su modelo según el contenido: «Una base de estadísticas de lectura» → factual.","Cada base con su modelo según el contenido: «Una guía de bibliotecas del país» → directorio.","Cada base con su modelo según el contenido: «Un catálogo de libros» → documental.","Según Rodríguez Yunta, TESEO (tesis doctorales españolas) es una base de cobertura documental... → De un solo tipo de documento.","¿Qué es un índice de citas? → Una base que registra las referencias citadas y sirve para estudios bibliométricos.","Las tres primeras (productor, modo de acceso, cobertura temática) sirven para cualquier base; las dos últimas (cobertura documental y tratamiento documental) son propias de las documentales."]},{"t":"SIGB, software libre y proyecto de implementación","ap":["¿Qué módulo de un SIGB es el esencial y el más complejo? → Catalogación.","Cada tarea con su módulo del SIGB: «Registrar una desiderata y reclamar un pedido» → adquisiciones.","Cada tarea con su módulo del SIGB: «Prestar y devolver un libro» → circulación.","Cada tarea con su módulo del SIGB: «Controlar la llegada de los números de una revista» → publicaciones periódicas.","Cada tarea con su módulo del SIGB: «Buscar un libro desde casa» → OPAC.","Ordená las generaciones de SIGB según su rasgo: módulos poco integrados e interfaz por comandos → sistemas en Unix y DOS con exportación de datos → integración de módulos e interfaces gráficas → bases relacionales, multiplataforma y cliente-servidor con internet.","\"Libre\" se refiere a la libertad de usar, estudiar, modificar y distribuir el software, con acceso al código fuente; puede incluso venderse. Aguapey es gratuito pero no libre; Koha es libre.","¿Qué significa SIGB? → Sistema Integrado de Gestión Bibliotecaria.","¿Qué ventaja tiene que los módulos de un SIGB compartan la misma base de datos? → Que se evita la redundancia y todos los módulos se afectan entre sí.","Cada SIGB con su dato: «Koha» → libre; en maorí significa \"obsequio o donación\".","Cada SIGB con su dato: «Aguapey» → gratuito pero no libre; para bibliotecas escolares.","Cada SIGB con su dato: «ABCD» → libre, basado en ISIS, apoyado por la UNESCO.","Cada SIGB con su dato: «Pérgamo» → propietario; lo usan universidades argentinas.","¿Qué tienen en común los SIGB actuales? → Arquitectura cliente-servidor, compatibilidad con MARC 21 y Z39.50, y apertura a internet.","Cada libertad del software libre con su contenido: «Libertad 0» → usar el programa con cualquier propósito.","Cada libertad del software libre con su contenido: «Libertad 1» → estudiar cómo funciona y adaptarlo.","Cada libertad del software libre con su contenido: «Libertad 2» → distribuir copias.","Cada libertad del software libre con su contenido: «Libertad 3» → mejorarlo y distribuir las versiones modificadas.","¿Qué libertades requieren acceso al código fuente? → La 1 y la 3.","En la práctica se usan como sinónimos (comparten licencias como la GPL), pero la FSF insiste en que son conceptos distintos: el libre pone el acento en la libertad del usuario; el código abierto, en los criterios técnicos de la OSI.","En el proyecto de implementación de un SIGB, ¿qué diferencia a los objetivos de las metas? → Los objetivos son de corto plazo, cuantificables y medibles; las metas, de mediano o largo plazo."]}],"p1":[{"d":1,"t":"mc","q":"¿De qué palabras viene \"informática\"?","o":["Información y automática","Información y matemática","Informe y técnica","Información y práctica"],"c":1},{"d":1,"t":"mc","q":"Cada tipo de dato con su ejemplo: «Numérico»","o":["21.419","Barcelona","Junín 726, #2"],"c":1},{"d":1,"t":"mc","q":"Cada tipo de dato con su ejemplo: «Alfabético»","o":["Barcelona","Junín 726, #2","21.419"],"c":1},{"d":1,"t":"mc","q":"Cada tipo de dato con su ejemplo: «Alfanumérico»","o":["Junín 726, #2","21.419","Barcelona"],"c":1},{"d":2,"t":"vf","q":"Para la computadora, la diferencia entre datos e información es fundamental.","a":false,"x":"Falso. Esa diferencia existe solo para las personas; para la computadora todo son elementos de entrada y de salida.","c":1},{"d":1,"t":"ord","q":"Ordená las 3 actividades del procesamiento de datos.","o":["captura de los datos de entrada","manipulación de los datos","manejo de los resultados de salida"],"c":1},{"d":1,"t":"mc","q":"Cada programa con su tipo de software: «Windows o Linux»","o":["software del sistema (sistema operativo)","software de aplicación"],"c":1},{"d":1,"t":"mc","q":"Cada programa con su tipo de software: «Un procesador de texto»","o":["software de aplicación","software del sistema (sistema operativo)","software d mático General de Bibliotecas","Servicio Interno de Gestión de Bases","Sistema Internacional de Gestión Bibliográfica"],"c":4},{"d":2,"t":"mc","q":"¿Qué ventaja tiene que los módulos de un SIGB compartan la misma base de datos?","o":["Que se evita la redundancia y todos los módulos se afectan entre sí","Que cada módulo tiene sus propios datos","Que el sistema es más lento","Que no hace falta catalogar"],"c":4},{"d":2,"t":"mc","q":"Cada SIGB con su dato: «Koha»","o":["libre; en maorí significa \"obsequio o donación\"","libre, basado en ISIS, apoyado por la UNESCO","propietario; lo usan universidades argentinas","gratuito pero no libre; para bibliotecas escolares"],"c":4},{"d":2,"t":"mc","q":"Cada SIGB con su dato: «Aguapey»","o":["gratuito pero no libre; para bibliotecas escolares","propietario; lo usan universidades argentinas","libre; en maorí significa \"obsequio o donación\"","libre, basado en ISIS, apoyado por la UNESCO"],"c":4},{"d":2,"t":"mc","q":"Cada SIGB con su dato: «ABCD»","o":["libre, basado en ISIS, apoyado por la UNESCO","gratuito pero no libre; para bibliotecas escolares","libre; en maorí significa \"obsequio o donación\"","propietario; lo usan universidades argentinas"],"c":4},{"d":2,"t":"mc","q":"Cada SIGB con su dato: «Pérgamo»","o":["propietario; lo usan universidades argentinas","gratuito pero no libre; para bibliotecas escolares","libre, basado en ISIS, apoyado por la UNESCO","libre; en maorí significa \"obsequio o donación\""],"c":4},{"d":2,"t":"mc","q":"¿Qué tienen en común los SIGB actuales?","o":["Arquitectura cliente-servidor, compatibilidad con MARC 21 y Z39.50, y apertura a internet","Interfaz por comandos","Hardware específico de un solo fabricante","Módulos poco integrados"],"c":4},{"d":2,"t":"mc","q":"Cada libertad del software libre con su contenido: «Libertad 0»","o":["usar el programa con cualquier propósito","distribuir copias","estudiar cómo funciona y adaptarlo","mejorarlo y distribuir las versiones modificadas"],"c":4},{"d":2,"t :2},{"d":2,"t":"vf","q":"El dominio de un atributo es el conjunto de valores posibles que puede tomar.","a":true,"x":"Verdadero. Por ejemplo, el tipo de usuario puede ser estudiante, profesor o investigador.","c":2},{"d":2,"t":"mc","q":"En Koha, ¿qué es la \"intranet\"?","o":["La interfaz de gestión para el bibliotecario","La red wifi de la biblioteca","El OPAC","El servidor de correo"],"c":4},{"d":3,"t":"mc","q":"Cada rasgo con el tipo de software: «El usuario no depende de una sola empresa»","o":["libre","gratuito","código abierto","propietario"],"c":4},{"d":3,"t":"mc","q":"Cada rasgo con el tipo de software: «La licencia prohíbe descompilar y redistribuir»","o":["propietario","gratuito","libre","código abierto"],"c":4},{"d":3,"t":"mc","q":"Cada rasgo con el tipo de software: «Se distribuye sin costo pero sin código fuente»","o":["gratuito","propietario","libre","código abierto"],"c":4},{"d":3,"t":"mc","q":"Cada rasgo con el tipo de software: «Debe cumplir los 10 criterios de la OSI»","o":["código abierto","libre","propietario","gratuito"],"c":4}],"repaso":["¿Cuál de estos NO es uno de los 4 componentes de un sistema de bases de datos? → La impresora láser.","Una base para un museo con imágenes, audio y video, donde cada objeto tiene estado, comportamiento y un OID, usa el modelo... → Orientado a objetos.","El dominio de un atributo es el conjunto de valores posibles que puede tomar. Por ejemplo, el tipo de usuario puede ser estudiante, profesor o investigador.","En Koha, ¿qué es la \"intranet\"? → La interfaz de gestión para el bibliotecario.","Cada rasgo con el tipo de software: «El usuario no depende de una sola empresa» → libre.","Cada rasgo con el tipo de software: «La licencia prohíbe descompilar y redistribuir» → propietario.","Cada rasgo con el tipo de software: «Se distribuye sin costo pero sin código fuente» → gratuito.","Cada rasgo con el tipo de software: «Debe cumplir los 10 criterios de la OSI» → código abierto."],"nombre":"Tratamiento Automático de la Información I","corto":"TAI I"},"TAI2":{"clases":[{"t":"Bases de datos: ventajas, usuarios e historia","ap":["En un archivo secuencial, ¿qué hay que hacer para leer el registro 20? → Leer antes los 19 registros anteriores.","Cada tipo de usuario (Ricardo) con su forma de acceso: «Usuario casual» → usa el lenguaje de consulta interactivo.","Cada tipo de usuario (Ricardo) con su forma de acceso: «Usuario aficionado» → usa programas de aplicación y menús.","Cada tipo de usuario (Ricardo) con su forma de acceso: «Usuario secundario» → recibe la salida sin interactuar con la base.","Cada tipo de usuario (Ricardo) con su forma de acceso: «ABD» → crea y modifica la estructura de la base.","Enumera 7 desventajas: el costo del SGBD, del hardware, de la programación y de la conversión; el procesamiento más lento; la mayor vulnerabilidad (todo está en un lugar) y la recuperación más difícil.","¿Qué nivel de abstracción muestra solo una parte de la base y además sirve como mecanismo de seguridad? → De vistas.","El modelo en red, que el grupo CODASYL DBTG intentó estandarizar sin que ANSI lo aceptara, nació con... → El IDS de Bachman en General Electric.","¿Cómo se llama a los datos que están \"en reposo\", guardados en archivos o bases? → Persistencia de datos.","Cada organización de archivos con su rasgo: «Secuencial» → se lee de a un registro, uno detrás del otro.","Cada organización de archivos con su rasgo: «Indexado» → un índice permite ir directo, como en un libro.","Cada organización de archivos con su rasgo: «Relativo o directo» → una fórmula calcula la posición física a partir del contenido.","¿Qué es una transacción? → Una unidad de trabajo formada por tareas que se hacen completas o no se hacen.","¿Cuál de estas es una ventaja de la base integrada según Ricardo? → Control de la concurrencia: varios usuarios a la vez sin pisarse.","Lo que cambia es el ejemplar (la información que hay en un momento). El esquema es el diseño de la base y casi nunca cambia.","¿En qué se inspiró Hollerith para sus tarjetas perforadas del censo de 1890? → En las tarjetas del telar de Jacquard.","Cada creador con su aporte: «E. F. Codd» → el modelo relacional (1970).","Cada creador con su aporte: «Peter Chen» → el modelo entidad-relación (1976).","Cada creador con su aporte: «Charles Bachman» → el IDS, modelo en red.","Cada creador con su aporte: «IBM» → el IMS, modelo jerárquico, para el programa Apolo."]},{"t":"El modelo entidad-relación","ap":["Cada elemento del diagrama entidad-relación con su símbolo: «Entidad» → rectángulo.","Cada elemento del diagrama entidad-relación con su símbolo: «Entidad débil» → rectángulo de línea doble.","Cada elemento del diagrama entidad-relación con su símbolo: «Relación» → rombo.","Cada elemento del diagrama entidad-relación con su símbolo: «Propiedad multivaluada» → óvalo de borde doble.","Cada elemento del diagrama entidad-relación con su símbolo: «Propiedad clave» → nombre subrayado.","Rozic aclara que, una vez definida la jerarquía, no hay forma de saberlo.","Cada tipo de propiedad con su ejemplo: «Compuesta» → \"nombre\" (nombre y apellido).","Cada tipo de propiedad con su ejemplo: «Multivaluada» → \"profesión\" (puede tener varias).","Cada tipo de propiedad con su ejemplo: «Nula» → la materia de un docente de licencia.","Cada tipo de propiedad con su ejemplo: «Derivada» → la cantidad de materias, que sale de contarlas.","¿Qué es el grado de una relación? → La cantidad de entidades que participan.","Se agregaron después. El subtipo hereda las propiedades y relaciones del supertipo, pero no al revés."]},{"t":"La recuperación de la información","ap":["¿Quién introdujo en 1950 el término Information Retrieval? → Calvin N. Mooers.","Según la tabla de van Rijsbergen, emparejá cada rasgo con el tipo de recuperación: «Equiparación exacta, modelo determinista» → recuperación de datos (SGBD).","Según la tabla de van Rijsbergen, emparejá cada rasgo con el tipo de recuperación: «Equiparación parcial (best match), modelo probabilístico» → recuperación de información (SRI).","Según la tabla de van Rijsbergen, emparejá cada rasgo con el tipo de recuperación: «Lenguaje natural, especificación incompleta» → recuperación de información.","¿Cuál es el objetivo de la recuperación de la información en el que coinciden todos los autores? → Dar información relevante al usuario para satisfacer su necesidad de información.","Según Belkin, ¿qué es el ASK? → El estado anómalo del conocimiento: el vacío que la búsqueda tiene que llenar.","Cada autor con su idea sobre la recuperación: «Meadow» → es un proceso de comunicación.","Cada autor con su idea sobre la recuperación: «Korfhage» → almacenamiento y recuperación son dos caras de la misma moneda.","Cada autor con su idea sobre la recuperación: «Van Rijsbergen» → recuperar los documentos probablemente relevantes.","Cada autor con su idea sobre la recuperación: «Lancaster» → un SRI no recupera información, recupera documentos.","Son las dos actividades centrales de la recuperación (la entrada y la salida), pero son asincrónicas: el productor indiza antes y el usuario busca después."]},{"t":"Preservación digital y digitalización","ap":["Sirvió para el papel (fotos en un baúl), pero en lo digital el olvido es un peligro: los soportes duran poco y la tecnología queda obsoleta (la tesina de WordStar en un disquete de 5¼).","De las 9 preguntas del Handbook de la British Library (Jones y Beagrie), ¿cuál es uno de los criterios nuevos propios de lo digital? → Si el formato es legible hoy y lo será en el futuro.","Para digitalizar fondos patrimoniales, ¿qué enfoque de OCR recomiendan las Recomendaciones BNE? → Conservar la imagen con el texto asociado y la posición de cada palabra.","Cada formato de metadatos con su función: «METS» → empaqueta los metadatos y la estructura del objeto digital.","Cada formato de metadatos con su función: «PREMIS» → metadatos de preservación.","Cada formato de metadatos con su función: «MIX» → metadatos técnicos de imágenes.","Cada formato de metadatos con su función: «ALTO» → el texto del OCR con sus posiciones.","Cada formato de metadatos con su función: «EXIF, IPTC o XMP» → metadatos incrustados en la cabecera del archivo.","¿Qué significa \"preservación mediante la alteración\"? → Que el documento digital tiene que transformarse continuamente (migrar, convertir) para seguir accesible.","Según Anne Kenney, ¿cuál es hoy el gran obstáculo de la preservación digital? → La organización.","¿Qué formato guarda el texto del OCR con la posición de cada palabra y se combina con METS? → ALTO.","Las Recomendaciones no lo aconsejan en documentos textuales, salvo para mejorar la legibilidad (por ejemplo, la tinta traspasada).","¿Qué campo MARC 21 lleva la nota de reproducción de un documento digitalizado? → 533."]}],"p1":[{"d":1,"t":"mc","q":"En un archivo secuencial, ¿qué hay que hacer para leer el registro 20?","o":["Leer antes los 19 registros anteriores","Ir directo con el índice","Calcular su posición con una fórmula","Consultar la vista del usuario"],"c":1},{"d":2,"t":"mc","q":"Cada tipo de usuario (Ricardo) con su forma de acceso: «Usuario casual»","o":["usa el lenguaje de consulta interactivo","crea y modifica la estructura de la base","recibe la salida sin interactuar con la base","usa programas de aplicación y menús"],"c":1},{"d":2,"t":"mc","q":"Cada tipo de usuario (Ricardo) con su forma de acceso: «Usuario aficionado»","o":["usa programas de aplicación y menús","recibe la salida sin interactuar con la base","usa el lenguaje de consulta interactivo","crea y modifica la estructura de la base"],"c":1},{"d":2,"t":"mc","q":"Cada tipo de usuario (Ricardo) con su forma de acceso: «Usuario secundario»","o":["recibe la salida sin interactuar con la base","usa programas de aplicación y menús","usa el lenguaje de consulta interactivo","crea y modifica la estructura de la base"],"c":1},{"d":2,"t":"mc","q":"Cada tipo de usuario (Ricardo) con su forma de acceso: «ABD»","o":["crea y modifica la es "el IMS, modelo jerárquico, para el programa Apolo","el IDS, modelo en red","el modelo entidad-relación (1976)"],"c":1},{"d":2,"t":"mc","q":"Cada creador con su aporte: «Peter Chen»","o":["el modelo entidad-relación (1976)","el modelo relacional (1970)","el IDS, modelo en red","el IMS, modelo jerárquico, para el programa Apolo"],"c":1},{"d":2,"t":"mc","q":"Cada creador con su aporte: «Charles Bachman»","o":["el IDS, modelo en red","el IMS, modelo jerárquico, para el programa Apolo","el modelo entidad-relación (1976)","el modelo relacional (1970)"],"c":1},{"d":2,"t":"mc","q":"Cada creador con su aporte: «IBM»","o":["el IMS, modelo jerárquico, para el programa Apolo","el modelo entidad-relación (1976)","el IDS, modelo en red","el modelo relacional (1970)"],"c":1},{"d":2,"t":"mc","q":"Cada tipo de propiedad con su ejemplo: «Compuesta»","o":["\"nombre\" (nombre y apellido)","la cantidad de materias, que sale de contarlas","la materia de un docente de licencia","\"profesión\" (puede tener varias)"],"c":2},{"d":2,"t":"mc","q":"Cada tipo de propiedad con su ejemplo: «Multivaluada»","o":["\"profesión\" (puede tener varias)","\"nombre\" (nombre y apellido)","la cantidad de materias, que sale de contarlas","la materia de un docente de licencia"],"c":2},{"d":2,"t":"mc","q":"Cada tipo de propiedad con su ejemplo: «Nula»","o":["la materia de un docente de licencia","\"nombre\" (nombre y apellido)","la cantidad de materias, que sale de contarlas","\"profesión\" (puede tener varias)"],"c":2},{"d":2,"t":"mc","q":"Cada tipo de propiedad con su ejemplo: «Derivada»","o":["la cantidad de materias, que sale de contarlas","la materia de un docente de licencia","\"nombre\" (nombre y apellido)","\"profesión\" (puede tener varias)"],"c":2},{"d":2,"t":"mc","q":"¿Qué es el grado de una relación?","o":["La cantidad de entidades que participan","Su importancia","Su cardinalidad","El número de propiedades"],"c":2},{"d":2,"t":"vf","q":"Los subtipos (como Profesor, subtipo de Empleado) estaban en staurar siempre los documentos textuales.","a":false,"x":"Falso. Las Recomendaciones no lo aconsejan en documentos textuales, salvo para mejorar la legibilidad (por ejemplo, la tinta traspasada).","c":4},{"d":2,"t":"mc","q":"¿Qué campo MARC 21 lleva la nota de reproducción de un documento digitalizado?","o":["533","245","008","100"],"c":4}],"fin":[{"d":2,"t":"mc","q":"Cada nivel de abstracción con quién lo usa o qué muestra: «Físico»","o":["cómo se almacenan realmente los datos","una parte de la base para cada usuario; también da seguridad","qué datos hay y cómo se relacionan; lo usan administradores y programadores"],"c":1},{"d":2,"t":"mc","q":"Cada nivel de abstracción con quién lo usa o qué muestra: «Lógico»","o":["qué datos hay y cómo se relacionan; lo usan administradores y programadores","una parte de la base para cada usuario; también da seguridad","cómo se almacenan realmente los datos"],"c":1},{"d":2,"t":"mc","q":"Cada nivel de abstracción con quién lo usa o qué muestra: «De vistas»","o":["una parte de la base para cada usuario; también da seguridad","qué datos hay y cómo se relacionan; lo usan administradores y programadores","cómo se almacenan realmente los datos"],"c":1},{"d":2,"t":"mc","q":"¿De qué prototipo de IBM salió el lenguaje SQL?","o":["System R","IMS","IDS","UNIVAC"],"c":1},{"d":2,"t":"mc","q":"En la jerarquía empleado → profesor → jefe de cátedra, de lo general a lo particular, ¿qué tipo de jerarquía es?","o":["De especialización","De generalización","De agregación","Ninguna"],"c":2},{"d":2,"t":"mc","q":"¿Qué es la realimentación por relevancia (feedback)?","o":["Reformular la búsqueda a partir de lo que se recuperó","Que el usuario califique al bibliotecario","Borrar los resultados","Indizar de nuevo la base"],"c":3},{"d":2,"t":"mc","q":"Para la preservación digital, ¿qué significa \"largo plazo\"?","o":["Más de 20 años","Un año","Un siglo","Hasta que cambie el director"],"c":4},{"d":2,"t":"mc","q":"Cada principio de \"cuándo actuar\" con su explicación: «Proactiva, no reactiva»","o":["cuando se ve el daño digital suele ser tarde","lo ideal es asesorar a los autores al crear el documento","los metadatos se actualizan con cada transformación","el abandono benigno es un peligro en lo digital"],"c":4},{"d":2,"t":"mc","q":"Cada principio de \"cuándo actuar\" con su explicación: «Continuada, no esporádica»","o":["los metadatos se actualizan con cada transformación","el abandono benigno es un peligro en lo digital","lo ideal es asesorar a los autores al crear el documento","cuando se ve el daño digital suele ser tarde"],"c":4},{"d":2,"t":"mc","q":"Cada principio de \"cuándo actuar\" con su explicación: «Actuar, no omitir»","o":["el abandono benigno es un peligro en lo digital","los metadatos se actualizan con cada transformación","lo ideal es asesorar a los autores al crear el documento","cuando se ve el daño digital suele ser tarde"],"c":4},{"d":2,"t":"mc","q":"Cada principio de \"cuándo actuar\" con su explicación: «Desde la creación»","o":["lo ideal es asesorar a los autores al crear el documento","el abandono benigno es un peligro en lo digital","cuando se ve el daño digital suele ser tarde","los metadatos se actualizan con cada transformación"],"c":4},{"d":2,"t":"vf","q":"Las microformas del Brittle Books Program duran siglos y solo necesitan luz y una lupa para leerse.","a":true,"x":"Verdadero. Por eso fueron la solución para el papel ácido (el \"fuego lento\"), a diferencia de los soportes digitales, que dependen de un entorno informático.","c":4},{"d":2,"t":"mc","q":"Cada sección de METS con su contenido: «dmdSec»","o":["metadatos descriptivos","el mapa estructural (físico y lógico)","metadatos administrativos","los archivos"],"c":4},{"d":2,"t":"mc","q":"Cada sección de METS con su contenido: «amdSec»","o":["metadatos administrativos","el mapa estructural (físico y lógico)","los archivos","metadatos descriptivos"],"c":4},{"d":2,"t":"mc","q":"Cada sección de METS con su contenido: «fileSec»","o":["los archivos","metadatos administrativos","el mapa estructural (físico y lógico)","metadatos descriptivos"],"c":4},{"d":2,"t":"mc","q":"Cada sección de METS con su contenido: «structMap»","o":["el mapa estructural (físico y lógico)","metadatos administrativos","metadatos descriptivos","los archivos"],"c":4}],"repaso":["Cada nivel de abstracción con quién lo usa o qué muestra: «Físico» → cómo se almacenan realmente los datos.","Cada nivel de abstracción con quién lo usa o qué muestra: «Lógico» → qué datos hay y cómo se relacionan; lo usan administradores y programadores.","Cada nivel de abstracción con quién lo usa o qué muestra: «De vistas» → una parte de la base para cada usuario; también da seguridad.","¿De qué prototipo de IBM salió el lenguaje SQL? → System R.","En la jerarquía empleado → profesor → jefe de cátedra, de lo general a lo particular, ¿qué tipo de jerarquía es? → De especialización.","¿Qué es la realimentación por relevancia (feedback)? → Reformular la búsqueda a partir de lo que se recuperó.","Para la preservación digital, ¿qué significa \"largo plazo\"? → Más de 20 años.","Cada principio de \"cuándo actuar\" con su explicación: «Proactiva, no reactiva» → cuando se ve el daño digital suele ser tarde.","Cada principio de \"cuándo actuar\" con su explicación: «Continuada, no esporádica» → los metadatos se actualizan con cada transformación.","Cada principio de \"cuándo actuar\" con su explicación: «Actuar, no omitir» → el abandono benigno es un peligro en lo digital.","Cada principio de \"cuándo actuar\" con su explicación: «Desde la creación» → lo ideal es asesorar a los autores al crear el documento.","Las microformas del Brittle Books Program duran siglos y solo necesitan luz y una lupa para leerse. Por eso fueron la solución para el papel ácido (el \"fuego lento\"), a diferencia de los soportes digitales, que dependen de un entorno informático.","Cada sección de METS con su contenido: «dmdSec» → metadatos descriptivos.","Cada sección de METS con su contenido: «amdSec» → metadatos administrativos.","Cada sección de METS con su contenido: «fileSec» → los archivos.","Cada sección de METS con su contenido: «structMap» → el mapa estructural (físico y lógico)."],"nombre":"Tratamiento Automático de la Información II","corto":"TAI II"},"TAI3":{"clases":[{"t":"La medida de la información: Shannon, entropía y perplejidad","ap":["Para Shannon, ¿de qué depende la cantidad de información de un mensaje? → De cuánta incertidumbre resuelve.","La entropía es muy baja: todas las vocales son \"o\", así que se reponen fácilmente.","Si un modelo está totalmente seguro de la próxima palabra (entropía 0), ¿cuál es su perplejidad? → 1.","Cada idea con Shannon o con Belkin: «La incertidumbre está en el mensaje o la señal» → Shannon.","Cada idea con Shannon o con Belkin: «La incertidumbre está en la mente del usuario» → Belkin.","Cada idea con Shannon o con Belkin: «El objetivo es transmitir y medir eficientemente» → Shannon.","Cada idea con Shannon o con Belkin: «El objetivo es resolver una anomalía cognitiva» → Belkin.","¿Quién adoptó la perplejidad para evaluar modelos de lenguaje? → Frederick Jelinek y su equipo en IBM, en las décadas de 1970 y 1980.","¿Cómo se llamaba la máquina que diseñó Turing para probar combinaciones de Enigma? → La Bombe.","¿Entre cuántas opciones duda, en promedio, un modelo del lenguaje natural por palabra? → Entre 20 y 60."]},{"t":"Big data, aprendizaje automático y la práctica con IA","ap":["¿Cuáles son las \"3 V\" originales de big data, según Laney (2001)? → Volumen, velocidad y variedad.","¿Qué quiso decir Stigler con \"Funes es big data sin estadística\"? → Que acumular datos sin poder abstraer ni generalizar no produce conocimiento.","Big data son los datos producidos espontáneamente por la interacción con dispositivos interconectados (celular, tarjeta, GPS). A diferencia de una encuesta, no se generan con el propósito de ser datos.","¿Qué V se agregó después de las 3 originales de Laney, porque los datos espontáneos son ruidosos y no están validados? → Veracidad.","En el ejemplo del crédito de Sosa Escudero, emparejá cada letra con su contenido: «Y» → si el cliente pagó (1) o no (0).","En el ejemplo del crédito de Sosa Escudero, emparejá cada letra con su contenido: «X» → lo que el banco observa (edad, trabajo, bienes).","En el ejemplo del crédito de Sosa Escudero, emparejá cada letra con su contenido: «u» → lo azaroso o no observable (una enfermedad, una herencia).","Para Sosa Escudero, creer que una muestra \"grande\" tiene 30 datos (por la t de Student de Gosset) es \"uno de los disparates más grandes\" de la estadística.","En Moral Machine (MIT), ¿qué produce el sistema como salida? → Estadísticas de cómo responden las personas ante los dilemas de un auto autónomo."]},{"t":"El procesamiento del lenguaje natural","ap":["Cada técnica con lo que hace: «Tokenización» → divide el texto en unidades (palabras y signos).","Cada técnica con lo que hace: «Lematización» → lleva cada palabra a su forma de diccionario.","Cada técnica con lo que hace: «NER» → reconoce personas, organizaciones y lugares.","Cada técnica con lo que hace: «Análisis de sentimientos» → clasifica un texto como positivo, negativo o neutral.","Cada técnica con lo que hace: «Desambiguación» → elige la acepción correcta de una palabra polisémica.","Muchas palabras son polisémicas y un sinónimo vale solo para un sentido (\"banco\" → \"asiento\" no sirve si se busca un banco financiero). Por eso se tiene en cuenta el contexto, y a veces se expande al indexar, donde hay más contexto.","¿Qué afirma la hipótesis de la semántica distribucional? → Que las palabras relacionadas aparecen en contextos semejantes.","En la tokenización de \"Pájaro que comió, voló\", ¿cuántos tokens hay? → 5, porque la coma también es un token.","¿Cuál es el lema de \"quiero\"? → Querer.","Cada tipo de lengua con su ejemplo: «Flexiva» → español.","Cada tipo de lengua con su ejemplo: «Aislante» → chino mandarín.","Cada tipo de lengua con su ejemplo: «Aglutinante» → turco.","Cada tipo de lengua con su ejemplo: «Polisintética» → inuit.","\"Banco\" puede ser una entidad financiera, un asiento o un cardumen. ¿Qué es? → Una palabra polisémica."]},{"t":"Respuestas, anuncios y software libre","ap":["Cada forma de pago de anuncios con su descripción: «CPM» → se paga por cada mil veces que se muestra el anuncio.","Cada forma de pago de anuncios con su descripción: «CPC» → se paga cuando el usuario hace clic.","Cada forma de pago de anuncios con su descripción: «CPA» → se paga cuando el usuario compra, se registra o completa un formulario.","Cada libertad del software libre con su contenido: «Libertad 0» → ejecutar el programa con cualquier propósito.","Cada libertad del software libre con su contenido: «Libertad 1» → estudiar cómo funciona y adaptarlo.","Cada libertad del software libre con su contenido: «Libertad 2» → redistribuir copias.","Cada libertad del software libre con su contenido: «Libertad 3» → mejorar el programa y publicar las mejoras.","¿Qué devuelve un sistema de búsqueda de respuestas? → La respuesta concreta a la pregunta.","Fallan con respuestas que cambian con el tiempo, con datos raros y con respuestas que hay que sumar de varias fuentes.","¿Qué forma de pago es la más usada en los buscadores? → CPC (coste por clic).","¿Qué es el copyleft? → La regla que impide agregar restricciones al redistribuir, para proteger las libertades.","Se puede cobrar por distribuirlo: software libre no es \"no comercial\". \"Libre\" es como en \"libertad de expresión\", no como en \"barra libre de cerveza\".","¿Qué responde Stallman al argumento de que el copyright es un \"derecho natural\" del autor? → Que la Constitución de EE. UU. lo rechazó: el copyright es temporal y busca promover el progreso."]}],"p1":[{"d":1,"t":"mc","q":"Para Shannon, ¿de qué depende la cantidad de información de un mensaje?","o":["De cuánta incertidumbre resuelve","De su significado","De su extensión","De quién lo envía"],"c":1},{"d":2,"t":"vf","q":"Si se borran las vocales de la letra de 'Ojo con los Orozco', la entropía es alta porque faltan muchas letras.","a":false,"x":"Falso. La entropía es muy baja: todas las vocales son \"o\", así que se reponen fácilmente.","c":1},{"d":2,"t":"mc","q":"Si un modelo está totalmente seguro de la próxima palabra (entropía 0), ¿cuál es su perplejidad?","o":["1","0","6","Infinita"],"c":1},{"d":3,"t":"mc","q":"Cada idea con Shannon o con Belkin: «La incertidumbre está en el mensaje o la señal»","o":["Shannon","Belkin"],"c":1},{"d":3,"t":"mc","q":"Cada idea con Shannon o con Belkin: «La incertidumbre está en la mente del usuario»","o":["Belkin","Shannon"],"c":1},{"d":3,"t":"mc","q":"Cada idea con Shannon o con Belkin: «El objetivo es transmitir y medir eficientemente»","o":["Shannon","Belkin"],"c":1},{"d":3,"t":"mc","q":"Cada idea con Shannon o con Belkin: «El objetivo es resolver una anomalía cognitiva»","o":["Belkin","Shannon"],"c":1},{"d":1,"t":"mc","q":"¿Cuáles son las \"3 V\" originales de big data, según Laney (2001)?","o":["Volumen, velocidad y variedad","Volumen, veracidad y valor","Velocidad, verdad y visibilidad","Variedad, validez y vudú"],"c":2},{"d":2,"t":"mc","q":"¿Qué quiso decir Stigler con \"Funes es big data sin estadística\"?","o":["Que acumular datos sin poder abstraer ni generalizar no produce conocimiento","Que big data no tiene límites de memoria","Que Borges anticipó las computadoras","Que la estadística ya no sirve"],"c":2},{"d":2,"t":"mc","q":"¿Quién adoptó la perplejidad para evaluar modelos de lenguaje?","o":["Frederick Jelinek y su equipo en IBM, en las décadas de 1970 y 1980","Shannon en 1948","Turing en Bletchley Park","Belkin en 1980"],"c":1},{"d":1,"t":"mc","q":"¿Cómo se llamaba la máquina que diseñó Turing para probar combinaciones de Enigma?","o":["La Bombe","Christopher","UNIVAC","Colossus"],"c":1},{"d":2,"t":"mc","q":"¿Entre cuántas opciones duda, en promedio, un modelo del lenguaje natural por palabra?","o":["Entre 20 y 60","Exactamente 1","Siempre 6","Más de un millón"],"c":1},{"d":2,"t":"vf","q":"Big data son los datos de las encuestas muy grandes.","a":false,"x":"Falso. Big data son los datos producidos espontáneamente por la interacción con dispositivos interconectados (celular, tarjeta, GPS). A diferencia de una encuesta, no se generan con el propósito de ser datos.","c":2},{"d":2,"t":"mc","q":"¿Qué V se agregó después de las 3 originales de Laney, porque los datos espontáneos son ruidosos y no están validados?","o":["Veracidad","Valor","Visibilidad","Vigencia"],"c":2},{"d":2,"t":"mc","q":"En el ejemplo del crédito de Sosa Escudero, emparejá cada letra con su contenido: «Y»","o":["si el cliente pagó (1) o no (0)","lo que el banco observa (edad, trabajo, bienes)","lo azaroso o no observable (una enfermedad, una herencia)"],"c":2},{"d":2,"t":"mc","q":"En el ejemplo del crédito de Sosa Escudero, emparejá cada letra con su contenido: «X»","o":["lo que el banco observa (edad, trabajo, bienes)","lo azaroso o no observable (una enfermedad, una herencia)","si el cliente pagó (1) o no (0)"],"c":2},{"d":2,"t":"mc","q":"En el ejemplo del crédito de Sosa Escudero, emparejá cada letra con su contenido: «u»","o":["lo azaroso o no observable (una enfermedad, una herencia)","lo que el banco observa (edad, trabajo, bienes)","si el cliente pagó (1) o no (0)"],"c":2},{"d":3,"t":"vf","q":"Una muestra de 30 datos ya es una muestra grande.","a":false,"x":"Falso. Para Sosa Escudero, creer que una muestra \"grande\" tiene 30 datos (por la t de Student de Gosset) es \"uno de los disparates más grandes\" de la estadística.","c":2},{"d":2,"t":"mc","q":"En Moral Machine (MIT), ¿qué produce el sistema como salida?","o":["Estadísticas de cómo responden las personas ante los dilemas de un auto autónomo","Una decisión moral propia de la máquina","Un dibujo","Una predicción del próximo clic"],"c":2}],"p2":[{"d":2,"t":"mc","q":"Cada técnica con lo que hace: «Tokenización»","o":["divide el texto en uni Quiero","Quer","Querido"],"c":3},{"d":2,"t":"mc","q":"Cada tipo de lengua con su ejemplo: «Flexiva»","o":["español","chino mandarín","turco","inuit"],"c":3},{"d":2,"t":"mc","q":"Cada tipo de lengua con su ejemplo: «Aislante»","o":["chino mandarín","turco","español","inuit"],"c":3},{"d":2,"t":"mc","q":"Cada tipo de lengua con su ejemplo: «Aglutinante»","o":["turco","inuit","español","chino mandarín"],"c":3},{"d":2,"t":"mc","q":"Cada tipo de lengua con su ejemplo: «Polisintética»","o":["inuit","chino mandarín","turco","español"],"c":3},{"d":2,"t":"mc","q":"\"Banco\" puede ser una entidad financiera, un asiento o un cardumen. ¿Qué es?","o":["Una palabra polisémica","Una palabra monosémica","Una sigla","Una palabra vacía"],"c":3},{"d":2,"t":"mc","q":"¿Qué devuelve un sistema de búsqueda de respuestas?","o":["La respuesta concreta a la pregunta","Una lista de documentos","Un anuncio","Un resumen del catálogo"],"c":4},{"d":2,"t":"vf","q":"Los métodos simples de búsqueda de respuestas funcionan siempre bien, incluso con preguntas como '¿quién es el presidente de Francia?'.","a":false,"x":"Falso. Fallan con respuestas que cambian con el tiempo, con datos raros y con respuestas que hay que sumar de varias fuentes.","c":4},{"d":2,"t":"mc","q":"¿Qué forma de pago es la más usada en los buscadores?","o":["CPC (coste por clic)","CPM","CPA","Una tarifa fija mensual"],"c":4},{"d":2,"t":"mc","q":"¿Qué es el copyleft?","o":["La regla que impide agregar restricciones al redistribuir, para proteger las libertades","Una forma de prohibir copias","Un tipo de licencia propietaria","Un virus"],"c":4},{"d":2,"t":"vf","q":"Para Stallman, el software libre no puede venderse.","a":false,"x":"Falso. Se puede cobrar por distribuirlo: software libre no es \"no comercial\". \"Libre\" es como en \"libertad de expresión\", no como en \"barra libre de cerveza\".","c":4},{"d":3,"t":"mc","q":"¿Qué responde Stallman al argumento de que el copyright es un \"derecho natural\" del autor?","o":["Que la Constitución de EE. UU. lo rechazó: el copyright es temporal y busca promover el progreso","Que es cierto","Que los autores no deberían cobrar","Que solo vale para los libros"],"c":4}],"fin":[{"d":2,"t":"mc","q":"¿Por qué Google tuvo que hacer una \"curación\" de las búsquedas antes de armar Flu Trends?","o":["Para decidir qué búsquedas eran realmente de gripe (\"tengo frío\" puede ser solo invierno)","Para borrar los datos personales","Para traducirlas","Para venderlas"],"c":2},{"d":3,"t":"mc","q":"¿Por qué a veces conviene expandir con sinónimos al indexar y no al buscar?","o":["Porque al indexar hay más contexto para elegir el sinónimo correcto, aunque el índice crezca","Porque es más rápido","Porque el usuario no escribe consultas","Porque los sinónimos no existen en las consultas"],"c":3},{"d":2,"t":"mc","q":"Cada recurso con su forma de medir la similitud entre palabras: «Modelo de espacio vectorial»","o":["semántica distribucional (contextos parecidos)","consultas distintas que terminan en el mismo documento","base de conocimiento"],"c":3},{"d":2,"t":"mc","q":"Cada recurso con su forma de medir la similitud entre palabras: «WordNet»","o":["base de conocimiento","consultas distintas que terminan en el mismo documento","semántica distribucional (contextos parecidos)"],"c":3},{"d":2,"t":"mc","q":"Cada recurso con su forma de medir la similitud entre palabras: «Registros de clics»","o":["consultas distintas que terminan en el mismo documento","base de conocimiento","semántica distribucional (contextos parecidos)"],"c":3},{"d":2,"t":"mc","q":"Cada actor de la RI patrocinada con su rol: «Usuario»","o":["hace la consulta y quiere resultados relevantes","muestra anuncios contextuales en su sitio","elige palabras clave y paga por el anuncio","organiza la subasta y muestra los anuncios"],"c":4},{"d":2,"t":"mc","q":"Cada actor de la RI patrocinada con su rol: «Anunciante»","o":["elige palabras clave y paga por el anuncio","hace la consulta y quiere resultados relevantes","organiza la subasta y muestra los anuncios","muestra anuncios contextuales en su sitio"],"c":4},{"d":2,"t":"mc","q":"Cada actor de la RI patrocinada con su rol: «Editor de la página»","o":["muestra anuncios contextuales en su sitio","hace la consulta y quiere resultados relevantes","organiza la subasta y muestra los anuncios","elige palabras clave y paga por el anuncio"],"c":4},{"d":2,"t":"mc","q":"Cada actor de la RI patrocinada con su rol: «Buscador»","o":["organiza la subasta y muestra los anuncios","hace la consulta y quiere resultados relevantes","elige palabras clave y paga por el anuncio","muestra anuncios contextuales en su sitio"],"c":4},{"d":2,"t":"mc","q":"Según Stallman, ¿qué es el open source?","o":["Un método de desarrollo, una cuestión práctica","Un movimiento social","Una empresa","Una licencia propietaria"],"c":4}],"repaso":["¿Por qué Google tuvo que hacer una \"curación\" de las búsquedas antes de armar Flu Trends? → Para decidir qué búsquedas eran realmente de gripe (\"tengo frío\" puede ser solo invierno).","¿Por qué a veces conviene expandir con sinónimos al indexar y no al buscar? → Porque al indexar hay más contexto para elegir el sinónimo correcto, aunque el índice crezca.","Cada recurso con su forma de medir la similitud entre palabras: «Modelo de espacio vectorial» → semántica distribucional (contextos parecidos).","Cada recurso con su forma de medir la similitud entre palabras: «WordNet» → base de conocimiento.","Cada recurso con su forma de medir la similitud entre palabras: «Registros de clics» → consultas distintas que terminan en el mismo documento.","Cada actor de la RI patrocinada con su rol: «Usuario» → hace la consulta y quiere resultados relevantes.","Cada actor de la RI patrocinada con su rol: «Anunciante» → elige palabras clave y paga por el anuncio.","Cada actor de la RI patrocinada con su rol: «Editor de la página» → muestra anuncios contextuales en su sitio.","Cada actor de la RI patrocinada con su rol: «Buscador» → organiza la subasta y muestra los anuncios.","Según Stallman, ¿qué es el open source? → Un método de desarrollo, una cuestión práctica."],"nombre":"Tratamiento Automático de la Información III","corto":"TAI III"},"TMC":{"clases":[{"t":"El símbolo y el lenguaje: Cassirer y Jakobson","ap":["¿Cómo propone Cassirer definir al ser humano? → Como animal simbólico.","Cada rasgo con la señal o con el símbolo, según Cassirer: «Forma parte del mundo físico del ser» → señal.","Cada rasgo con la señal o con el símbolo, según Cassirer: «Forma parte del mundo humano del sentido» → símbolo.","Cada rasgo con la señal o con el símbolo, según Cassirer: «Es un \"operador\" ligado a su cosa de modo fijo» → señal.","Cada rasgo con la señal o con el símbolo, según Cassirer: «Es un \"designador\", universal y variable» → símbolo.","Cada mensaje con la función del lenguaje que predomina: «\"¡Ay, qué dolor!\"» → emotiva.","Cada mensaje con la función del lenguaje que predomina: «\"Cerrá la puerta.\"» → conativa.","Cada mensaje con la función del lenguaje que predomina: «\"Hola, ¿me escuchás?\"» → fática.","Cada mensaje con la función del lenguaje que predomina: «\"¿Qué significa 'ISBD'?\"» → metalingüística.","Cada mensaje con la función del lenguaje que predomina: «\"El agua hierve a 100 °C.\"» → referencial.","Cada mensaje con la función del lenguaje que predomina: «\"I like Ike.\"» → poética.","También aparece en eslóganes, refranes y publicidad (\"I like Ike\"). Y la poesía no tiene solo la función poética: la épica se apoya en la referencial; la lírica, en la emotiva.","¿Cuál es la función del lenguaje que, según Jakobson, compartimos con las aves y es la primera que aprenden los niños? → Fática.","Según Uexküll, ¿qué forman juntos el sistema receptor y el efector de un organismo? → El círculo funcional.","¿Qué diferencia hay entre la reacción animal y la respuesta humana, según Cassirer? → En el ser humano, la respuesta es demorada por el pensamiento.","Expresan emociones (lenguaje emotivo), pero nunca designan objetos. La diferencia entre lenguaje emotivo y proposicional es la frontera entre el mundo animal y el humano.","Cada hilo de la red simbólica con lo que es para Cassirer: «Lenguaje, mito, arte y religión» → los hilos de la red simbólica.","Cada hilo de la red simbólica con lo que es para Cassirer: «Universalidad» → todo tiene un nombre.","Cada hilo de la red simbólica con lo que es para Cassirer: «Variabilidad» → la misma idea puede decirse en distintas lenguas y palabras.","¿Cuántas funciones tenía el modelo de Bühler y cuáles agregó Jakobson? → 3 (emotiva, conativa, referencial); Jakobson agregó la fática, la metalingüística y la poética.","Cada factor de la comunicación con su función: «Hablante» → emotiva.","Cada factor de la comunicación con su función: «Oyente» → conativa.","Cada factor de la comunicación con su función: «Contexto» → referencial.","Cada factor de la comunicación con su función: «Contacto» → fática.","Cada factor de la comunicación con su función: «Código» → metalingüística.","Cada factor de la comunicación con su función: «Mensaje» → poética."]},{"t":"El orden de los libros (Chartier)","ap":["\"Las formas producen sentido\": el soporte, el formato y la tipografía cambian la lectura. Al pasar del códice a la pantalla, \"el mismo texto ya no es realmente el mismo\".","Según De Certeau, citado por Chartier, ¿qué son los lectores? → Viajeros, nómadas furtivos por tierras que no escribieron.","¿Qué defendía Gabriel Naudé en su Advis pour dresser une bibliothèque (1627)? → Una biblioteca pública y numerosa, pero con selección.","En los siglos XVI y XVII, 'biblioteca' podía significar también un libro: un catálogo o una compilación. Por eso las \"bibliotecas sin muros\" fueron los catálogos, como el de Gesner (1545): la biblioteca universal solo podía ser inmaterial.","Cada legitimación de la propiedad literaria con su base: «La escritura como trabajo» → el derecho natural de Locke.","Cada legitimación de la propiedad literaria con su base: «La obra como forma original» → las ideas son comunes, pero la forma expresa el genio del autor (Kant, Fichte, Herder)."]},{"t":"Las teorías de la comunicación de masas","ap":["¿Qué pregunta resume el modelo de Lasswell? → ¿Quién dice qué, por qué canal, a quién y con qué efecto?.","Cada teoría con su pregunta central: «Teoría hipodérmica» → ¿cómo manipula la propaganda a una masa aislada?.","Cada teoría con su pregunta central: «Teoría funcionalista» → ¿qué funciones cumplen los medios en la sociedad?.","Cada teoría con su pregunta central: «Usos y gratificaciones» → ¿qué hacen las personas con los medios?.","Cada teoría con su pregunta central: «Teoría culturológica» → ¿qué es la cultura de masas como sistema de mitos y valores?.","Según Lazarsfeld y Merton, ¿en qué consiste la \"disfunción narcotizante\"? → En que el exceso de información vuelve apático al ciudadano, que confunde estar informado con actuar.","Cada condición de la propaganda eficaz con su ejemplo (Lazarsfeld y Merton): «Monopolización» → la propaganda nazi sin contrapropaganda.","Cada condición de la propaganda eficaz con su ejemplo (Lazarsfeld y Merton): «Canalización» → la publicidad que hace elegir una marca de cepillo de dientes a quien ya se cepilla.","Cada condición de la propaganda eficaz con su ejemplo (Lazarsfeld y Merton): «Complementación» → los programas del padre Coughlin escuchados y discutidos en grupos locales.","Dicen que esa función ha sido sobreestimada: los datos de consumo no miden efectos, y el automóvil probablemente cambió más la sociedad que la radio. Además, por su estructura comercial, los medios tienden a conservar el orden social.","¿En qué dos bases se apoyó la teoría hipodérmica? → La sociedad de masas y el conductismo (estímulo → respuesta).","Cada factor de la audiencia (corriente de la persuasión) con su ejemplo: «Exposición selectiva» → leer solo los diarios que coinciden con las propias ideas.","Cada factor de la audiencia (corriente de la persuasión ión de la propaganda eficaz con su explicación: «Canalización»","o":["orientar actitudes que ya existen, no cambiar valores profundos","ausencia de contrapropaganda","los medios funcionan mejor junto con el contacto cara a cara"],"c":3},{"d":3,"t":"mc","q":"Cada condición de la propaganda eficaz con su explicación: «Complementación»","o":["los medios funcionan mejor junto con el contacto cara a cara","orientar actitudes que ya existen, no cambiar valores profundos","ausencia de contrapropaganda"],"c":3},{"d":2,"t":"mc","q":"Según Althusser, ¿qué son la escuela, la Iglesia, la familia y los medios?","o":["Aparatos ideológicos de Estado","Aparatos represivos de Estado","Industrias culturales","Comunidades de lectores"],"c":4},{"d":3,"t":"mc","q":"¿Qué es la \"refeudalización\" de la sociedad según Habermas?","o":["La decadencia del espacio público de discusión racional cuando el mercado \"fabrica la opinión\"","La vuelta a la monarquía","La concentración de tierras","La desaparición de los medios"],"c":4},{"d":2,"t":"mc","q":"Cada etapa de McLuhan con su rasgo: «Cultura oral»","o":["mundo acústico, tribal y colectivo; los hechos se perciben como simultáneos","lectura lineal, pensamiento lógico, individualismo; \"la imprenta creó el público\"","retorno a lo acústico y tribal a escala planetaria: la aldea global"],"c":4},{"d":2,"t":"mc","q":"Cada etapa de McLuhan con su rasgo: «Alfabeto e imprenta»","o":["lectura lineal, pensamiento lógico, individualismo; \"la imprenta creó el público\"","mundo acústico, tribal y colectivo; los hechos se perciben como simultáneos","retorno a lo acústico y tribal a escala planetaria: la aldea global"],"c":4},{"d":2,"t":"mc","q":"Cada etapa de McLuhan con su rasgo: «Era electrónica»","o":["retorno a lo acústico y tribal a escala planetaria: la aldea global","mundo acústico, tribal y colectivo; los hechos se perciben como simultáneos","lectura lineal, pensamiento lógico, individualismo; \"la imprenta creó el público\""],"c":4},{"d":2,"t":"vf","q":"Según Francovich, McLuhan acierta al decir que cada medio nuevo elimina al anterior.","a":false,"x":"Falso. Francovich lo critica: los medios no se eliminan, se suman (los libros no desaparecieron con la radio ni con la TV). También le reprocha el simplismo y las generalizaciones frágiles.","c":4}],"repaso":["¿Cuáles son los 3 polos de la historia de la lectura según Chartier? → Texto, libro y lectura.","Propone partir de los objetos y no de las clases sociales: los mismos textos circulaban entre lectores populares y letrados (Menocchio, la Biblioteca azul). Lo que cambia es cómo se leen.","Según Edgar Morin, ¿qué hace la cultura de masas con los arquetipos? → Los reduce a estereotipos.","Cada condición de la propaganda eficaz con su explicación: «Monopolización» → ausencia de contrapropaganda.","Cada condición de la propaganda eficaz con su explicación: «Canalización» → orientar actitudes que ya existen, no cambiar valores profundos.","Cada condición de la propaganda eficaz con su explicación: «Complementación» → los medios funcionan mejor junto con el contacto cara a cara.","Según Althusser, ¿qué son la escuela, la Iglesia, la familia y los medios? → Aparatos ideológicos de Estado.","¿Qué es la \"refeudalización\" de la sociedad según Habermas? → La decadencia del espacio público de discusión racional cuando el mercado \"fabrica la opinión\".","Cada etapa de McLuhan con su rasgo: «Cultura oral» → mundo acústico, tribal y colectivo; los hechos se perciben como simultáneos.","Cada etapa de McLuhan con su rasgo: «Alfabeto e imprenta» → lectura lineal, pensamiento lógico, individualismo; \"la imprenta creó el público\".","Cada etapa de McLuhan con su rasgo: «Era electrónica» → retorno a lo acústico y tribal a escala planetaria: la aldea global.","Francovich lo critica: los medios no se eliminan, se suman (los libros no desaparecieron con la radio ni con la TV). También le reprocha el simplismo y las generalizaciones frágiles."],"nombre":"Teoría y Medios de Comunicación","corto":"Teoría y Medios"},"PRA2":{"clases":[{"t":"Bibliotecas en contexto de encierro","ap":["Según las pautas de la IFLA, ¿cuándo se puede restringir el acceso de un recluso a un material de lectura? → Solo cuando representa un peligro inminente para la seguridad de la prisión.","Según la IFLA, no renuncia a ese derecho; por eso la biblioteca de prisión debe parecerse a una biblioteca pública.","Según la IFLA, ¿cuántos libros debe tener como mínimo una biblioteca de prisión de servicio completo? → 2000 títulos o 10 por recluso, la mayor de las dos opciones.","¿A partir de cuántos reclusos debe haber un bibliotecario profesional a tiempo completo? → Más de 500.","¿Qué sección de la IFLA elaboró las pautas para servicios bibliotecarios a reclusos? → La Sección de Bibliotecas para Personas en Condiciones Desventajosas (LSDP).","¿A qué establecimientos se aplican las pautas? → A prisiones y centros de detención con 50 reclusos o más, de adultos y de menores.","Las donaciones pasan los mismos criterios de selección que las compras.","¿Qué tipo de materiales recomiendan especialmente las pautas, por la población carcelaria? → Materiales legales, lectura fácil, letra grande, audiolibros, historietas y poesía.","¿Por qué el bibliotecario de prisión debe integrarse a redes profesionales? → Porque suele estar aislado de sus colegas."]},{"t":"Bibliotecas hospitalarias: biblioterapia y musicoterapia","ap":["Cada tipo de biblioterapia con sus rasgos: «Para el desarrollo personal» → escuelas y bibliotecas públicas; el bibliotecario actúa como educador.","Cada tipo de biblioterapia con sus rasgos: «Clínica» → hospitales y clínicas; participan médicos, psicoterapeutas y bibliotecarios.","¿Qué rol cumple el biblioterapeuta? → Es el intermediario entre el lector y la lectura, y guía la discusión posterior.","Cada técnica de musicoterapia con su objetivo: «Escucha activa» → relajar y reducir la ansiedad.","Cada técnica de musicoterapia con su objetivo: «Ritmos terapéuticos» → mejorar la coordinación, el movimiento y el habla.","Cada técnica de musicoterapia con su objetivo: «Improvisación» → expresar emociones de forma no verbal.","Cada técnica de musicoterapia con su objetivo: «Canto y vocalización» → favorecer la respiración y el habla.","Necesita un biblioterapeuta como intermediario entre el lector y la lectura, y después hay una discusión en grupo donde se expresan sentimientos y se comparten experiencias.","Cada beneficio de la biblioterapia con su explicación: «Resiliencia» → identificarse con personajes que superan dificultades.","Cada beneficio de la biblioterapia con su explicación: «Catarsis» → canal de expresión emocional.","Cada beneficio de la biblioterapia con su explicación: «Estimulación cognitiva» → ejercitar la memoria y la concentración.","Cada beneficio de la biblioterapia con su explicación: «Reducción del aislamiento» → la lectura acompaña.","¿Quién está a cargo de la musicoterapia? → Un musicoterapeuta, con objetivos terapéuticos concretos y medibles.","¿Por qué la música ayuda en enfermedades o lesiones neurológicas? → Porque activa áreas del cerebro y ayuda a recuperar funciones como el movimiento, la memoria, la comunicación o las emociones."]},{"t":"La discapacidad y el trato al usuario","ap":["Según el Manual de Buenas Prácticas de la UNGS, ¿cuál es la mejor manera de saber qué necesita una persona con discapacidad? → Dirigirse directamente a ella y preguntarle.","La persona es ciega pero oye bien, y \"ver\" o \"mirar\" son palabras frecuentes en su vocabulario: se usan con naturalidad.","¿Por qué hay que formular con mucha claridad las preguntas de examen para un estudiante sordo? → Porque tiende a interpretar la información de forma literal.","¿Qué significa que los estudiantes son \"iguales pero diferentes\" para la UNGS? → Que son iguales en derechos y diferentes en sus posibilidades, y por eso se busca la equidad con apoyos.","Cada categoría de discapacidad visual con su definición: «Ceguera total (amaurosis)» → sin respuesta visual.","Cada categoría de discapacidad visual con su definición: «Ceguera legal» → 1/10 de agudeza visual en el mejor ojo, con corrección, y/o 20 grados de campo.","Cada categoría de discapacidad visual con su definición: «Disminución visual» → 3/10 de agudeza visual en el mejor ojo y/o 20 grados de campo.","Cada categoría de discapacidad visual con su definición: «Baja visión» → agudeza o campo reducidos que no se corrigen con lentes, con algún resto visual.","En un examen, ¿cuánto tiempo extra puede tener un estudiante con discapacidad visual según el Manual? → Hasta un 50 % más."]},{"t":"La biblioteca accesible y el debate sobre la digitalización","ap":["¿Qué permite la Ley 26.285 (2007)? → Reproducir y distribuir obras en Braille, audio o texto digital para personas ciegas o con discapacidades perceptivas, sin pagar derechos de autor, a través de entidades autorizadas.","Ordená el flujo de producción del material en la UByD: buscar la bibliografía → escanear → hacer el OCR → corregir y adecuar el texto → convertirlo a audio, Braille o letra ampliada → identificar, registrar y prestar.","Cada programa con su función: «Jaws» → lector de pantalla.","Cada programa con su función: «FineReader» → reconocimiento óptico de caracteres (OCR).","Cada programa con su función: «Quick Braille» → conversión de texto a Braille.","Cada programa con su función: «Dragon Naturally Speaking» → reconocimiento de voz (de la voz al texto).","Según los expositores del conversatorio de la Biblioteca del Congreso, ¿hay que digitalizar todo? → No: lo importante es que la información sea accesible en distintos formatos (digital, Braille, audio, letra ampliada) según cada usuario.","¿Qué es una maqueta háptica? → Un plano en relieve con Braille que se lee con el tacto, para que las personas ciegas se ubiquen.","¿Qué tiene de especial la persona que atiende el Área de Servicios para la Discapacidad de la UByD? → Es un estudiante ciego de la UNGS, experto en tiflotecnología, que conoce por experiencia las trabas de otros estudiantes.","No se aplica si la obra ya se editó en sistema especial y está a la venta. Además, tiene que hacerlo una entidad autorizada y las obras digitales van encriptadas.","¿Cuál es la base de todas las versiones adaptadas (audio, Braille, letra ampliada)? → El texto digital.","¿Qué es lo más difícil de adaptar para un lector de pantalla, según la UByD? → La matemática: fórmulas, tablas y gráficos.","¿Qué ley aprobó en la Argentina la Convención sobre los Derechos de las Personas con Discapacidad? → Ley 26.378 (2008)."]}],"p1":[{"d":2,"t":"mc","q":"Según las pautas de la IFLA, ¿cuándo se puede restringir el acceso de un recluso a un material de lectura?","o":["Solo cuando representa un peligro inminente para la seguridad de la prisión","Cuando al director no le gusta el tema","Siempre que sea un libro político","Cuando el recluso está en aislamiento"],"c":1},{"d":2,"t":"vf","q":"Una persona encarcelada pierde su derecho a aprender y a acceder a la información.","a":false,"x":"Falso. Según la IFLA, no renuncia a ese derecho; por eso la biblioteca de prisión debe parecerse a una biblioteca pública.","c":1},{"d":3,"t":"mc","q":"Según la IFLA, ¿cuántos libros debe tener como mínimo una biblioteca de prisión de servicio completo?","o":["2000 títulos o 10 por recluso, la mayor de las dos opciones","500","100","1 por recluso"],"c":1},{"d":3,"t":"mc","q":"¿A partir de cuántos reclusos debe haber un bibliotecario profesional a tiempo completo?","o":["Más de 500","50","300","Más de 2000"],"c":1},{"d":2,"t":"mc","q":"Cada tipo de biblioterapia con sus rasgos: «Para el desarrollo personal»","o":["escuelas y bibliotecas públicas; el bibliotecario actúa como educador","hospitales y clínicas; participan médicos, psicoterapeutas y bibliotecarios"],"c":2},{"d":2,"t":"mc","q":"Cada tipo de biblioterapia con sus rasgos: «Clínica»","o":["hospitales y clínicas; participan médicos, psicoterapeutas y bibliotecarios","escu es van encriptadas.","c":4},{"d":2,"t":"mc","q":"¿Cuál es la base de todas las versiones adaptadas (audio, Braille, letra ampliada)?","o":["El texto digital","La fotocopia","El CD","La máquina Perkins"],"c":4},{"d":2,"t":"mc","q":"¿Qué es lo más difícil de adaptar para un lector de pantalla, según la UByD?","o":["La matemática: fórmulas, tablas y gráficos","Las novelas","Los cuentos","Los diarios"],"c":4},{"d":2,"t":"mc","q":"¿Qué ley aprobó en la Argentina la Convención sobre los Derechos de las Personas con Discapacidad?","o":["Ley 26.378 (2008)","Ley 11.723","Ley 26.285","Ley 24.521"],"c":4}],"fin":[{"d":2,"t":"mc","q":"Según las pautas, ¿qué se hace con los reclusos aislados que no pueden ir a la biblioteca?","o":["Piden los libros por catálogo","Nada","Se les prohíbe leer","Se les lleva solo diarios"],"c":1},{"d":2,"t":"vf","q":"Los reclusos y los voluntarios pueden reemplazar al personal pago de la biblioteca.","a":false,"x":"Falso. Se los puede emplear, pero no reemplazan al personal pago.","c":1},{"d":2,"t":"mc","q":"Cada equipo con su uso: «Máquina Perkins»","o":["escribir en Braille","imprimir textos en Braille","digitalizar fotocopias","ampliar la pantalla"],"c":4},{"d":2,"t":"mc","q":"Cada equipo con su uso: «Impresora Braille»","o":["imprimir textos en Braille","ampliar la pantalla","digitalizar fotocopias","escribir en Braille"],"c":4},{"d":2,"t":"mc","q":"Cada equipo con su uso: «Escáner doble faz»","o":["digitalizar fotocopias","ampliar la pantalla","imprimir textos en Braille","escribir en Braille"],"c":4},{"d":2,"t":"mc","q":"Cada equipo con su uso: «Magnificador»","o":["ampliar la pantalla","digitalizar fotocopias","escribir en Braille","imprimir textos en Braille"],"c":4},{"d":2,"t":"mc","q":"¿Por qué el OCR se hace en tandas de hasta 15 páginas?","o":["Para controlar la calidad del reconocimiento","Por la ley","Porque el escáner no permite más","Para ahorrar papel"],"c":4},{"d":2,"t":"mc","q":"¿Qué dicen las pautas WCAG sobre los niveles de prioridad?","o":["La prioridad 1 tiene que cumplirse, la 2 debe y la 3 puede","Todos son opcionales","Solo existe la prioridad 1","La prioridad 3 es la más importante"],"c":4},{"d":2,"t":"mc","q":"Cada medida de infraestructura con el usuario al que beneficia: «Rampas sin escalones y ascensores»","o":["personas con discapacidad motriz","personas ciegas","personas con baja visión"],"c":4},{"d":2,"t":"mc","q":"Cada medida de infraestructura con el usuario al que beneficia: «Macroletras y colores aptos para daltónicos»","o":["personas con baja visión","personas con discapacidad motriz","personas ciegas"],"c":4},{"d":2,"t":"mc","q":"Cada medida de infraestructura con el usuario al que beneficia: «Maquetas hápticas y senderos en relieve»","o":["personas ciegas","personas con baja visión","personas con discapacidad motriz"],"c":4},{"d":2,"t":"mc","q":"Según Katz, ¿por qué llegan pocas personas con discapacidad a la universidad?","o":["Porque el sistema es progresivo (pocas acceden a la escuela media) y hay barreras actitudinales, físicas y comunicacionales","Porque no les interesa","Porque está prohibido","Porque no hay carreras para ellas"],"c":4}],"repaso":["Según las pautas, ¿qué se hace con los reclusos aislados que no pueden ir a la biblioteca? → Piden los libros por catálogo.","Se los puede emplear, pero no reemplazan al personal pago.","Cada equipo con su uso: «Máquina Perkins» → escribir en Braille.","Cada equipo con su uso: «Impresora Braille» → imprimir textos en Braille.","Cada equipo con su uso: «Escáner doble faz» → digitalizar fotocopias.","Cada equipo con su uso: «Magnificador» → ampliar la pantalla.","¿Por qué el OCR se hace en tandas de hasta 15 páginas? → Para controlar la calidad del reconocimiento.","¿Qué dicen las pautas WCAG sobre los niveles de prioridad? → La prioridad 1 tiene que cumplirse, la 2 debe y la 3 puede.","Cada medida de infraestructura con el usuario al que beneficia: «Rampas sin escalones y ascensores» → personas con discapacidad motriz.","Cada medida de infraestructura con el usuario al que beneficia: «Macroletras y colores aptos para daltónicos» → personas con baja visión.","Cada medida de infraestructura con el usuario al que beneficia: «Maquetas hápticas y senderos en relieve» → personas ciegas.","Según Katz, ¿por qué llegan pocas personas con discapacidad a la universidad? → Porque el sistema es progresivo (pocas acceden a la escuela media) y hay barreras actitudinales, físicas y comunicacionales."],"nombre":"Prácticas Bibliotecarias II","corto":"Prácticas II"},"SEM":{"clases":[{"t":"Ciencia, conocimiento y ruptura epistemológica","ap":["Cada rasgo con el tipo de conocimiento: «Sensitivo y superficial» → cotidiano.","Cada rasgo con el tipo de conocimiento: «Metódico y verificable» → científico.","Cada rasgo con el tipo de conocimiento: «Dogmático y asistemático» → cotidiano.","Cada rasgo con el tipo de conocimiento: «Provisorio y comunicable» → científico.","Según Bourdieu y otros, ¿cuál es \"el obstáculo epistemológico por excelencia\" para el sociólogo? → La familiaridad con el universo social.","Ordená las etapas de la investigación empírica: comprobación → ruptura → estructuración. Orden correcto: ruptura → estructuración → comprobación.","¿Qué es la epistemología? → El estudio crítico de los principios, supuestos, métodos y valores de las ciencias.","El conocimiento científico es provisorio y falible: está abierto a revisión.","Según Beltrán, ¿qué tiene de particular el objeto de las Ciencias Sociales? → Que incluye al propio investigador, es histórico y reacciona a la observación.","¿Qué es la vigilancia epistemológica? → El examen constante de las condiciones y límites de validez de las técnicas y conceptos que se usan."]},{"t":"El problema, el marco teórico y los objetivos","ap":["El tema es el marco general del interés (por ejemplo, la biblioteca escolar). El problema es el conjunto de preguntas concretas que problematizan un aspecto del tema, con un recorte de espacio y tiempo.","No es el estado del arte completo ni se mide por la extensión. Es una elaboración propia que articula paradigmas, teorías y conceptos pertinentes al problema, vinculándolos con coherencia.","Cada tipo de diseño con su propósito: «Exploratorio» → examinar un tema poco estudiado.","Cada tipo de diseño con su propósito: «Descriptivo» → caracterizar y medir propiedades de un fenómeno.","Cada tipo de diseño con su propósito: «Explicativo» → buscar las causas de un fenómeno.","Cada tipo de diseño con su propósito: «Evaluativo» → valorar los resultados de una política o programa.","Cada tipo de diseño con su propósito: «Predictivo» → anticipar el comportamiento futuro de variables.","¿Cómo se redacta un objetivo de investigación? → Con un verbo en infinitivo.","Cada paso de la estrategia para plantear un problema con su ejemplo: «Traducir conceptos teóricos en operativos» → \"uso de la biblioteca\" = cantidad de préstamos y visitas.","Cada paso de la estrategia para plantear un problema con su ejemplo: «Delimitar espacio y tiempo» → la biblioteca de una escuela de Lugano en 2025.","Cada paso de la estrategia para plantear un problema con su ejemplo: «Disponer de información e instrumentos» → registros de préstamo y una encuesta a estudiantes.","¿Cuáles son los 3 pilares de la construcción del tema y el problema? → La experiencia en el campo, la lectura e intercambio con especialistas, y la reflexión teórica.","Según Briones, ¿qué es el marco de antecedentes? → Los resultados de otros estudios sobre el tema.","Cada criterio para evaluar una teoría con su significado: «Parsimonia» → explicar mucho con pocas proposiciones.","Cada criterio para evaluar una teoría con su significado: «Fructificación» → generar nuevas preguntas e investigaciones.","Cada criterio para evaluar una teoría con su significado: «Consistencia lógica» → proposiciones sin contradicciones.","Cada tipo de objetivo (Briones) con su ejemplo: «Descriptivo» → describir el perfil de los usuarios de una biblioteca.","Cada tipo de objetivo (Briones) con su ejemplo: «Clasificatorio» → construir una tipología de lectores.","Cada tipo de objetivo (Briones) con su ejemplo: «Comparativo» → comparar el uso de dos bibliotecas escolares.","Cada tipo de objetivo (Briones) con su ejemplo: «Relacional» → analizar la relación entre la edad y la frecuencia de préstamos.","Los objetivos específicos son los pasos para lograr el objetivo general. El general es \"el norte\" y los específicos, los pasos concretos."]},{"t":"Las hipótesis, las variables y las unidades de análisis","ap":["¿Cuál de estas oraciones es una hipótesis bien formulada? → A menor nivel educativo, mayor cantidad de hijos.","Cada hipótesis defectuosa con la característica que le falta: «\"En la próxima elección la gente votará o se abstendrá\"» → refutabilidad.","Cada hipótesis defectuosa con la característica que le falta: «\"La insustentabilidad de la economía provocó más violencia\"» → precisión.","En los estudios exploratorios casi no se formulan (suelen ser un resultado) y en los descriptivos no son obligatorias. En los explicativos sí se formulan siempre.","Cada variable con su nivel de medición: «Estado civil» → nominal.","Cada variable con su nivel de medición: «Nivel educativo (primaria, secundaria, terciaria)» → ordinal.","Cada variable con su nivel de medición: «Temperatura en grados» → de intervalo.","Cada variable con su nivel de medición: «Cantidad de libros prestados» → de razón.","¿Qué hipótesis clásica usa el libro como ejemplo, de Durkheim? → Cuanto menos cohesión tiene una sociedad, mayor es su tasa de suicidios.","Que los datos no apoyen una hipótesis también es conocimiento: permite descartar una explicación.","Cada hipótesis con su tipo: «\"La falta de estudio genera bajo rendimiento\"» → causal.","Cada hipótesis con su tipo: «\"A mayor nivel educativo, mayores ingresos\"» → de asociación con dirección.","Según Popper, ¿qué tiene que cumplir una hipótesis científica? → Ser falsable: que la experiencia pueda refutarla.","¿Qué diferencia hay entre la validez y la confiabilidad de un indicador? → La validez es que mida lo que debe medir; la confiabilidad, que observaciones repetidas den los mismos datos.","Un sistema de categorías debe ser... → Exhaustivo, excluyente y preciso."]},{"t":"Enfoques, técnicas y el proyecto de investigación","ap":["Cada rasgo con el modelo cuantitativo o cualitativo: «Lógica deductiva y diseño estructurado» → cuantitativo.","Cada rasgo con el modelo cuantitativo o cualitativo: «Diseño emergente y análisis inductivo» → cualitativo.","Cada rasgo con el modelo cuantitativo o cualitativo: «Muestra estadísticamente representativa» → cuantitativo.","Cada rasgo con el modelo cuantitativo o cualitativo: «El investigador como instrumento clave» → cualitativo.","Si en un mismo estudio se aplican una encuesta y entrevistas al mismo aspecto, buscando que los resultados coincidan, la estrategia se llama... → Triangulación.","Cada estrategia de integración con su descripción: «Complementación» → cada método ilumina un aspecto distinto; integración mínima.","Cada estrategia de integración con su descripción: «Combinación» → un método sirve de insumo para mejorar el otro.","Cada estrategia de integración con su descripción: «Triangulación» → los dos métodos se aplican al mismo aspecto buscando resultados convergentes.","¿Cuántos participantes suele tener un grupo de discusión? → Entre 5 y 10.","Un proyecto todavía no tiene resultados: puede cerrar con una reflexión o líneas futuras. Es una de las trampas del proyecto de ejemplo, que incluye una sección de \"Conclusiones\"."]}],"p1":[{"d":1,"t":"mc","q":"Cada rasgo con el tipo de conocimiento: «Sensitivo y superficial»","o":["cotidiano","científico"],"c":1},{"d":1,"t":"mc","q":"Cada rasgo con el tipo de conocimiento: «Metódico y verificable»","o":["científico","cotidiano"],"c":1},{"d":1,"t":"mc","q":"Cada rasgo con el tipo de conocimiento: «Dogmático y asistemático»","o":["cotidiano","científico"],"c":1},{"d":1,"t":"mc","q":"Cada rasgo con el tipo de conocimiento: «Provisorio y comunicable»","o":["científico","cotidiano"],"c":1},{"d":2,"t":"mc","q":"Según Bourdieu y otros, ¿cuál es \"el obstáculo epistemológico por excelencia\" para el sociólogo?","o":["La familiaridad con el universo social","La falta de financiamiento","El uso de estadísticas","La falta de teoría"],"c":1},{"d":1,"t":"ord","q":"Ordená las etapas de la investigación empírica.","o":["comprobación","ruptura","estructuración. Orden correcto: ruptura","estructuración","comprobación"],"c":1},{"d":2,"t":"vf","q":"El tema y el problema de investigación son lo mismo.","a":false,"x":"Falso. El tema es el marco general del interés (por ejemplo, la biblioteca escolar). El problema es el conjunto de preguntas concretas que problematizan un aspecto del tema, con un recorte de espacio y tiempo.","c":2},{"d":2,"t":"vf","q":"El marco teórico tiene que reunir todo lo que se escribió sobre el tema; cuanto más largo, mejor.","a":false,"x":"Falso. No es el estado del arte completo ni se mide por la extensión. Es una elaboración propia que articula paradigmas, teorías y conceptos pertinentes al problema, vinculándolos con coherencia.","c":2},{"d":2,"t":"mc","q":"Cada tipo de diseño con su propósito: «Exploratorio»","o":["examinar un tema poco estudiado","caracterizar y medir propiedades de un fenómeno","valorar los resultados de una política o programa","buscar las causas de un fenómeno"],"c":2},{"d":2,"t":"mc","q":"Cada tipo de diseño con su propósito: «Descriptivo»","o":["caracterizar y medir propiedades de un fenómeno","examinar un tema poco estudiado","valorar los resultados de una política o programa","buscar las causas de un fenómeno"],"c":2},{"d":2,"t":"mc","q":"Cada tipo de diseño con su propósito: «Explicativo»","o":["buscar las causas de un fenómeno","caracterizar y medir propiedades de un fenómeno","anticipar el comportamiento futuro de variables","valorar los resultados de una política o programa"],"c":2},{"d
