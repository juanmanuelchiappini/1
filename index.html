<!DOCTYPE html>
<html lang="es">
<head>

<title>IFTS 13 RPG — Bibliotecología</title>
<style>
:root { --s: 3; --ink: #383838; --ink2: #f8f8f8; --frame: #5a6a8c; --frame2: #a8b8d8; --paper: #f8f8f0; --accent: #d2a92a; --bad: #c0392b; --good: #2f9e6e; }

.bars { display: inline-flex; gap: calc(var(--s)*.6px); vertical-align: middle; margin-left: calc(var(--s)*2px); }
.bars i { display: inline-block; width: calc(var(--s)*2.2px); height: calc(var(--s)*5px); background: #3a3d55; border-radius: 1px; }
.bars i.on { background: #7fd36b; } .bars.soc i.on { background: #f08ac0; }
#hud .right { text-align: right; display: flex; flex-direction: column; gap: calc(var(--s)*1.5px); align-items: flex-end; }
#endday { pointer-events: auto; }
/* ---------- Cuadro de diálogo ---------- */
#dialog { position: absolute; left: calc(var(--s)*3px); right: calc(var(--s)*3px); bottom: calc(var(--s)*3px); min-height: calc(var(--s)*42px); background: var(--paper); border: calc(var(--s)*2px) solid var(--frame); box-shadow: inset 0 0 0 calc(var(--s)*1px) var(--frame2), 0 0 0 calc(var(--s)*1px) #2a3048; border-radius: calc(var(--s)*4px); padding: calc(var(--s)*4px) calc(var(--s)*7px); cursor: pointer; }
#dialog .name { position: absolute; top: calc(var(--s)*-9px); left: calc(var(--s)*8px); background: #4a5a7c; color: #fff; font-weight: bold; padding: 0 calc(var(--s)*4px); border-radius: calc(var(--s)*2px); font-size: calc(var(--s)*6px); border: calc(var(--s)*1px) solid #2a3048; }
#dialog .txt { text-shadow: calc(var(--s)*.6px) calc(var(--s)*.6px) 0 #d8d8d0; white-space: pre-wrap; }

@keyframes bob { from { transform: translateY(0) } to { transform: translateY(calc(var(--s)*1.5px)) } }
#portrait { position: absolute; left: calc(var(--s)*6px); bottom: calc(var(--s)*50px); width: calc(var(--s)*48px); height: calc(var(--s)*48px); border: calc(var(--s)*2px) solid var(--frame); border-radius: calc(var(--s)*3px); box-shadow: 0 0 0 calc(var(--s)*1px) #2a3048; image-rendering: pixelated; background: #7fb9e6; }
/* ---------- Opciones ---------- */
#choices { position: absolute; right: calc(var(--s)*4px); bottom: calc(var(--s)*50px); background: var(--paper); border: calc(var(--s)*2px) solid var(--frame); box-shadow: inset 0 0 0 calc(var(--s)*1px) var(--frame2); border-radius: calc(var(--s)*4px); padding: calc(var(--s)*3px) calc(var(--s)*4px); max-width: 70%; max-height: calc(var(--s)*100px); overflow-y: auto; }
.btn { display: block; width: 100%; text-align: left; background: none; border: none; font: inherit; color: var(--ink); padding: calc(var(--s)*1.2px) calc(var(--s)*4px) calc(var(--s)*1.2px) calc(var(--s)*9px); cursor: pointer; position: relative; border-radius: calc(var(--s)*2px); }
.btn.focus, .btn:hover { background: #e4e8f4; }
.btn.focus::before { content: "▶"; position: absolute; left: calc(var(--s)*1.5px); color: #c0392b; font-size: .8em; top: 50%; transform: translateY(-50%); }
.btn:disabled { color: #9a9a9a; }
/* ---------- Paneles ---------- */
#panel { position: absolute; inset: calc(var(--s)*3px); background: var(--paper); border: calc(var(--s)*2px) solid var(--frame); box-shadow: inset 0 0 0 calc(var(--s)*1px) var(--frame2), 0 0 0 calc(var(--s)*1px) #2a3048; border-radius: calc(var(--s)*4px); display: flex; flex-direction: column; overflow: hidden; }
#panel .head { background: linear-gradient(#5a7ab8, #4a64a0); color: #fff; font-weight: bold; padding: calc(var(--s)*2px) calc(var(--s)*6px); text-shadow: calc(var(--s)*.6px) calc(var(--s)*.6px) 0 #223; display: flex; justify-content: space-between; align-items: center; gap: 6px; }

#panel .foot .btn { width: auto; flex: 1; text-align: center; background: #eef0f8; padding-left: calc(var(--s)*8px); }
.tabs { display: flex; gap: calc(var(--s)*1px); flex-wrap: wrap; }
.tabs .btn { width: auto; padding: 0 calc(var(--s)*3px) 0 calc(var(--s)*8px); color: #fff; font-size: .85em; }
.tabs .btn.on { background: rgba(255,255,255,.25); }
.tabs .btn.focus, .tabs .btn:hover { background: rgba(255,255,255,.35); }
.small { font-size: .82em; } .muted { color: #8a8a8a; } .good { color: var(--good); font-weight: bold; } .bad { color: var(--bad); font-weight: bold; }

.card h4 { margin: 0 0 calc(var(--s)*1px); font-size: 1em; color: #3a4a78; }

table.t td, table.t th { border-bottom: 1px solid #e0e3ee; padding: calc(var(--s)*1px) calc(var(--s)*2px); text-align: left; vertical-align: top; }

.timer i.warn { background: #e8b830; } .timer i.crit { background: #c0392b; }
.q { font-weight: bold; margin-bottom: calc(var(--s)*3px); }
.opt { display: block; width: 100%; margin: calc(var(--s)*1.2px) 0; text-align: left; background: #fff; border: calc(var(--s)*1px) solid #c8cee0; border-radius: calc(var(--s)*3px); font: inherit; color: var(--ink); padding: calc(var(--s)*2px) calc(var(--s)*4px) calc(var(--s)*2px) calc(var(--s)*9px); cursor: pointer; position: relative; }
.opt.focus, .opt:hover { border-color: #5a7ab8; background: #eef2ff; }
.opt.focus::before { content: "▶"; position: absolute; left: calc(var(--s)*2px); color: #c0392b; font-size: .8em; top: 50%; transform: translateY(-50%); }
.opt.ok { background: #d9f2e3; border-color: #2f9e6e; } .opt.no { background: #f8dcd8; border-color: #c0392b; } .opt.gone { opacity: .25; pointer-events: none; }

.row .lab { flex: 1; background: #fff; border: calc(var(--s)*1px) solid #c8cee0; border-radius: calc(var(--s)*3px); padding: calc(var(--s)*1.5px) calc(var(--s)*3px); }
.row .opt { flex: 1.2; margin: 0; }
.row .mini { flex: 0 0 auto; width: auto; padding: calc(var(--s)*1.5px) calc(var(--s)*3px) calc(var(--s)*1.5px) calc(var(--s)*8px); margin: 0; }
.comodines { display: flex; gap: calc(var(--s)*2px); flex-wrap: wrap; margin-top: calc(var(--s)*2px); }
.comodines .opt { width: auto; flex: 1; text-align: center; font-size: .82em; background: #fff8e0; }
.hint { background: #fff8e0; border: calc(var(--s)*1px) dashed #d2a92a; border-radius: calc(var(--s)*3px); padding: calc(var(--s)*2px) calc(var(--s)*3px); margin-top: calc(var(--s)*2px); font-size: .88em; }
/* ---------- Título y creación ---------- */
.title-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.logo { font-size: calc(var(--s)*17px); font-weight: 900; color: #f7d55a; letter-spacing: calc(var(--s)*.5px); text-shadow: calc(var(--s)*1px) calc(var(--s)*1px) 0 #8a3f2e, calc(var(--s)*2px) calc(var(--s)*2px) 0 #3a1c14; line-height: 1; }
.sub { color: #f4f0e0; font-weight: bold; margin: calc(var(--s)*2px) 0 calc(var(--s)*6px); text-shadow: calc(var(--s)*.6px) calc(var(--s)*.6px) 0 #000; font-size: calc(var(--s)*6.5px); }
.menu { background: var(--paper); border: calc(var(--s)*2px) solid var(--frame); border-radius: calc(var(--s)*4px); padding: calc(var(--s)*3px); min-width: 46%; }
.models { display: flex; gap: calc(var(--s)*4px); justify-content: center; }
.model { background: #fff; border: calc(var(--s)*1px) solid #c8cee0; border-radius: calc(var(--s)*3px); padding: calc(var(--s)*2px); cursor: pointer; font: inherit; color: var(--ink); }
.model canvas { width: calc(var(--s)*32px); height: calc(var(--s)*32px); image-rendering: pixelated; display: block; }
.model.on { border-color: #c0392b; box-shadow: 0 0 0 calc(var(--s)*1px) #c0392b; } .model.focus { background: #eef2ff; }
.swatches { display: flex; gap: calc(var(--s)*1.5px); flex-wrap: wrap; }
.sw { width: calc(var(--s)*10px); height: calc(var(--s)*10px); border-radius: calc(var(--s)*2px); border: calc(var(--s)*1px) solid #555; cursor: pointer; padding: 0; }
.sw.on { outline: calc(var(--s)*1px) solid #c0392b; outline-offset: calc(var(--s)*1px); } .sw.focus { box-shadow: 0 0 0 calc(var(--s)*1.5px) #5a7ab8; }
input.name { font: inherit; padding: calc(var(--s)*1.5px) calc(var(--s)*3px); border: calc(var(--s)*1px) solid #8a94b8; border-radius: calc(var(--s)*2px); width: calc(var(--s)*70px); max-width: 100%; }
#preview { width: calc(var(--s)*32px); height: calc(var(--s)*48px); image-rendering: pixelated; }
/* ---------- Avisos y transición ---------- */

#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .18s; }
#fade.on { opacity: 1; }
#cheat { position: absolute; left: 50%; top: 40%; transform: translate(-50%,-50%); background: #111; border: 2px solid #3f3; padding: 6px; }
#cheat input { font: 14px monospace; background: #000; color: #3f3; border: none; outline: none; width: 220px; }

#pad { display: flex; justify-content: space-between; align-items: center; width: min(100%, calc(240px * var(--s) + 40px)); max-width: 560px; padding: 0 4px; touch-action: none; }
.dpad { position: relative; width: 132px; height: 132px; }
.dpad button { position: absolute; width: 44px; height: 44px; background: #2b2e44; border: 2px solid #11121b; color: #9aa3c8; font-size: 18px; border-radius: 8px; touch-action: none; }

.dpad .c { left: 44px; top: 44px; background: #2b2e44; border-radius: 4px; pointer-events: none; }

#keys { color: #7e86aa; font-size: 12px; text-align: center; }

<body>

<script>

function dificultadProfe(p) {
  const e = { Baja:1, Media:2, Alta:3 }[p.exig];
  const pa = { Alta:1, Media:2, Baja:3 }[p.pac];
  const pr = { 'Básica':1, Intermedia:2, Avanzada:3 }[p.prof];
  if (!e) return { n: '6–8', txt: 'Variable' };
  const n = e + pa + pr;
  return { n, txt: n <= 4 ? 'Fácil' : n <= 6 ? 'Normal' : 'Difícil' };
}

e oro del cine (1931-1955).","Cada modelo con su apogeo: «Gringo» → el Nuevo cine de los 60.","¿Qué expresión cultural rechazaban los defensores del modelo hispanista por considerarla de los \"gringos\"? → El tango.","¿Desde qué año se fecha la gran ola de inmigración a la Argentina? → 1856."],"nombre":"Historia de los Procesos Culturales II","corto":"Historia II"},"ICI":{"clases":[{"t":"Ciencia, información y los paradigmas","ap":["¿De qué palabra latina viene \"ciencia\"? → Scientia, de scire, \"saber\".","Para Bunge, cuando la ciencia se aplica a mejorar el medio y producir bienes, se convierte en tecnología.","Cada sentido de la información: «Potencial» → la que podría dar un objeto.","Cada sentido de la información: «Efectiva» → la que necesita el receptor.","Cada sentido de la información: «Real» → la que efectivamente recibe el receptor.","La comunicación es solo la transmisión, una parte del proceso informativo. Además, la comunicación es social y simultánea, mientras que la información se piensa como un proceso lineal.","Para Briet, una estrella en el cielo, ¿es un documento? → No, pero su fotografía o el catálogo de estrellas sí lo son.","Ordená los paradigmas de Capurro: Físico → Cognitivo → Social.","Cada autor con su paradigma: «Shannon y Weaver» → físico.","Cada autor con su paradigma: «Wiener» → físico.","Cada autor con su paradigma: «Belkin» → cognitivo.","Cada autor con su paradigma: «Brookes» → cognitivo.","Cada autor con su paradigma: «Hjørland» → social.","Cada autor con su paradigma: «Blair» → social.","¿Qué crítica se le hace al paradigma físico? → Excluye al sujeto o usuario.","Ordená el modelo de Shannon y Weaver: Fuente → Emisor → Mensaje (canal o señal) → Receptor → Destinatario.","Cada abordaje con su descripción: «Multidisciplinar» → las disciplinas trabajan por separado.","Cada abordaje con su descripción: «Interdisciplinar» → dialogan y se complementan.","Cada abordaje con su descripción: «Transdisciplinar» → crean un campo común nuevo.","¿Por qué se dice \"ciencia de la información\" en singular? → Porque su objeto es uno solo, la información, en distintos contextos."]},{"t":"El proceso informativo documental y el SID","ap":["El mensaje es una expresión material (un documento); la información es una cualidad inmaterial que el mensaje tiene según el receptor.","¿Qué fase NO tiene el proceso informativo documental? → Creación.","«Silencio»: ¿qué le corresponde? → no se recupera un documento pertinente.","«Ruido»: ¿qué le corresponde? → se recuperan documentos que no sirven.","¿Cuál es el esquema del sistema según Bertalanffy? → Entrada, proceso, salida.","¿Qué es el \"macrosistema\" de un SID? → La organización en la que está inserto."]},{"t":"Bases de datos, TIC y difusión","ap":["En una tabla de datos: «Campo» → la columna.","En una tabla de datos: «Registro» → la fila.","Cada tipo de base de datos según Blajean: «Factual» → estadísticas.","Cada tipo de base de datos según Blajean: «De directorio» → personas o instituciones.","Cada tipo de base de datos según Blajean: «Documental» → cada registro es un documento.","¿Qué operador recupera A o B, pero no los dos a la vez? → XOR.","¿Qué es un tesauro? → Una lista de términos relacionados jerárquicamente, para indizar y recuperar.","Cada software con su institución: «ICA-AtoM» → archivos.","Cada software con su institución: «Koha» → bibliotecas.","Cada software con su institución: «CollectionSpace» → museos.","Son herramientas que se incorporan después de diseñar la estrategia y las normas.","Cada tipo de difusión: «Bajo demanda» → el usuario va a la institución (exhibición, visita guiada).","Cada tipo de difusión: «Por medios no documentales» → redes, exposiciones virtuales, boletines."]},{"t":"Las instituciones documentales","ap":["¿De qué palabra latina viene \"documento\"? → Docere, \"enseñar\".","Cada institución con su principio de organización: «Archivo» → procedencia y orden natural (según la actividad que generó los documentos).","Cada insti nales? → Estereotipo (cultural) y arquetipo (modelo simbólico profundo)."],"nombre":"Gestión de Bibliotecas Escolares","corto":"Gestión de Bib. Escolares"},"HSU":{"clases":[{"t":"Bibliología y el libro como testimonio","ap":["¿Qué estudia la bibliología? → El origen y la evolución del libro como objeto físico y los materiales que lo forman.","Cada término con su definición: «Bibliofilia» → el amor por los libros.","Cada término con su definición: «Bibliomanía» → acumular libros por vanidad.","Cada término con su definición: «Bibliofobia» → el odio al impreso.","¿De qué palabra latina viene \"libro\" y qué significa? → Liber, \"corteza de árbol\".","Cada marca de propiedad con su descripción: «Súper libris» → un escudo estampado en oro sobre la tapa de cuero.","Cada marca de propiedad con su descripción: «Ex libris» → una etiqueta pegada en el interior de la tapa.","¿Quién usó primero el término \"bibliología\"? → Gabriel Peignot.","¿Qué significan las raíces griegas de \"biblioteca\"? → \"Libro\" y \"armario o caja\".","¿Qué autor romano ya criticaba la bibliomanía? → Séneca.","Ordená la sucesión de soportes del libro según su materia: papiro (vegetal) → pergamino (piel animal) → papel (fibras textiles).","El ex libris, en sentido moderno, existe desde la imprenta y el grabado. Entre los siglos XV y XVIII predominan los heráldicos; desde el XVIII, las alegorías, y su gran florecimiento llega con el Modernismo."]},{"t":"Las bibliotecas de palacio en la Antigüedad","ap":["Ordená los soportes según aparecieron: tablilla de arcilla → papiro → pergamino → papel.","¿Cuál es la biblioteca más antigua descubierta hasta hoy? → Nippur, en el templo de Enlil.","¿En qué biblioteca las tablillas ya tenían algo parecido a una signatura en el lomo? → Ebla.","¿Qué rey asirio reunió la biblioteca de Nínive? → Asurbanipal.","Las tablillas de Tell el-Amarna son en su mayoría cartas diplomáticas escritas en acadio.","¿Cómo se identificaba cada tablilla mesopotámica? → Con un colofón con las primeras palabras de la obra.","¿Qué medidas tenía aproximadamente un rollo egipcio? → 30 cm de alto y de 5 a 6 m de largo.","El libro egipcio es el primero que usa tinta. Se escribía con tinta sobre papiro.","¿Qué era Akhetatón, donde está Tell el-Amarna? → La capital fundada por Amenhotep IV (Akenatón), abandonada en tiempos de Tutankamón."]},{"t":"Alejandría, Pérgamo y Roma","ap":["¿Quién compiló los Pinakes, considerados el primer catálogo? → Calímaco.","Ordená a los directores de la Biblioteca de Alejandría: Zenodoto → Apolonio de Rodas → Eratóstenes → Aristófanes de Bizancio → Apolonio el Eidógrafo → Aristarco de Samotracia.","Cada biblioteca con su especialidad: «Alejandría» → la filología (ediciones de textos y crítica gramatical).","Cada biblioteca con su especialidad: «Pérgamo» → la filosofía estoica y la lógica.","¿Qué era el sillybos? → La etiqueta del rollo con las primeras palabras de la obra; los romanos la llamaron index.","¿Qué director de Alejandría ordenó los fondos alfabéticamente por la primera letra del autor? → Zenodoto de Éfeso.","¿Qué significa el apodo \"Eidógrafo\" de Apolonio, el quinto director? → Clasificador: clasificó los géneros literarios.","Hay leyendas, pero no hechos comprobados: se habla de un incendio en la guerra de César y del regalo de Marco Antonio a Cleopatra, que Plutarco cuenta con dudas.","¿Qué dos factores explican la difusión del libro y la lectura en las polis griegas? → La escritura alfabética y la expansión de la enseñanza.","¿Qué forma de libro inventaron los romanos? → El códice."]},{"t":"La Edad Media y los incunables","ap":["Cada oficio del scriptorium con su tarea: «Armarius» → supervisaba el scriptorium y cuidaba los libros.","Cada oficio del scriptorium con su tarea: «Copista» → copiaba.","Cada oficio del scriptorium con su tarea: «Rubricator» → hacía las capitales y los títulos en rojo.","Cada oficio del scriptorium con su tarea: «Ligator» → encuadernaba.","¿Qué es un palimpsesto? → Un pergamino que s ráfico usa tipos móviles","El idioma","El tamaño","El tipo de tapa"],"c":4},{"d":2,"t":"vf","q":"La mayoría de los incunables está en lenguas romances.","a":false,"x":"Falso. La mayoría está en latín.","c":4}],"repaso":["¿Qué formato reemplazó al rollo? → El códice.","¿Qué hacían con los mejores rollos de Alejandría para conservarlos? → Los untaban con aceite de lino.","¿Cuándo empezó la decadencia de la Biblioteca de Alejandría según el apunte? → En el 145 a. C., cuando Ptolomeo VIII expulsó a Aristarco y a otros eruditos.","Era poco relevante y solía ocuparlo un profesor o un estudiante.","¿Qué era el \"sistema de copia\" de las universidades medievales? → Los libreros controlados por la universidad alquilaban los textos para que los estudiantes los copiaran.","Cada personaje con su aporte: «Isidoro de Sevilla» → las Etimologías.","Cada personaje con su aporte: «Al-Hakam II» → la biblioteca del alcázar de Córdoba.","Cada personaje con su aporte: «Alfonso X» → la gran biblioteca real del siglo XIII.","Cada personaje con su aporte: «Asurbanipal» → la biblioteca de Nínive.","Cada característica de los incunables con su descripción: «Reclamo» → la palabra con que empieza la página siguiente, al pie de la anterior.","Cada característica de los incunables con su descripción: «Calderón» → el signo ¶ que separa párrafos.","Cada característica de los incunables con su descripción: «Filigrana» → la marca de agua del papel.","Cada característica de los incunables con su descripción: «Marca tipográfica» → el emblema del impresor.","¿Qué diferencia a un incunable xilográfico de uno tipográfico? → El xilográfico sale de una plancha de madera grabada por página; el tipográfico usa tipos móviles.","La mayoría está en latín."],"nombre":"Historia de los Soportes y las Unidades de Información","corto":"Historia de los Soportes"},"ICS":{"clases":[{"t":"Qué es la ciencia y cómo se clasifica","ap":["¿Cómo definió Aristóteles a la ciencia? → Como un conocimiento cierto por las causas.","¿Qué autor define la ciencia como \"conocimientos racionales, ciertos o probables, obtenidos metódicamente, sistematizados y verificables\"? → Ander-Egg.","Cada tipo de ciencia con lo que estudia y cómo se valida: «Ciencias formales» → entes ideales; se validan por demostración.","Cada tipo de ciencia con lo que estudia y cómo se valida: «Ciencias fácticas» → hechos; se validan por verificación empírica.","De esta lista, ¿cuál es la única ciencia formal: astronomía, matemática, psicología, química, historia? → Matemática.","No se validan por la experiencia. La teología es una disciplina religiosa y la ética, una rama normativa de la filosofía; no entran en la clasificación de Bunge.","¿Qué rasgos tiene el conocimiento científico según Mario Bunge? → Racional, sistemático, exacto, verificable y falible.","Para Einstein, ¿cuál es el motor de toda verdadera ciencia? → La sensación de lo místico, la capacidad de asombro.","¿Cómo se validan las ciencias fácticas? → Por verificación empírica: observación y experimentación.","Producen verdades necesarias y formales; las verdades provisorias y falibles son propias de las ciencias fácticas."]},{"t":"Popper, Kuhn y Lakatos","ap":["¿Cuál es el criterio de Popper para saber si una teoría es científica? → Que sea falsable.","Ordená el ciclo de Kuhn: ciencia normal → anomalías → crisis → revolución científica → nuevo paradigma.","Según Kuhn, ¿qué es un paradigma? → El marco teórico, conceptual y metodológico que comparte una comunidad científica.","Cada concepto de Lakatos con su definición: «Núcleo duro» → las suposiciones centrales, que no se tocan.","Cada concepto de Lakatos con su definición: «Cinturón protector» → las hipótesis auxiliares, que se ajustan ante las anomalías.","Cada heurística con lo que indica: «Heurística negativa» → lo que no hay que hacer: no atacar el núcleo duro.","Cada heurística con lo que indica: «Heurística positiva» → lo que hay que hacer: generar nuevas hipótesis y predicciones.","Cada autor con su forma de cambio científico: «Popper» → por refutación de teorías.","Cada autor con su forma de cambio científico: «Kuhn» → por revoluciones abruptas.","Cada autor con su forma de cambio científico: «Lakatos» → por programas progresivos, de forma gradual.","La inconmensurabilidad se da entre paradigmas distintos, que no pueden compararse con una medida común.","¿Qué es el inductivismo, que Popper rechaza? → La idea de que se llega a leyes generales acumulando casos.","¿Cuándo un programa de investigación es progresivo según Lakatos? → Cuando predice hechos nuevos que se confirman."]},{"t":"El experimento de Milgram","ap":["En el experimento de Milgram, ¿qué porcentaje de participantes llegó a los 450 voltios en la versión básica? → Alrededor del 65 %.","¿Cómo explica Milgram la obediencia de los participantes? → Por el \"estado de agente\": la persona se ve como ejecutora de una autoridad legítima y le traspasa la responsabilidad.","¿Qué creían los participantes que estudiaba el experimento de Milgram? → La memoria y el aprendizaje.","Era un cómplice y nunca recibió descargas; los gritos eran una grabación.","¿Qué rango de voltaje tenía la máquina del experimento? → De 15 a 450 V, en 30 llaves de 15 en 15.","¿Qué pasó con la obediencia cuando dos experimentadores daban órdenes contrarias? → Cayó al 0 %.","¿Qué predijeron los psiquiatras antes del experimento? → Que casi nadie llegaría a los 450 V.","Cada explicación de Milgram con su idea: «Estado de agente» → la persona traspasa la responsabilidad a la autoridad.","Cada explicación de Milgram con su idea: «Escalada gradual» → se empieza con 15 V y se sube de a poco.","Cada explicación de Milgram con su idea: «Proximidad de la víctima» → cuanto más cerca, más pesa la responsabilidad social.","Cada explicación de Milgram con su idea: «Creencia en un mundo justo» → lleva a culpar a la víctima.","Ya existía desde el Código de Núremberg (1947); Milgram reforzó el debate y las regulaciones posteriores.","¿Qué símbolo de autoridad usaba el experimentador? → Una bata blanca."]},{"t":"¿La bibliotecología es una ciencia?","ap":["Cada postura con su idea sobre la bibliotecología y la Ciencia de la Información: «Subordinación» → la bibliotecología depende de la Ciencia de la Información.","Cada postura con su idea sobre la bibliotecología y la Ciencia de la Información: «Exclusión» → son campos autónomos.","Cada postura con su idea sobre la bibliotecología y la Ciencia de la Información: «Inclusión» → se integran en un espacio común.","¿Quién definió en 1968 la Ciencia de la Información y consideró a la bibliotecología un aspecto aplicado de ella? → Harold Borko.","¿Quién usó por primera vez la expresión \"ciencia de la biblioteca\", en 1808? → Martin Schrettinger.","¿Qué postura sobre bibliotecología y Ciencia de la Información considera el texto de la cátedra como la más realista? → Inclusión.","Según el TP, ¿con qué otras disciplinas forma la bibliotecología el campo de la Ciencia de la Información? → Archivología y museología.","Cada método de la bibliotecología con un ejemplo: «Investigación empírica» → encuestas y observación de usuarios.","Cada método de la bibliotecología con un ejemplo: «Análisis documental» → clasificar con CDD o CDU.","Cada método de la bibliotecología con un ejemplo: «Investigación bibliográfica» → revisar lo publicado sobre un tema.","¿Qué factores impulsaron la formalización de la Ciencia de la Información en EE. UU. hacia 1962? → La Segunda Guerra Mundial, la tecnología y la competencia de la Guerra Fría."]}],"p1":[{"d":1,"t":"mc","q":"¿Cómo definió Aristóteles a la ciencia?","o":["Como un conocimiento cierto por las causas","Como una emoción mística","Como algo falsable","Como un paradigma"],"c":1},{"d":2,"t":"mc","q":"¿Qué autor define la ciencia como \"conocimientos racionales, ciertos o probables, obtenidos metódicamente, sistematizados y verificables\"?","o":["Ander-Egg","Popper","Kuhn","Einstein"],"c":1},{"d":1,"t":"mc","q":"Cada tipo de ciencia con lo que estudia y cómo se valida: «Ciencias formales»","o":["entes ideales; se validan por demostración","hechos; se validan por verificación empírica"],"c":1},{"d":1,"t":"mc","q":"Cada tipo de ciencia con lo que estudia y cómo se valida: «Ciencias fácticas»","o":["hechos; se validan por verificación empírica","entes ideales; se validan por demostración"],"c":1},{"d":2,"t":"mc","q":"De esta lista, ¿cuál es la única ciencia formal: astronomía, matemática, psicología, química, historia?","o":["Matemática","Astronomía","Psicología","Historia"],"c":1},{"d":3,"t":"vf","q":"La teología y la ética son ciencias fácticas.","a":false,"x":"Falso. No se validan por la experiencia. La teología es una disciplina religiosa y la ética, una rama normativa de la filosofía; no entran en la clasificación de Bunge.","c":1},{"d":1,"t":"mc","q":"¿Cuál es el criterio de Popper para saber si una teoría es científica?","o":["Que sea falsable","Que se verifique muchas veces","Que la acepte la comunidad científica","Que sea útil"],"c":2},{"d":2,"t":"ord","q":"Ordená el ciclo de Kuhn.","o":["ciencia normal","anomalías","crisis","revolución científica","nuevo paradigma"],"c":2},{"d":2,"t":"mc","q":"Según Kuhn, ¿qué es un paradigma?","o":["El marco teórico, conceptual y metodológico que comparte una comunidad científica","Una hipótesis aislada","Un experimento","Una ley matemática"],"c":2},{"d":2,"t":"mc","q":"Cada concepto de Lakatos con su definición: «Núcleo duro»","o":["las suposiciones centrales, que no se tocan","las hipótesis auxiliares, que se ajustan ante las anomalías"],"c":2},{"d":2,"t":"mc","q":"Cada concepto de Lakatos con su definición: «Cinturón protector»","o":["las hipótesis auxiliares, que se ajustan ante las anomalías","las suposiciones centrales, que no se tocan"],"c":2},{"d":3,"t":"mc","q":"Cada heurística con lo que indica: «Heurística negativa»","o":["lo que no hay que hacer: no atacar el núcleo duro","lo que hay que hacer: generar nuevas hipótesis y predicciones"],"c":2},{"d":3,"t":"mc","q":"Cada heurística con lo que indica: «Heurística positiva»","o":["lo que hay que hacer: generar nuevas hipótesis y predicciones","lo que no hay que hacer: no atacar el núcleo duro"],"c":2},{"d":2,"t":"mc","q":"Cada autor con su forma de cambio científico: «Popper»","o":["por refutación de teorías","por programas progresivos, de forma gradual","por revoluciones abruptas"],"c":2},{"d":2,"t":"mc","q":"Cada autor con su forma de cambio científico: «Kuhn»","o":["por revoluciones abruptas","por programas progresivos, de forma gradual","por refutación de teorías"],"c":2},{"d":2,"t":"mc","q":"Cada autor con su forma de cambio científico: «Lakatos»","o":["por programas progresivos, de forma gradual","por refutación de teorías","por revoluciones abruptas"],"c":2},{"d":2,"t":"vf","q":"La inconmensurabilidad de Kuhn significa que todas las hipótesis dentro de un mismo paradigma son coherentes entre sí.","a":false,"x":"Falso. La inconmensurabilidad se da entre paradigmas distintos, que no pueden compararse con una medida común.","c":2},{"d":2,"t":"mc","q":"¿Qué rasgos tiene el conocimiento científico según Mario Bunge?","o":["Racional, sistemático, exacto, verificable y falible","Místico, dogmático y eterno","Útil, rápido y barato","Revelado y absoluto"],"c":1},{"d":2,"t":"mc","q":"Para Einstein, ¿cuál es el motor de toda verdadera ciencia?","o":["La sensación de lo místico, la capacidad de asombro","El dinero","La obediencia","La lógica formal"],"c":1},{"d":2,"t":"mc","q":"¿Cómo se validan las ciencias fácticas?","o":["Por verificación empírica: observación y experimentación","Por demostración lógica","Por autoridad","Por votación"],"c":1},{"d":2,"t":"vf","q":"Las ciencias formales producen verdades provisorias y falibles.","a":false,"x":"Falso. Producen verdades necesarias y formales; las verdades provisorias y falibles son propias de las ciencias fácticas.","c":1},{"d":2,"t":"mc","q":"¿Qué es el inductivismo, que Popper rechaza?","o":["La idea de que se llega a leyes generales acumulando casos","La idea de que toda teoría es falsable","Un tipo de paradigma","Un método de Lakatos"],"c":2},{"d":3,"t":"mc","q":"¿Cuándo un programa de investigación es progresivo según Lakatos?","o":["Cuando predice hechos nuevos que se confirman","Cuando tiene muchos investigadores","Cuando solo pone parches para explicar lo que ya pasó","Cuando nunca cambia su cinturón"],"c":2}],"p2":[{"d":2,"t":"mc","q":"En el experimento de Milgram, ¿qué porcentaje de participantes llegó a los 450 voltios en la versión básica?","o":["Alrededor del 65 %","0 %","10 %","100 %"],"c":3},{"d":2,"t":"mc","q":"¿Cómo explica Milgram la obediencia de los participantes?","o":["Por el \"estado de agente\": la persona se ve como ejecutora de una autoridad legítima y le traspasa la responsabilidad","Por sadismo","Por el dinero","Por falta de inteligencia"],"c":3},{"d":2,"t":"mc","q":"Cada postura con su idea sobre la bibliotecología y la Ciencia de la Información: «Subordinación»","o":["la bibliotecología depende de la Ciencia de la Información","son campos autónomos","se integran en un espacio común"],"c":4},{"d":2,"t":"mc","q":"Cada postura con su idea sobre la bibliotecología y la Ciencia de la Información: «Exclusión»","o":["son campos autónomos","se integran en un espacio común","la bibliotecología depende de la Ciencia de la Información"],"c":4},{"d":2,"t":"mc","q":"Cada postura con su idea sobre la bibliotecología y la Ciencia de la Información: «Inclusión»","o":["se integran en un espacio común","son campos autónomos","la bibliotecología depende de la Ciencia de la Información"],"c":4},{"d":2,"t":"mc","q":"¿Quién definió en 1968 la Ciencia de la Información y consideró a la bibliotecología un aspecto aplicado de ella?","o":["Harold Borko","Otlet","Schrettinger","Kuhn"],"c":4},{"d":2,"t":"mc","q":"¿Qué creían los participantes que estudiaba el experimento de Milgram?","o":["La memoria y el aprendizaje","La obediencia","La resistencia al dolor","La inteligencia"],"c":3},{"d":2,"t":"vf","q":"El 'alumno' del experimento de Milgram recibía descargas reales.","a":false,"x":"Falso. Era un cómplice y nunca recibió descargas; los gritos eran una grabación.","c":3},{"d":2,"t":"mc","q":"¿Qué rango de voltaje tenía la máquina del experimento?","o":["De 15 a 450 V, en 30 llaves de 15 en 15","De 1 a 100 V","De 100 a 1000 V","De 45 a 90 V"],"c":3},{"d":2,"t":"mc","q":"¿Qué pasó con la obediencia cuando dos experimentadores daban órdenes contrarias?","o":["Cayó al 0 %","Subió al 100 %","Quedó igual","Subió al 65 %"],"c":3},{"d":2,"t":"mc","q":"¿Qué predijeron los psiquiatras antes del experimento?","o":["Que casi nadie llegaría a los 450 V","Que todos llegarían al final","Que la mitad obedecería","Que las mujeres obedecerían más"],"c":3},{"d":2,"t":"mc","q":"Cada explicación de Milgram con su idea: «Estado de agente»","o":["la persona traspasa la responsabilidad a la autoridad","lleva a culpar a la víctima","se empieza con 15 V y se sube de a poco","cuanto más cerca, más pesa la responsabilidad social"],"c":3},{"d":2,"t":"mc","q":"Cada explicación de Milgram con su idea: «Escalada gradual»","o":["se empieza con 15 V y se sube de a poco","la persona traspasa la responsabilidad a la autoridad","cuanto más cerca, más pesa la responsabilidad social","lleva a culpar a la víctima"],"c":3},{"d":2,"t":"mc","q":"Cada explicación de Milgram con su idea: «Proximidad de la víctima»","o":["cuanto más cerca, más pesa la responsabilidad social","lleva a culpar a la víctima","se empieza con 15 V y se sube de a poco","la persona traspasa la responsabilidad a la autoridad"],"c":3},{"d":2,"t":"mc","q":"Cada explicación de Milgram con su idea: «Creencia en un mundo justo»","o":["lleva a culpar a la víctima","se empieza con 15 V y se sube de a poco","la persona traspasa la responsabilidad a la autoridad","cuanto más cerca, más pesa la responsabilidad social"],"c":3},{"d":3,"t":"vf","q":"El consentimiento informado se inventó a partir del experimento de Milgram.","a":false,"x":"Falso. Ya existía desde el Código de Núremberg (1947); Milgram reforzó el debate y las regulaciones posteriores.","c":3},{"d":2,"t":"mc","q":"¿Qué símbolo de autoridad usaba el experimentador?","o":["Una bata blanca","Un uniforme militar","Una corona","Un traje de policía"],"c":3},{"d":2,"t":"mc","q":"¿Quién usó por primera vez la expresión \"ciencia de la biblioteca\", en 1808?","o":["Martin Schrettinger","Harold Borko","Paul Otlet","Thomas Kuhn"],"c":4},{"d":2,"t":"mc","q":"¿Qué postura sobre bibliotecología y Ciencia de la Información considera el texto de la cátedra como la más realista?","o":["Inclusión","Subordinación","Exclusión","Ninguna"],"c":4},{"d":2,"t":"mc","q":"Según el TP, ¿con qué otras disciplinas forma la bibliotecología el campo de la Ciencia de la Información?","o":["Archivología y museología","Informática y periodismo","Física y química","Historia y geografía"],"c":4},{"d":2,"t":"mc","q":"Cada método de la bibliotecología con un ejemplo: «Investigación empírica»","o":["encuestas y observación de usuarios","revisar lo publicado sobre un tema","clasificar con CDD o CDU"],"c":4},{"d":2,"t":"mc","q":"Cada método de la bibliotecología con un ejemplo: «Análisis documental»","o":["clasificar con CDD o CDU","encuestas y observación de usuarios","revisar lo publicado sobre un tema"],"c":4},{"d":2,"t":"mc","q":"Cada método de la bibliotecología con un ejemplo: «Investigación bibliográfica»","o":["revisar lo publicado sobre un tema","encuestas y observación de usuarios","clasificar con CDD o CDU"],"c":4},{"d":2,"t":"mc","q":"¿Qué factores impulsaron la formalización de la Ciencia de la Información en EE. UU. hacia 1962?","o":["La Segunda Guerra Mundial, la tecnología y la competencia de la Guerra Fría","La Revolución francesa","La imprenta","El Renacimiento"],"c":4}],"fin":[{"d":2,"t":"mc","q":"Según Popper, ¿cómo progresa la ciencia?","o":["Por conjeturas y refutaciones","Por acumulación de verificaciones","Por revoluciones sociales","Por votación de la comunidad"],"c":2},{"d":2,"t":"mc","q":"¿Qué es la ciencia normal según Kuhn?","o":["La investigación que resuelve \"rompecabezas\" dentro de un paradigma","La que refuta paradigmas","La que no tiene método","La ciencia formal"],"c":2},{"d":2,"t":"vf","q":"Para Kuhn, la ciencia avanza solo por razones lógicas.","a":false,"x":"Falso. También influyen la resistencia, el conservadurismo y otros factores sociales de la comunidad científica.","c":2},{"d":3,"t":"mc","q":"¿Por qué se dice que Lakatos es un falsacionista \"sofisticado\"?","o":["Porque no falsea teorías aisladas sino que evalúa programas enteros","Porque rechaza toda falsación","Porque sigue a Kuhn","Porque usa matemáticas"],"c":2},{"d":2,"t":"mc","q":"Cada revolución científica con su cambio: «Astronomía»","o":["de la geocéntrica (Ptolomeo) a la heliocéntrica (Copérnico, Galileo, Kepler)","de la newtoniana a la relatividad y la cuántica"],"c":2},{"d":2,"t":"mc","q":"Cada revolución científica con su cambio: «Física»","o":["de la newtoniana a la relatividad y la cuántica","de la geocéntrica (Ptolomeo) a la heliocéntrica (Copérnico, Galileo, Kepler)"],"c":2},{"d":2,"t":"mc","q":"¿Qué pregunta histórica motivó el experimento de Milgram?","o":["Si cualquier persona podía torturar o matar por obedecer órdenes, después del Holocausto","Si la memoria mejora con castigos","Si la electricidad es peligrosa","Si las mujeres son más obedientes"],"c":3},{"d":2,"t":"vf","q":"En el experimento, las mujeres obedecieron mucho menos que los hombres.","a":false,"x":"Falso. No hubo diferencias significativas.","c":3},{"d":2,"t":"vf","q":"Para Aristóteles, la ciencia es un conocimiento cierto por las causas.","a":true,"x":"Verdadero. Y la ve subjetivamente como un hábito intelectual y objetivamente como un conjunto de conocimientos.","c":1},{"d":2,"t":"mc","q":"Para Borko, la bibliotecología es...","o":["Un aspecto aplicado de la Ciencia de la Información","Una ciencia formal","Una rama de la filosofía","Una técnica sin relación con la información"],"c":4}],"repaso":["Según Popper, ¿cómo progresa la ciencia? → Por conjeturas y refutaciones.","¿Qué es la ciencia normal según Kuhn? → La investigación que resuelve \"rompecabezas\" dentro de un paradigma.","También influyen la resistencia, el conservadurismo y otros factores sociales de la comunidad científica.","¿Por qué se dice que Lakatos es un falsacionista \"sofisticado\"? → Porque no falsea teorías aisladas sino que evalúa programas enteros.","Cada revolución científica con su cambio: «Astronomía» → de la geocéntrica (Ptolomeo) a la heliocéntrica (Copérnico, Galileo, Kepler).","Cada revolución científica con su cambio: «Física» → de la newtoniana a la relatividad y la cuántica.","¿Qué pregunta histórica motivó el experimento de Milgram? → Si cualquier persona podía torturar o matar por obedecer órdenes, después del Holocausto.","No hubo diferencias significativas.","Para Aristóteles, la ciencia es un conocimiento cierto por las causas. Y la ve subjetivamente como un hábito intelectual y objetivamente como un conjunto de conocimientos.","Para Borko, la bibliotecología es... → Un aspecto aplicado de la Ciencia de la Información."],"nombre":"Introducción a las Ciencias","corto":"Intro. a las Ciencias"},"LCL":{"clases":[{"t":"Teoría literaria y la tragedia griega","ap":["Según Bajtín, ¿qué son los géneros discursivos? → \"Tipos relativamente estables de enunciados\".","Cada tipo de género discursivo con su ejemplo: «Primario» → una conversación espontánea o una carta entre amigos.","Cada tipo de género discursivo con su ejemplo: «Secundario» → una novela, un artículo científico o una noticia.","¿Qué significa etimológicamente \"tragedia\"? → Canto del macho cabrío.","¿Qué es la catarsis según Aristóteles? → La purificación del espectador por el horror y la compasión.","La hybris es la desmesura, la soberbia. La mesura se resume en el lema \"nada en exceso\".","¿De qué culto nace el teatro griego? → El culto a Dionisos, dios del vino y la fertilidad.","¿Cuál es la gran ironía de Edipo rey? → Que Edipo maldice al asesino de Layo sin saber que se maldice a sí mismo."]},{"t":"La Edad Media y la Divina Comedia","ap":["Cada mester con sus rasgos: «Mester de clerecía» → culto, con cuaderna vía y autores conocidos, como Berceo.","Cada mester con sus rasgos: «Mester de juglaría» → popular, oral y anónimo, como el Cantar de Mio Cid.","¿Qué es la cuaderna vía? → Una estrofa de cuatro versos alejandrinos con una sola rima consonante.","Cada tópico literario con su sentido: «Locus amoenus» → un lugar placentero.","Cada tópico literario con su sentido: «Ubi sunt» → \"¿dónde están?\", la pregunta por lo que pasó.","Cada tópico literario con su sentido: «Carpe diem» → aprovechá el momento.","Cada tópico literario con su sentido: «Captatio benevolentiae» → la falsa modestia.","Cada guía de Dante con lo que representa: «Virgilio» → la razón; guía por el Infierno y el Purgatorio.","Cada guía de Dante con lo que representa: «Beatriz» → la fe; guía por el Paraíso.","¿Cuántos cantos tiene la Divina Comedia y en qué estrofa está escrita? → 100 cantos (1 de introducción más 3 cánticas de 33), en terza rima.","¿Quién es considerado el primer poeta castellano de nombre conocido? → Gonzalo de Berceo.","¿Qué tres fieras acosan a Dante en la selva oscura y qué representan? → Un leopardo, un león y una loba: la lujuria, la soberbia y la avaricia."]},{"t":"El Renacimiento y la cosmovisión isabelina","ap":["¿Qué cambio de visión del mundo trae el Renacimiento? → Del teocentrismo al antropocentrismo.","Cada imagen isabelina del orden con su descripción (Tillyard): «La cadena del ser» → una jerarquía continua que va de Dios a lo inanimado.","Cada imagen isabelina del orden con su descripción (Tillyard): «Los planos correspondientes» → macrocosmos, cuerpo político y microcosmos, conectados entre sí.","Cada imagen isabelina del orden con su descripción (Tillyard): «La danza cósmica» → una jerarquía en movimiento, como si el universo fuera música.","¿Dónde y cuándo nace el Renacimiento? → En Italia en el siglo XIV.","¿Qué obra se considera la primera novela moderna? → El Quijote de Cervantes.","Lo conocían, pero no querían alterar el viejo orden: su grandeza fue dar cabida a lo nuevo sin violentar lo antiguo.","¿Qué es la \"correspondencia\" más famosa de los planos isabelinos? → La del hombre (microcosmos) con el cosmos (macrocosmos).","Cada personaje de Hamlet con su papel: «Claudio» → asesinó al rey y se casó con Gertrudis.","Cada personaje de Hamlet con su papel: «Ofelia» → se vuelve loca y se ahoga.","Cada personaje de Hamlet con su papel: «Horacio» → el amigo fiel.","Cada personaje de Hamlet con su papel: «Fortinbrás» → el príncipe de Noruega que se queda con el trono.","¿Para qué prepara Hamlet una obra de teatro dentro de la obra? → Para confirmar la culpa de Claudio."]},{"t":"El Romanticismo","ap":["¿Cuál de estos rasgos NO es romántico? → El respeto estricto de las reglas clásicas.","Frankenstein es el científico, Victor. La criatura no tiene nombre.","¿Contra qué reacciona el Romanticismo? → Contra la razón neoclásica.","Cada obra con su autor: «Amalia» → José Mármol.","Cada obra con su autor: «María» → Jorge Isaacs.","Cada obra con su autor: «El matadero» → Esteban Echeverría.","Cada obra con su autor: «Facundo» → Domingo F. Sarmiento.","¿Por qué es importante Esteban Echeverría para la literatura argentina? → Porque trajo el Romanticismo desde Francia, el primer movimiento artístico que no llega desde España.","Se escribió hacia 1838-1840 y se publicó recién en 1871, después de su muerte, gracias a Juan María Gutiérrez.","¿Dónde y cómo se gestó Frankenstein? → En la Villa Diodati, cerca de Ginebra, en 1816, por un desafío de escribir historias de fantasmas.","¿Por qué el subtítulo de Frankenstein es \"el moderno Prometeo\"? → Porque, como el titán que robó el fuego a los dioses, Victor roba el secreto de la vida y lo castiga su propia creación.","¿Qué repite el cuervo del poema de Poe? → \"Nunca más\" (Nevermore).","¿Cuál era el gran tema de la Generación del 37? → Civilización y barbarie."]}],"p1":[{"d":2,"t":"mc","q":"Según Bajtín, ¿qué son los géneros discursivos?","o":["\"Tipos relativamente estables de enunciados\"","Moldes literarios inmutables","Novelas y cuentos","Reglas gramaticales"],"c":1},{"d":2,"t":"mc","q":"Cada tipo de género discursivo con su ejemplo: «Primario»","o":["una conversación espontánea o una carta entre amigos","una novela, un artículo científico o una noticia"],"c":1},{"d":2,"t":"mc","q":"Cada tipo de género discursivo con su ejemplo: «Secundario»","o":["una novela, un artículo científico o una noticia","una conversación espontánea o una carta entre amigos"],"c":1},{"d":1,"t":"mc","q":"¿Qué significa etimológicamente \"tragedia\"?","o":["Canto del macho cabrío","Muerte del héroe","Fiesta del vino","Máscara triste"],"c":1},{"d":2,"t":"mc","q":"¿Qué es la catarsis según Aristóteles?","o":["La purificación del espectador por el horror y la compasión","El error del héroe","El coro","El final feliz"],"c":1},{"d":2,"t":"vf","q":"La hybris es la mesura que los griegos admiraban.","a":false,"x":"Falso. La hybris es la desmesura, la soberbia. La mesura se resume en el lema \"nada en exceso\".","c":1},{"d":2,"t":"mc","q":"Cada mester con sus rasgos: «Mester de clerecía»","o":["culto, con cuaderna vía y autores conocidos, como Berceo","popular, oral y anónimo, como el Cantar de Mio Cid"],"c":2},{"d":2,"t":"mc","q":"Cada mester con sus rasgos: «Mester de juglaría»","o":["popular, oral y anónimo, como el Cantar de Mio Cid","culto, con cuaderna vía y autores conocidos, como Berceo"],"c":2},{"d":2,"t":"mc","q":"¿Qué es la cuaderna vía?","o":["Una estrofa de cuatro versos alejandrinos con una sola rima consonante","Cuatro versos octosílabos con rima asonante","Un soneto","Una terza rima"],"c":2},{"d":1,"t":"mc","q":"Cada tópico literario con su sentido: «Locus amoenus»","o":["un lugar placentero","la falsa modesti tiva, dramática, lírica), el modo de composición y el tema adecuado","Autor, texto y lector","Tema, estilo y estructura","Inicio, nudo y desenlace"],"c":1}],"repaso":["¿Qué rasgo medieval comparte la Divina Comedia con El conde Lucanor? → El didactismo: enseñar con alegorías o ejemplos.","¿Qué es la terza rima? → Tercetos endecasílabos encadenados (ABA BCB CDC), inventados por Dante.","Es al revés: el fraude y la traición, pecados de la razón, están más abajo y son más graves.","Cada época con su visión del mundo: «Edad Media» → teocentrismo.","Cada época con su visión del mundo: «Renacimiento» → antropocentrismo.","Cada época con su visión del mundo: «Época isabelina» → transición que conserva el orden medieval.","Cada época con su visión del mundo: «Romanticismo» → culto al yo.","¿Qué enfoque de los géneros literarios sostiene que el autor está por encima de las convenciones? → El romántico.","¿Qué dos ideas centrales tiene el dolce stil nuovo? → El amor que nace del corazón noble y la mujer ángel (donna angelicata).","¿Qué rasgo hace que El matadero se considere adelantado a su época? → Tiene rasgos realistas antes de tiempo y usa el habla popular.","Según Williams, ¿cuáles son los 3 niveles del género literario? → La posición (narrativa, dramática, lírica), el modo de composición y el tema adecuado."],"nombre":"Literatura y Corrientes Literarias","corto":"Literatura y Corrientes"},"LIJ":{"clases":[{"t":"Qué es la LIJ y su historia en el mundo","ap":["¿Qué significa que la LIJ tiene \"doble destinación\"? → Que su destinatario es el niño, pero tiene que convencer a los adultos que deciden qué se lee.","Es reciente: aparece hacia el siglo XVIII.","Cada componente del campo de la LIJ con su ejemplo: «Productores» → los escritores.","Cada componente del campo de la LIJ con su ejemplo: «Intermediarios» → editoriales, maestros y bibliotecarios.","Cada componente del campo de la LIJ con su ejemplo: «Legitimadores» → críticos y académicos.","Cada componente del campo de la LIJ con su ejemplo: «Público» → niños y jóvenes.","¿A quiénes apuntaban las moralejas de los cuentos de Perrault (1697)? → A las jóvenes de la corte de Luis XIV.","No eran para niños: los jóvenes los adoptaron. Gulliver es una sátira.","¿Qué publicación de José Martí es el hito de la LIJ latinoamericana? → La Edad de Oro (1889).","¿Dónde está ubicada la LIJ dentro del campo literario? → En la periferia: muy vital en el mercado pero con menos prestigio.","Lo que las diferencia es el destinatario. Comparten la función estética, y el texto de calidad para niños satisface también al adulto (Sánchez Corral).","¿Qué aporta Lewis Carroll con Alicia en el país de las maravillas? → El nonsense: una lógica onírica y el poder liberador del lenguaje.","¿Qué critica Díaz Rönner de Gulliver y Robinson Crusoe? → Que reflejan el individualismo, el desprecio por otras culturas y la esclavitud.","¿Qué es la raíz de la LIJ? → La literatura oral, folklórica y anónima que compartían niños y adultos."]},{"t":"La LIJ en la Argentina: tres paradigmas","ap":["Ordená los paradigmas de la LIJ argentina: \"enseñar deleitando\" → la renovación de María Elena Walsh y el CEAL → la autonomía del discurso literario infantil.","¿Qué libro se considera el primero escrito para chicos en la Argentina? → Cuentos de la selva, de Horacio Quiroga (1918).","¿Qué fue el Plan Nacional de Lectura (1986-1989)? → Una campaña con la que autores y especialistas recorrieron el país formando mediadores, impulsada por Hebe Clementi.","¿Quién es considerado el primer poeta para chicos en la Argentina? → José Sebastián Tallon, con La garganta del sapo (1925).","¿Qué es la \"literatura traicionada\" según Díaz Rönner? → La que se escribe para adoctrinar.","Cada colección o editorial con su dato: «Bolsillitos» → editorial Abril, dirigida por Boris Spivacow.","Cada colección o editorial con su dato: «Los cuentos de Polidoro» → CEAL, dirigida por Beatriz Ferro.","Cada colección o editorial con su dato: «Libros del Quirquincho» → las nuevas editoriales desde los 80.","Desde los 80, ¿cuál sigue siendo el tema más difícil para la LIJ? → La sexualidad."]},{"t":"La censura en la última dictadura","ap":["¿Cuál fue uno de los fundamentos para prohibir La torre de cubos de Laura Devetach? → Su \"ilimitada fantasía\".","La censura provocaba autocensura: si un libro no figuraba en ninguna lista, se dejaba de leer 'por las dudas'.","Cada libro prohibido con su contenido: «El pueblo que no quería ser gris» → un rey ordena pintar todo de gris.","Cada libro prohibido con su contenido: «Cinco dedos» → la mano roja se une contra la mano verde.","Cada libro prohibido con su contenido: «La torre de cubos» → la \"ilimitada fantasía\" y la crítica social.","¿Qué es la Biblioteca de Libros Prohibidos del Archivo Provincial de la Memoria de Córdoba? → Un espacio abierto desde 2007 donde se pueden leer libros censurados y se hacen talleres con escuelas.","¿Qué era la \"Operación Claridad\"? → El plan de la dictadura contra la cultura y la educación, donde se consideraba que se formaban ideas \"subversivas\".","¿Cómo concebían los censores al niño lector? → Como un \"recipiente vacío\" al que había que proteger de la \"ilimitada fantasía\".","¿Qué pasó en Córdoba el 29 de abril de 1976? → Se hizo una quema colectiva de libros por orden del general Menéndez.","Muchas veces eran profesionales formados, incluso civiles: Devetach cuenta que los fundamentos contra su libro los escribieron \"dos colegas\".","¿Por qué sobrevivió El principito aunque figuraba en varias listas? → Por la gran cantidad de ediciones que circulaban.","¿Qué dedicatoria incluyó Laura Devetach en la reedición de 1984 de La torre de cubos? → \"A todas las maestras y todos los maestros que hicieron rodar estos cuentos cuando no se podía\".","¿Qué libro de referencia sobre la censura cultural escribieron Invernizzi y Gociol? → Un golpe a los libros (Eudeba, 2003)."]},{"t":"El libro álbum","ap":["¿Qué es un libro álbum? → Un libro en el que imagen, texto y diseño construyen juntos el sentido.","Cada obra con su rasgo: «Cuentos en verso para niños perversos» → una reescritura paródica de los clásicos, en verso (Dahl y Blake).","Cada obra con su rasgo: «Caperuza» → un libro sin palabras, en el que el rojo invade a la niña.","Cada obra con su rasgo: «Cabeza hueca, cabeza seca» → una edición bilingüe en tupí guaraní, sobre la leyenda del Caipora.","En El pueblo que no quería ser gris, ¿qué colores usa el habitante que desobedece al rey? → Rojo, azul y blanco.","¿Qué único texto tiene Caperuza, de Beatriz Martín Vidal? → \"Enrojeciendo\".","¿Qué leyenda recrea Cabeza hueca, cabeza seca y cuál es su tema? → La del Caipora, protector de la selva; el límite y el respeto por la naturaleza."]}],"p1":[{"d":2,"t":"mc","q":"¿Qué significa que la LIJ tiene \"doble destinación\"?","o":["Que su destinatario es el niño, pero tiene que convencer a los adultos que deciden qué se lee","Que se lee dos veces","Que es para niños y jóvenes","Que tiene texto e imagen"],"c":1},{"d":2,"t":"vf","q":"La idea de la infancia como una etapa distinta de la adultez existió siempre.","a":false,"x":"Falso. Es reciente: aparece hacia el siglo XVIII.","c":1},{"d":2,"t":"mc","q":"Cada componente del campo de la LIJ con su ejemplo: «Productores»","o":["los escritores","niños y jóvenes","editoriales, maestros y bibliotecarios","críticos y académicos"],"c":1},{"d":2,"t":"mc","q":"Cada componente del campo de la LIJ con su ejemplo: «Intermediarios»","o":["editoriales, maestros y bibliotecarios","críticos y académicos","niños y jóvenes","los escritores"],"c":1},{"d":2,"t":"mc","q":"Cada componente del campo de la LIJ con su ejemplo: «Legitimadores»","o":["críticos y académicos","niños y jóvenes","editoriales, maestros y bibliotecarios","los escritores"],"c":1},{"d":2,"t":"mc","q":"Cada componente del campo de la LIJ con su ejemplo: «Público»","o":["niños y jóvenes","los escritores","editoriales, maestros y bibliotecarios","críticos y académicos"],"c":1},{"d":2,"t":"mc","q":"¿A quiénes apuntaban las moralejas de los cuentos de Perrault (1697)?","o":["A las jóvenes de la corte de Luis XIV","A los niños campesinos","A los soldados","A los monjes"],"c":1},{"d":2,"t":"vf","q":"Robinson Crusoe y Los viajes de Gulliver se escribieron para niños.","a":false,"x":"Falso. No eran para niños: los jóvenes los adoptaron. Gulliver es una sátira.","c":1},{"d":1,"t":"mc","q":"¿Qué publicación de José Martí es el hito de la LIJ latinoamericana?","o":["La Edad de Oro (1889)","Versos sencillos","Nuestra América","Ismaelillo"],"c":1},{"d":2,"t":"ord","q":"Ordená los paradigmas de la LIJ argentina.","o":["\"enseñar deleitando\"","la renovación de María Elena Walsh y el CEAL","la autonomía del discurso literario infantil"],"c":2},{"d":2,"t":"mc","q":"¿Qué libro se considera el primero escrito para chicos en la Argentina?","o":["Cuentos de la selva, de Horacio Quiroga (1918)","Martín Fierro","Tutú Marambá","La garganta del sapo"],"c":2},{"d":2,"t":"mc","q":"¿Qué fue el Plan Nacional de Lectura (1986-1989)?","o":["Una campaña con la que autores y especialistas recorrieron el país formando mediadores, impulsada por Hebe Clementi","Una lista de libros prohibidos","Una editorial","Un premio"],"c":2},{"d":2,"t":"mc","q":"¿Dónde está ubicada la LIJ dentro del campo literario?","o":["En la periferia: muy vital en el mercado pero con menos prestigio","En el centro, con el mayor prestigio","Fuera del campo literario","En el campo científico"],"c":1},{"d":2,"t":"vf","q":"Lo que diferencia a la literatura infantil de la literatura en general es la calidad.","a":false,"x":"Falso. Lo que las diferencia es el destinatario. Comparten la función estética, y el texto de calidad para niños satisface también al adulto (Sánchez Corral).","c":1},{"d":2,"t":"mc","q":"¿Qué aporta Lewis Carroll con Alicia en el país de las maravillas?","o":["El nonsense: una lógica onírica y el poder liberador del lenguaje","La moraleja cortesana","La fábula","La novela de aventuras"],"c":1},{"d":2,"t":"mc","q":"¿Qué critica Díaz Rönner de Gulliver y Robinson Crusoe?","o":["Que reflejan el individualismo, el desprecio por otras culturas y la esclavitud","Que son muy cortos","Que no tienen ilustraciones","Que están en verso"],"c":1},{"d":2,"t":"mc","q":"¿Qué es la raíz de la LIJ?","o":["La literatura oral, folklórica y anónima que compartían niños y adultos","Los manuales escolares","Las revistas de historietas","Los libros de texto"],"c":1},{"d":2,"t":"mc","q":"¿Quién es considerado el primer poeta para chicos en la Argentina?","o":["José Sebastián Tallon, con La garganta del sapo (1925)","Horacio Quiroga","María Elena Walsh","Javier Villafañe"],"c":2},{"d":2,"t":"mc","q":"¿Qué es la \"literatura traicionada\" según Díaz Rönner?","o":["La que se escribe para adoctrinar","La literatura traducida","La que se prohíbe","La que no tiene ilustraciones"],"c":2},{"d":2,"t":"mc","q":"Cada colección o editorial con su dato: «Bolsillitos»","o":["editorial Abril, dirigida por Boris Spivacow","CEAL, dirigida por Beatriz Ferro","las nuevas editoriales desde los 80"],"c":2},{"d":2,"t":"mc","q":"Cada colección o editorial con su dato: «Los cuentos de Polidoro»","o":["CEAL, dirigida por Beatriz Ferro","editorial Abril, dirigida por Boris Spivacow","las nuevas editoriales desde los 80"],"c":2},{"d":2,"t":"mc","q":"Cada colección o editorial con su dato: «Libros del Quirquincho»","o":["las nuevas editoriales desde los 80","editorial Abril, dirigida por Boris Spivacow","CEAL, dirigida por Beatriz Ferro"],"c":2},{"d":2,"t":"mc","q":"Desde los 80, ¿cuál sigue siendo el tema más difícil para la LIJ?","o":["La sexualidad","La muerte","Los nuevos tipos de familia","La desocupación"],"c":2}],"p2":[{"d":2,"t":"mc","q":"¿Cuál fue uno de los fundamentos para prohibir La torre de cubos de Laura Devetach?","o":["Su \"ilimitada fantasía\"","Que tenía errores de ortografía","Que era muy cara","Que era extranjera"],"c":3},{"d":2,"t":"vf","q":"La censura provocaba autocensura: si un libro no figuraba en ninguna lista, se dejaba de leer 'por las dudas'.","a":true,"x":"Verdadero.","c":3},{"d":2,"t":"mc","q":"Cada libro prohibido con su contenido: «El pueblo que no quería ser gris»","o":["un rey ordena pintar todo de gris","la \"ilimitada fantasía\" y la crítica social","la mano roja se une contra la mano verde"],"c":3},{"d":2,"t":"mc","q":"Cada libro prohibido con su contenido: «Cinco dedos»","o":["la mano roja se une contra la mano verde","un rey ordena pintar todo de gris","la \"ilimitada fantasía\" y la crítica social"],"c":3},{"d":2,"t":"mc","q":"Cada libro prohibido con su contenido: «La torre de cubos»","o":["la \"ilimitada fantasía\" y la crítica social","la mano roja se une contra la mano verde","un rey ordena pintar todo de gris"],"c":3},{"d":1,"t":"mc","q":"¿Qué es la Biblioteca de Libros Prohibidos del Archivo Provincial de la Memoria de Córdoba?","o":["Un espacio abierto desde 2007 donde se pueden leer libros censurados y se hacen talleres con escuelas","Una biblioteca que guarda libros pero no deja leerlos","Un depósito militar","Una editorial"],"c":3},{"d":2,"t":"mc","q":"¿Qué es un libro álbum?","o":["Un libro en el que imagen, texto y diseño construyen juntos el sentido","Un libro de fotos familiares","Un libro sin ilustraciones","Un cuaderno"],"c":4},{"d":2,"t":"mc","q":"Cada obra con su rasgo: «Cuentos en verso para niños perversos»","o":["una reescritura paródica de los clásicos, en verso (Dahl y Blake)","una edición bilingüe en tupí guaraní, sobre la leyenda del Caipora","un libro sin palabras, en el que el rojo invade a la niña"],"c":4},{"d":2,"t":"mc","q":"Cada obra con su rasgo: «Caperuza»","o":["un libro sin palabras, en el que el rojo invade a la niña","una reescritura paródica de los clásicos, en verso (Dahl y Blake)","una edición bilingüe en tupí guaraní, sobre la leyenda del Caipora"],"c":4},{"d":2,"t":"mc","q":"Cada obra con su rasgo: «Cabeza hueca, cabeza seca»","o":["una edición bilingüe en tupí guaraní, sobre la leyenda del Caipora","una reescritura paródica de los clásicos, en verso (Dahl y Blake)","un libro sin palabras, en el que el rojo invade a la niña"],"c":4},{"d":2,"t":"mc","q":"¿Qué era la \"Operación Claridad\"?","o":["El plan de la dictadura contra la cultura y la educación, donde se consideraba que se formaban ideas \"subversivas\"","Una campaña de alfabetización","Un programa de bibliotecas","Una editorial"],"c":3},{"d":2,"t":"mc","q":"¿Cómo concebían los censores al niño lector?","o":["Como un \"recipiente vacío\" al que había que proteger de la \"ilimitada fantasía\"","Como un lector crítico","Como un adulto pequeño","Como un ciudadano con derechos"],"c":3},{"d":2,"t":"mc","q":"¿Qué pasó en Córdoba el 29 de abril de 1976?","o":["Se hizo una quema colectiva de libros por orden del general Menéndez","Se inauguró la Biblioteca de Libros Prohibidos","Se publicó La torre de cubos","Se fundó el CEAL"],"c":3},{"d":2,"t":"vf","q":"Los censores de la dictadura eran siempre militares sin formación.","a":false,"x":"Falso. Muchas veces eran profesionales formados, incluso civiles: Devetach cuenta que los fundamentos contra su libro los escribieron \"dos colegas\".","c":3},{"d":2,"t":"mc","q":"¿Por qué sobrevivió El principito aunque figuraba en varias listas?","o":["Por la gran cantidad de ediciones que circulaban","Porque era francés","Porque era de catequesis","Porque lo protegió la SNEP"],"c":3},{"d":2,"t":"mc","q":"¿Qué dedicatoria incluyó Laura Devetach en la reedición de 1984 de La torre de cubos?","o":["\"A todas las maestras y todos los maestros que hicieron rodar estos cuentos cuando no se podía\"","\"A mis hijos\"","\"A la patria\"","\"A los censores\""],"c":3},{"d":2,"t":"mc","q":"¿Qué libro de referencia sobre la censura cultural escribieron Invernizzi y Gociol?","o":["Un golpe a los libros (Eudeba, 2003)","Libros que muerden","La Edad de Oro","Educación y memoria"],"c":3},{"d":2,"t":"mc","q":"En El pueblo que no quería ser gris, ¿qué colores usa el habitante que desobedece al rey?","o":["Rojo, azul y blanco","Negro y blanco","Verde y amarillo","Solo gris"],"c":4},{"d":2,"t":"mc","q":"¿Qué único texto tiene Caperuza, de Beatriz Martín Vidal?","o":["\"Enrojeciendo\"","\"Había una vez\"","\"Fin\"","\"Lobo\""],"c":4},{"d":2,"t":"mc","q":"¿Qué leyenda recrea Cabeza hueca, cabeza seca y cuál es su tema?","o":["La del Caipora, protector de la selva; el límite y el respeto por la naturaleza","La Llorona; el miedo","El Familiar; la avaricia","La Pachamama; la cosecha"],"c":4}],"fin":[{"d":2,"t":"mc","q":"¿Qué editorial tuvo que quemar su propio material por orden judicial?","o":["El Centro Editor de América Latina (CEAL)","Colihue","Sudamericana","Estrada"],"c":2},{"d":2,"t":"mc","q":"En un libro álbum, ¿qué relación tiene la imagen con el texto?","o":["Agrega, contradice o calla: no repite lo que dice el texto","Lo repite exactamente","No tiene relación","Siempre es decorativa"],"c":4},{"d":2,"t":"mc","q":"¿Qué tiene de particular El cochinito de Carlota, de David McKee?","o":["Sus ilustraciones muy detalladas cuentan historias paralelas que el texto no menciona","No tiene imágenes","Está en tupí guaraní","Es un libro prohibido"],"c":4},{"d":2,"t":"mc","q":"Cada forma de resistencia con su descripción: «Enterrar o esconder»","o":["libros en pozos o bajo tanques de agua","copias caseras que circulaban entre docentes","escribir y leer en doble sentido","cubrir las tapas para que no se reconocieran"],"c":3},{"d":2,"t":"mc","q":"Cada forma de resistencia con su descripción: «Forrar»","o":["cubrir las tapas para que no se reconocieran","libros en pozos o bajo tanques de agua","escribir y leer en doble sentido","copias caseras que circulaban entre docentes"],"c":3},{"d":2,"t":"mc","q":"Cada forma de resistencia con su descripción: «Mimeógrafo»","o":["copias caseras que circulaban entre docentes","escribir y leer en doble sentido","cubrir las tapas para que no se reconocieran","libros en pozos o bajo tanques de agua"],"c":3},{"d":2,"t":"mc","q":"Cada forma de resistencia con su descripción: «Escritura elíptica»","o":["escribir y leer en doble sentido","cubrir las tapas para que no se reconocieran","copias caseras que circulaban entre docentes","libros en pozos o bajo tanques de agua"],"c":3},{"d":2,"t":"mc","q":"¿Qué hace la Biblioteca de Libros Prohibidos de Córdoba con su catálogo?","o":["Lo mantiene abierto: \"no está terminado\"","Lo cerró en 2007","Lo destruyó","Lo vende"],"c":3},{"d":2,"t":"vf","q":"Hay una sola infancia, igual para todos.","a":false,"x":"Falso. No es lo mismo la infancia urbana de clase media que la campesina o la de una villa; además, la infancia es una construcción histórica.","c":1},{"d":2,"t":"mc","q":"¿Qué hizo el Plan Nacional de Lectura de Hebe Clementi?","o":["Recorrer el país formando mediadores: maestros, padres y bibliotecarios","Prohibir libros","Fundar el CEAL","Publicar La Edad de Oro"],"c":2}],"repaso":["¿Qué editorial tuvo que quemar su propio material por orden judicial? → El Centro Editor de América Latina (CEAL).","En un libro álbum, ¿qué relación tiene la imagen con el texto? → Agrega, contradice o calla: no repite lo que dice el texto.","¿Qué tiene de particular El cochinito de Carlota, de David McKee? → Sus ilustraciones muy detalladas cuentan historias paralelas que el texto no menciona.","Cada forma de resistencia con su descripción: «Enterrar o esconder» → libros en pozos o bajo tanques de agua.","Cada forma de resistencia con su descripción: «Forrar» → cubrir las tapas para que no se reconocieran.","Cada forma de resistencia con su descripción: «Mimeógrafo» → copias caseras que circulaban entre docentes.","Cada forma de resistencia con su descripción: «Escritura elíptica» → escribir y leer en doble sentido.","¿Qué hace la Biblioteca de Libros Prohibidos de Córdoba con su catálogo? → Lo mantiene abierto: \"no está terminado\".","No es lo mismo la infancia urbana de clase media que la campesina o la de una villa; además, la infancia es una construcción histórica.","¿Qué hizo el Plan Nacional de Lectura de Hebe Clementi? → Recorrer el país formando mediadores: maestros, padres y bibliotecarios."],"nombre":"Literatura Infantil y Juvenil","corto":"Literatura Infantil y Juvenil"},"PRA1":{"clases":[{"t":"La biblioteca pública según la UNESCO","ap":["Según el Manifiesto de la UNESCO (1994), ¿cómo tiene que ser la biblioteca pública en principio? → Gratuita.","Ni los fondos ni los servicios pueden estar sujetos a censura ideológica, política o religiosa, ni a presiones comerciales.","¿Cómo define el Manifiesto al bibliotecario? → Un intermediario activo entre los usuarios y los recursos.","En 2022 lo reemplazó un nuevo Manifiesto IFLA-UNESCO.","¿De qué depende, según el Manifiesto, la libertad, la prosperidad y el desarrollo de la sociedad? → De ciudadanos bien informados que ejerzan sus derechos democráticos.","¿Para quiénes prevé el Manifiesto servicios específicos? → Para quienes no pueden usar los servicios comunes: minorías lingüísticas, personas con discapacidad, hospitalizadas o privadas de libertad."]},{"t":"Bibliotecas públicas y populares en la Argentina","ap":["Cada tipo de biblioteca con su forma de gobierno: «Biblioteca pública» → forma parte del Estado y tiene un funcionario designado.","Cada tipo de biblioteca con su forma de gobierno: «Biblioteca popular» → asociación civil gobernada por la asamblea de socios.","¿Cuántas bibliotecas públicas verificó la primera etapa del Censo Nacional (2021)? → 125.","Solo 44 de 125 lo tienen. Las otras 81 usan fichas, planillas o libros de actas, o no registran su acervo.","En una biblioteca popular, ¿cuál es el órgano soberano? → La asamblea de asociados.","Cada cargo de la comisión directiva con su tarea: «Presidente» → representa a la biblioteca y desempata.","Cada cargo de la comisión directiva con su tarea: «Secretario» → redacta las actas y lleva el libro de actas.","Cada cargo de la comisión directiva con su tarea: «Tesorero» → cobra las cuotas, lleva la contabilidad y hace el balance.","Cada cargo de la comisión directiva con su tarea: «Vocal suplente» → tiene voz pero no voto, salvo cuando reemplaza a un titular.","¿Cuál es la vía legítima para plantear un conflicto institucional en una biblioteca popular? → La asamblea extraordinaria.","Cada tipo de comunicación interna con su dirección: «Descendente» → de los directivos hacia el personal; típica de las organizaciones burocráticas.","Cada tipo de comunicación interna con su dirección: «Ascendente» → del personal hacia los directivos.","Cada tipo de comunicación interna con su dirección: «Lateral» → entre pares del mismo nivel.","¿Qué organismo nacional coordina las bibliotecas públicas del Estado en la Argentina? → Ninguno: nunca existió; la BNMM propone crear un Sistema Nacional de Bibliotecas Públicas.","¿Qué es una biblioteca mixta según el censo? → Una que cumple dos funciones a la vez, por ejemplo popular y pública.","¿Qué palabras tiene que incluir el nombre de una biblioteca popular en su estatuto? → \"Asociación Civil\" y \"Biblioteca Popular\".","Son voluntarios y no cobran.","Cada red de comunicación de Bavelas con su forma: «Timón» → todos se comunican a través de una persona central.","Cada red de comunicación de Bavelas con su forma: «Cadena» → la información pasa de uno a otro en línea.","Cada red de comunicación de Bavelas con su forma: «Círculo» → cada uno se comunica con los dos de al lado.","Cada red de comunicación de Bavelas con su forma: «Totalmente conectada» → todos se comunican con todos."]},{"t":"La biblioteca nacional: los tres informes","ap":["Según la definición de la UNESCO de 1970, ¿qué función define a una biblioteca nacional? → Adquirir y conservar ejemplares de todo lo impreso en el país, como biblioteca de depósito legal.","Cada informe con su enfoque: «Sylvestre (1987)» → práctico y de planificación: las Directrices.","Cada informe con su enfoque: «Line (1989)» → lo que la biblioteca debería hacer según las necesidades del país; es escéptico.","Cada informe con su enfoque: «Cornish (1991)» → el impacto de las nuevas tecnologías, con una encuesta a 62 bibliotecas nacionales.","¿Cuál es la paradoja que señala Line? → Los países desarrollados tienen las mejores bibliotecas nacionales pero las necesitan menos; los países pobres las necesitan más pero pueden sostenerlas menos.","¿Qué programa de la UNESCO encargó los tres informes sobre bibliotecas nacionales? → UNISIST y el Programa General de Información (PGI), a través de la IFLA.","Según Sylvestre, ¿qué tipo de bibliotecas \"nacionales\" quedan afuera de la definición de 1970? → Las temáticas (como la Biblioteca Nacional de Medicina de EE. UU.) y las regionales o de un grupo lingüístico.","¿Cuál es la función esencial de una biblioteca nacional según Line? → La colección nacional.","Cada función con su número en la lista de Cornish (o simplemente con su descripción): «Depósito legal» → recibir ejemplares de todo lo publicado en el país.","Cada función con su número en la lista de Cornish (o simplemente con su descripción): «Bibliografía nacional» → registrar la producción editorial del país.","Cada función con su número en la lista de Cornish (o simplemente con su descripción): «Suministro internacional de documentos» → ser el centro de envío de documentos a otros países.","Cada función con su número en la lista de Cornish (o simplemente con su descripción): «Conservación del patrimonio» → preservar el patrimonio impreso.","Según Fuentes Romero, ¿qué debe hacer la biblioteca nacional de un país menos desarrollado? → Integrarse a la realidad del país y coordinar todo el sistema.","¿Qué tipo de biblioteca es la BCN (Biblioteca del Congreso de la Nación)? → Parlamentaria y pública: sirve a los legisladores y al público general."]},{"t":"Bibliotecas digitales y bibliotecología social","ap":["Cada tipo de biblioteca con su definición: «Electrónica» → gestiona sus procesos electrónicamente y conserva su colección impresa y su edificio.","Cada tipo de biblioteca con su definición: «Digital» → tiene colecciones digitalizadas, organizadas y con acceso local o remoto.","Cada tipo de biblioteca con su definición: «Virtual» → no tiene existencia física y se accede solo por internet.","Cada tipo de biblioteca con su definición: «Híbrida» → combina lo tradicional con lo electrónico.","Es una colección digital, electrónica y virtual, pero \"biblioteca\" exige una organización con misión, personal, recursos y una comunidad de usuarios.","Ordená el recorrido histórico de los términos según Galán Gall: biblioteca electrónica (acceso local) → biblioteca virtual (catálogos por internet) → biblioteca digital (acceso a los documentos primarios).","¿Qué es una biblioteca automatizada en la escala de Buckland? → Una con colecciones en papel y procesos informatizados.","¿Cuál es la situación más común de las bibliotecas hoy? → Híbrida: combina lo tradicional con lo electrónico.","Aunque no tenga edificio, sigue siendo una biblioteca: selecciona, procesa, organiza y presta servicios.","Cada concepto con su definición: «Disinformation» → información falsa difundida con intención de engañar.","Cada concepto con su definición: «Misinformation» → información falsa difundida sin intención, por error.","Cada concepto con su definición: «Posverdad» → las emociones y creencias pesan más que los hechos.","Cada concepto con su definición: «Fake news» → noticias falsas con formato periodístico.","¿Qué propone la bibliotecología social? → Un profesional comprometido con la comunidad, la inclusión y el acceso a la información."]}],"p1":[{"d":1,"t":"mc","q":"Según el Manifiesto de la UNESCO (1994), ¿cómo tiene que ser la biblioteca pública en principio?","o":["Gratuita","Arancelada","Solo para socios","Privada"],"c":1},{"d":2,"t":"vf","q":"El Manifiesto admite la censura religiosa si la comunidad lo pide.","a":false,"x":"Falso. Ni los fondos ni los servicios pueden estar sujetos a censura ideológica, política o religiosa, n uestros propios puntos de vista que producen los sistemas de personalización.","¿Qué epígrafe de Goethe abre el texto de Falcato? → \"Nadie es más esclavo que quien se tiene por libre y no lo es\".","¿Por qué mucha gente no se capacita en búsqueda de información, según Falcato? → Porque se naturaliza que cualquiera sabe usar las herramientas y quien no sabe se avergüenza.","Cada visión de la información con su descripción: «Visión \"documentaria\"» → la información como cosa o mercancía que se adquiere, procesa y almacena.","Cada visión de la información con su descripción: «Visión como proceso» → informare, \"dar forma\": un proceso interno de cada persona.","¿Qué concepto de Vygotski usa Falcato para pensar la biblioteca como espacio de aprendizaje? → La zona de desarrollo próximo: lo que se resuelve con ayuda frente a lo que se resuelve solo.","Hay acceso abierto, pero no libertad absoluta: el exceso de información, los trolls, los filtros y las recomendaciones siguen limitando el acceso."]},{"t":"El movimiento de acceso abierto","ap":["Cada vía del acceso abierto con su definición: «Vía verde» → el autoarchivo en repositorios.","Cada vía del acceso abierto con su definición: «Vía dorada» → la publicación en revistas de acceso abierto.","¿Qué es el \"triple pago\" de las revistas híbridas? → La institución paga el sueldo del investigador, después paga la APC para liberar el artículo y además paga la suscripción a la revista.","De un 24 % de artículos en acceso abierto, el 22 % era por la vía verde y solo el 2 % por la dorada.","¿Qué región es la más avanzada en acceso abierto no comercial, según Fushimi? → América Latina, con SciELO, Redalyc, Latindex y LA Referencia.","¿Qué es el big deal? → La venta de suscripciones en paquetes cerrados que obligan a pagar títulos que la biblioteca no necesita.","Según Larivière y otros (2016), ¿qué porcentaje de los artículos publicaban las 5 grandes editoriales en 2013? → 51 %.","¿Qué \"vieja tradición\" y qué \"nueva tecnología\" convergen según la Declaración de Budapest? → El deseo de los científicos de publicar sin cobrar, e internet.","¿Qué es arXiv? → Un repositorio temático de física, desde 1991 (vía verde).","¿Qué grupo es el más poderoso entre los actores del acceso abierto, según Fushimi? → Los editores, dueños del copyright.","¿Qué propone Babini para el futuro del acceso abierto? → Que las universidades encabecen un acceso abierto cooperativo y no comercial."]},{"t":"Repositorios y la Ley 26.899","ap":["Ordená estos hechos: Biblioteca Electrónica de CyT (2002) → primera JBDU (2003) → Comité de Expertos en Repositorios (2009) → creación formal del SNRD (2011) → Ley 26.899 (2013) → reglamentación de la ley (2016).","Según la Ley 26.899, ¿en qué plazo hay que depositar la producción científica financiada con fondos públicos? → No más de 6 meses desde su publicación.","¿Qué pasa con quien incumple la Ley 26.899? → Queda \"no elegible\" para recibir financiamiento público.","Cada actor con su postura frente a los repositorios, según Fushimi: «Bibliotecarios» → los más activos y militantes.","Cada actor con su postura frente a los repositorios, según Fushimi: «Universidades nacionales» → pasivas, \"dejar hacer\".","Cada actor con su postura frente a los repositorios, según Fushimi: «Autores o investigadores» → de acuerdo moderadamente, pero priorizan el prestigio.","Cada actor con su postura frente a los repositorios, según Fushimi: «Revistas académicas argentinas» → alineadas con los repositorios.","¿Qué marco teórico usa Fushimi para analizar los repositorios? → La construcción social de la tecnología (SCOT), que ve a los repositorios como artefactos socio-técnicos.","¿De qué universidad es el repositorio SEDICI? → UNLP.","¿Qué protocolo internacional permite que un repositorio sea interoperable y que sus datos se \"cosechen\"? → OAI-PMH.","En el marco SCOT, ¿qué es la \"flexibilidad interpretativa\"? → Que cada grupo social entiende el artefacto a su manera, como en el ejemplo de la bicicleta de Pinch y Bijker.","¿Qué diferencia hay entre un repositorio \"adherido\" y uno \"integrado\" al SNRD? → El adherido hizo el trámite formal; el integrado además cumple las directrices técnicas y ya es cosechado por el portal.","Según la Ley 26.899, ¿en qué plazo se depositan los datos primarios de investigación? → No más de 5 años.","¿Qué porcentaje de los desarrollos de repositorios lideraron los bibliotecarios, según Fushimi? → 71 %.","Desde 2013, por la ley y los PICT-O, se aceleró la creación de repositorios: en 2014-2015 se crearon tantos como en los 7 años anteriores."]},{"t":"Dominio público y digitalización DIY","ap":["¿Cuántos años después de la muerte del autor entra su obra al dominio público en Argentina? → 70.","¿Qué es una obra huérfana? → Una obra cuyo titular de derechos no se conoce o no se puede encontrar.","Ordená el proceso del proyecto Dominio Público: digitalizar con el escáner DIY → posprocesar con ScanTailor → hacer el OCR con Tesseract (hOCR) → extraer los campos con Python y expresiones regulares (CSV) → integrar los datos a la base, evitando duplicados.","¿Qué plazo de protección daba el Estatuto de la Reina Ana (1710), la primera ley de copyright? → 14 años desde la publicación.","¿Qué significa que la protección del derecho de autor es \"automática\"? → Que toda obra queda protegida desde que se fija en un soporte, aunque no se registre.","¿En qué proyecto uruguayo se inspira dominiopublico.org.ar? → Autores.uy."]}],"p1":[{"d":2,"t":"mc","q":"¿Qué es el efecto Dunning-Kruger?","o":["La tendencia a sobreestimar la propia competencia, por la que quienes más necesitan capacitarse no se inscriben","Un algoritmo de búsqueda","Un tipo de burbuja de filtros","Una ley de acceso abierto"],"c":1},{"d":2,"t":"mc","q":"¿Qué es una burbuja de filtros, según Pariser?","o":["El encierro en nuestros propios puntos de vista que producen los sistemas de personalización","Un antivirus","Un tipo de catálogo","Un repositorio"],"c":1},{"d":1,
